 Le <strong>plagiat<\/strong> (copier sans citer, y compris une reformulation proche) est éliminatoire ; les outils de détection sont systématiques.<\/p>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>Une revue de littérature se termine par un cadre d'analyse (les concepts retenus et leurs liens), pas par un résumé.<\/p><\/div>"},{"title":"La méthodologie","html":"<p>La méthodologie justifie comment tu réponds à la question — c'est la partie la plus regardée par le jury.<\/p>\n<dl>\n  <dt>Approche<\/dt><dd>quantitative (mesurer, tester des hypothèses sur des données chiffrées), qualitative (comprendre par entretiens, observation), ou mixte.<\/dd>\n  <dt>Données<\/dt><dd>secondaires (balance âgée, historique de règlements, extraits ERP) ou primaires (entretiens avec les commerciaux, questionnaire clients).<\/dd>\n  <dt>Échantillon<\/dt><dd>périmètre, période, taille, critères d'exclusion ; représentativité et limites.<\/dd>\n  <dt>Analyse<\/dt><dd>statistiques descriptives, comparaison avant/après, régression ; pour le qualitatif, analyse thématique des entretiens.<\/dd>\n  <dt>Biais<\/dt><dd>sélection, désirabilité sociale (entretiens), endogénéité, effet de contexte (un client majeur qui change de comportement).<\/dd>\n<\/dl>\n<p><strong>Éthique et confidentialité<\/strong> : anonymiser les clients, obtenir l'accord de l'entreprise pour l'usage des données, respecter le RGPD ; prévoir une version confidentielle du mémoire si nécessaire.<\/p>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>Chaque choix méthodologique se justifie par rapport à la question posée ; les limites annoncées sont un signe de rigueur, pas de faiblesse.<\/p><\/div>"},{"title":"Rédiger le mémoire","html":"<p>Plan type (60-80 pages hors annexes) : introduction (contexte, constat, problématique, annonce du plan) ; partie 1 : revue de littérature et cadre d'analyse ; partie 2 : terrain et méthodologie ; partie 3 : résultats et discussion ; conclusion (réponse à la problématique, apports, limites, pistes) ; bibliographie ; annexes.<\/p>\n<ul>\n  <li>Style : phrases courtes, temps présent, vocabulaire précis, pas de « je » excessif (préférer « cette étude », « nous »).<\/li>\n  <li>Tableaux et figures numérotés, titrés, sourcés, commentés dans le texte — un graphique non commenté ne compte pas.<\/li>\n  <li>Les <strong>recommandations managériales<\/strong> distinguent un mémoire professionnel : concrètes, chiffrées, hiérarchisées, avec conditions de mise en œuvre.<\/li>\n  <li>Relecture en trois passes : fond (logique), forme (orthographe, cohérence), mise en page (sommaire automatique, pagination, en-têtes).<\/li>\n<\/ul>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>Le jury lit d'abord l'introduction et la conclusion : elles doivent se répondre exactement (question posée / réponse apportée).<\/p><\/div>"},{"title":"La soutenance","html":"<p>Format habituel : 15-20 minutes de présentation, 20-30 minutes de questions. La présentation ne répète pas le mémoire : elle en donne le fil (question → démarche → résultats clés → recommandations → limites et apports personnels).<\/p>\n<ul>\n  <li>10-12 slides maximum, une idée par slide, chiffres lisibles, pas de texte lu.<\/li>\n  <li>Répéter chronomètre en main ; prévoir les questions probables (pourquoi cette méthode ? quelles limites ? que changerais-tu ? quel lien avec le cours X ?).<\/li>\n  <li>Répondre aux questions en reformulant, en assumant les limites, sans se justifier à l'excès ; « je ne sais pas, mais voici comment je le vérifierais » est une bonne réponse.<\/li>\n<\/ul>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>La soutenance évalue la maîtrise du sujet et le recul, pas la récitation. Le lien explicite avec les cours du master est souvent valorisé.<\/p><\/div>"},{"title":"Application : plan détaillé d'un mémoire sur le recouvrement","html":"<p>Titre de travail : « Priorisation des relances et performance du recouvrement : le cas d'une entreprise de services ».<\/p>\n<ol>\n  <li><strong>Introduction<\/strong> : poids du crédit client dans le BFR des PME, constat d'un DSO supérieur aux conditions contractuelles, problématique, hypothèses.<\/li>\n  <li><strong>Partie 1 — Cadre théorique<\/strong> : crédit client et BFR (finance d'entreprise) ; risque de crédit et IFRS 9 (gestion des risques) ; théories du comportement de paiement ; outils numériques de pilotage.<\/li>\n  <li><strong>Partie 2 — Terrain et méthode<\/strong> : présentation de l'entreprise (anonymisée), données (balance âgée sur 12 mois, historique de relances), construction du scoring, protocole avant/après, entretiens avec les commerciaux.<\/li>\n  <li><strong>Partie 3 — Résultats<\/strong> : évolution du DSO et de la part > 90 jours, régression délai de paiement / relances / montant / litiges, retours qualitatifs ; discussion (effets, limites, endogénéité).<\/li>\n  <li><strong>Conclusion et recommandations<\/strong> : généraliser le scoring, automatiser via l'ERP, indicateurs de suivi, gains chiffrés (cash, agios, provisions).<\/li>\n<\/ol>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>Ce plan mobilise quatre modules du master (valeur, risques, trésorerie, outils numériques) : c'est exactement ce qu'attend un jury de mémoire professionnel.<\/p><\/div>"}],"glossary":[{"term":"Problématique","def":"Question centrale, précise et discutable, à laquelle le mémoire apporte une réponse argumentée."},{"term":"Hypothèse","def":"Réponse provisoire à la problématique, formulée pour être testée (confirmée, nuancée ou infirmée)."},{"term":"Revue de littérature","def":"Synthèse critique des travaux existants sur le sujet, qui débouche sur un cadre d'analyse."},{"term":"Cadre théorique / d'analyse","def":"Ensemble des concepts et relations retenus pour lire le terrain."},{"term":"Méthodologie","def":"Ensemble justifié des choix de démarche, de données et d'analyse pour répondre à la question."},{"term":"Approche quantitative / qualitative","def":"Mesurer et tester sur des données chiffrées / comprendre par entretiens, observations, documents."},{"term":"Données primaires / secondaires","def":"Collectées pour l'étude (entretiens, questionnaire) / déjà existantes (comptabilité, ERP, statistiques)."},{"term":"Étude de cas","def":"Analyse approfondie d'une organisation ou d'une situation, fréquente en mémoire professionnel."},{"term":"Biais de sélection","def":"Distorsion due à un échantillon non représentatif de la population étudiée."},{"term":"Triangulation","def":"Croisement de plusieurs sources ou méthodes pour renforcer la validité des résultats."},{"term":"Validité / fiabilité","def":"Le résultat mesure-t-il bien ce qu'il prétend mesurer / serait-il le même si l'étude était refaite ?"},{"term":"Normes APA","def":"Standard de citation : (Auteur, année) dans le texte, référence complète en bibliographie."},{"term":"Plagiat","def":"Reprise d'un texte ou d'une idée sans citation de la source, y compris par reformulation proche ; sanction éliminatoire."},{"term":"Recommandations managériales","def":"Propositions concrètes, chiffrées et hiérarchisées issues des résultats, destinées à l'entreprise."},{"term":"Limites","def":"Restrictions de portée des résultats (échantillon, période, méthode), à expliciter dans la discussion."}],"formulas":[{"name":"Formuler une problématique","f":"« Dans quelle mesure [levier] permet-il [effet attendu] dans [contexte] ? »","note":"Une question, un périmètre, une réponse nuancée possible."},{"name":"Entonnoir de construction","f":"Thème → Constat → Question de recherche → Hypothèses (H1, H2…) → Périmètre","note":"Chaque étape resserre la précédente."},{"name":"Plan type et poids indicatifs","f":"Intro 10 % · Littérature 25 % · Méthodologie 15 % · Résultats 30 % · Discussion 15 % · Conclusion 5 %","note":"60-80 pages hors annexes."},{"name":"Grille de lecture d'un article","f":"Question posée · Méthode · Données · Résultats · Limites · Apport pour mon étude","note":"Une ligne par source."},{"name":"Citation APA dans le texte","f":"(Nom, année) ou Nom (année) ; citation directe : (Nom, année, p. X)","note":"Deux auteurs : (Nom & Nom, année) ; trois et plus : (Nom et al., année)."},{"name":"Référence APA (article)","f":"Nom, I. (année). Titre de l'article. Nom de la revue, volume(numéro), pages. DOI","note":"Titre de revue en italique."},{"name":"Référence APA (ouvrage)","f":"Nom, I. (année). Titre de l'ouvrage (édition). Éditeur.","note":"Ex. : Vernimmen, P. (2024). Finance d'entreprise. Dalloz."},{"name":"Structure de la soutenance","f":"Question → Démarche → 3 résultats clés → Recommandations → Limites et apports (15-20 min, ≤ 12 slides)","note":"Une idée par slide."},{"name":"Rétroplanning type","f":"M-6 sujet validé · M-5 littérature · M-4 données · M-3 analyse · M-2 rédaction · M-1 relecture et dépôt","note":"Adapter au calendrier de l'école."}],"quiz":[{"q":"Lequel de ces énoncés est une problématique et non un thème ?","options":["Le recouvrement client dans les PME","Dans quelle mesure un scoring de relance réduit-il le DSO d'une PME de services ?","Les normes IFRS","La trésorerie"],"correct":1,"explain":"Une problématique est une question précise, discutable, à laquelle on peut répondre de façon nuancée."},{"q":"La revue de littérature doit se conclure par :","options":["Un résumé chronologique des auteurs","Un cadre d'analyse mobilisé ensuite sur le terrain","La bibliographie","Les recommandations"],"correct":1,"explain":"Elle sert à construire les concepts avec lesquels on lira les données."},{"q":"Une balance âgée extraite de l'ERP est une donnée :","options":["Primaire","Secondaire","Qualitative","Inexploitable"],"correct":1,"explain":"Elle existe indépendamment de l'étude ; un entretien mené pour le mémoire serait une donnée primaire."},{"q":"Dans le texte, une citation APA de deux auteurs s'écrit :","options":["(Nom et Nom 2020)","(Nom & Nom, 2020)","Nom, Nom, 2020","[1]"],"correct":1,"explain":"Format APA : (Nom & Nom, année) ; à partir de trois auteurs : (Nom et al., année)."},{"q":"Reformuler un paragraphe d'un article sans citer la source est :","options":["Autorisé si les mots changent","Du plagiat","Une paraphrase acceptable","Une citation indirecte valide"],"correct":1,"explain":"L'idée appartient à l'auteur : toute reprise, même reformulée, doit être citée."},{"q":"Expliciter les limites de son étude dans la discussion :","options":["Fait baisser la note","Est attendu et témoigne de rigueur","Est inutile","Remplace la conclusion"],"correct":1,"explain":"Le jury valorise le recul critique ; taire les limites est perçu comme une faiblesse."},{"q":"Ce qui distingue un mémoire professionnel d'un mémoire de recherche pur :","options":["L'absence de bibliographie","Des recommandations managériales concrètes et chiffrées","Une longueur supérieure","L'absence de méthodologie"],"correct":1,"explain":"Le mémoire professionnel doit déboucher sur des propositions applicables par l'entreprise."},{"q":"Face à une question du jury dont on ignore la réponse, la meilleure attitude est :","options":["Inventer une réponse","Reconnaître la limite et expliquer comment on vérifierait","Changer de sujet","Rester silencieux"],"correct":1,"explain":"Le jury évalue le recul et la démarche, pas l'omniscience."}],"exercises":[{"title":"Reformuler une problématique","statement":"Transforme le thème « la digitalisation du recouvrement » en une problématique, puis formule deux hypothèses testables.","solution":"Problématique : « Dans quelle mesure l'automatisation de la relance client (scoring, relances programmées) améliore-t-elle le délai de paiement et le taux de recouvrement d'une PME de services ? » H1 : l'automatisation réduit le DSO d'au moins 5 jours en 6 mois. H2 : l'effet est plus marqué sur les petites créances (< 5 k€) que sur les grands comptes, où la négociation prime."},{"title":"Citer correctement","statement":"Rédige la référence APA complète d'un article fictif : auteurs Marie Dupont et Karim Benali, 2022, « Crédit client et performance des PME », Revue Française de Gestion, volume 48, numéro 302, pages 45-63. Puis la citation dans le texte.","solution":"Bibliographie : Dupont, M., & Benali, K. (2022). Crédit client et performance des PME. Revue Française de Gestion, 48(302), 45-63. Dans le texte : (Dupont & Benali, 2022) ou « Dupont et Benali (2022) montrent que… »."},{"title":"Construire un protocole avant/après","statement":"Tu disposes de 12 mois de balance âgée : 6 mois avant et 6 mois après la mise en place d'un scoring de relance. Décris le protocole d'analyse et deux biais à contrôler.","solution":"Protocole : (1) indicateurs mensuels (DSO, part > 90 j, taux de recouvrement) sur les deux périodes ; (2) test de Student sur la différence de moyennes avant/après ; (3) régression au niveau facture avec indicatrice « après », montant, litige, client. Biais : saisonnalité du CA (comparer aux mêmes mois de l'année précédente) ; changement de portefeuille clients ou de conditions de paiement pendant la période (exclure les clients entrés/sortis, contrôler par variables)."}],"notes":""},{"id":"anglais","code":"S10","priority":2,"title":"Business English for finance","tagline":"Le vocabulaire des états financiers, du crédit client et de la trésorerie, plus les emails de relance et la présentation orale en anglais.","hue":96,"lessons":[{"title":"Financial statements vocabulary","html":"<p>Les trois états financiers et leur vocabulaire de base :<\/p>\n<dl>\n  <dt>Balance sheet<\/dt><dd>bilan — assets (actifs), liabilities (passifs/dettes), equity (capitaux propres), current vs non-current (courant / non courant), accounts receivable (créances clients), accounts payable (dettes fournisseurs), inventory (stocks), retained earnings (réserves).<\/dd>\n  <dt>Income statement / P&amp;L<\/dt><dd>compte de résultat — revenue / sales / turnover (chiffre d'affaires), cost of goods sold (coût des ventes), gross margin (marge brute), operating expenses (charges d'exploitation), EBITDA, operating income (résultat d'exploitation), net income (résultat net), earnings per share (BPA).<\/dd>\n  <dt>Cash flow statement<\/dt><dd>tableau de flux — operating / investing / financing activities, capital expenditure (capex), free cash flow, working capital (BFR), depreciation and amortisation.<\/dd>\n<\/dl>\n<p>Verbes utiles : to book / to record (comptabiliser), to accrue (provisionner une charge à payer), to write off (passer en perte), to impair (déprécier), to consolidate, to reconcile (rapprocher), to disclose (publier / mentionner en annexe).<\/p>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>Receivable = on nous doit ; payable = nous devons. Revenue/turnover = CA ; income/earnings/profit = résultat.<\/p><\/div>"},{"title":"Receivables and collections vocabulary","html":"<p>Le vocabulaire quotidien du crédit client en anglais :<\/p>\n<dl>\n  <dt>Aging report / aged receivables<\/dt><dd>balance âgée ; buckets (tranches) : current, 1-30 days past due, 31-60, 61-90, over 90.<\/dd>\n  <dt>Overdue / past due / outstanding<\/dt><dd>en retard / échu non payé / en cours (non encore réglé, échu ou non).<\/dd>\n  <dt>Payment terms<\/dt><dd>conditions de paiement : net 30 (30 jours date de facture), end of month + 45 days, 2/10 net 30 (2 % d'escompte si paiement sous 10 jours).<\/dd>\n  <dt>Dunning / collection process<\/dt><dd>processus de relance : reminder (relance), final notice / formal notice (mise en demeure), to escalate (transmettre au niveau supérieur), to hand over to a collection agency (confier à une société de recouvrement), legal action.<\/dd>\n  <dt>Bad debt / doubtful debt<\/dt><dd>créance irrécouvrable / douteuse ; allowance (provision) for doubtful accounts ; write-off (passage en perte).<\/dd>\n  <dt>Dispute / credit note / remittance advice<\/dt><dd>litige / avoir / avis de règlement.<\/dd>\n  <dt>DSO (days sales outstanding)<\/dt><dd>délai moyen de recouvrement ; credit limit (plafond de crédit) ; credit hold (blocage des livraisons).<\/dd>\n<\/dl>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>« Outstanding » n'est pas forcément en retard ; « overdue » l'est. « Write off » = perte définitive ; « allowance » = provision.<\/p><\/div>"},{"title":"Treasury and corporate finance vocabulary","html":"<p><strong>Trésorerie<\/strong> : cash flow forecast (prévision de trésorerie), cash position (position), overdraft (découvert), credit line / revolving credit facility (ligne de crédit), factoring (affacturage), cash pooling, bank reconciliation (rapprochement), hedging (couverture), foreign exchange (FX) exposure, interest rate swap.<\/p>\n<p><strong>Finance d'entreprise<\/strong> : leverage / gearing (endettement), covenant, equity vs debt financing, share issue / rights issue (augmentation de capital avec DPS), bond issue (émission obligataire), credit rating, working capital requirement (BFR), discounted cash flow, weighted average cost of capital (WACC), enterprise value vs equity value, net debt.<\/p>\n<p><strong>M&amp;A<\/strong> : merger (fusion), acquisition / takeover (rachat), bid (offre), due diligence, term sheet, closing, earn-out, synergies, goodwill, leveraged buy-out.<\/p>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>Working capital = BFR (pas « fonds de roulement » au sens français) ; leverage = endettement ; to hedge = couvrir.<\/p><\/div>"},{"title":"Writing collection emails in English","html":"<p>Un email de relance efficace est court, factuel, poli et précis sur l'action attendue. Ton gradué selon le niveau de relance :<\/p>\n<ul>\n  <li><strong>Reminder 1 (friendly)<\/strong> : « I hope this email finds you well. According to our records, invoice no. 2024-118 for €4,250.00, due on 15 June, remains outstanding. Could you please confirm when we can expect payment? Please disregard this message if payment has already been made. »<\/li>\n  <li><strong>Reminder 2 (firm)<\/strong> : « Despite our previous reminder, invoice no. 2024-118 is now 30 days overdue. We kindly ask you to settle the outstanding balance of €4,250.00 by 20 July. Should there be any dispute regarding this invoice, please let us know as soon as possible. »<\/li>\n  <li><strong>Final notice<\/strong> : « This is a final notice. Unless payment of €4,250.00 is received by 31 July, we will have no alternative but to place your account on credit hold and refer the matter to our legal department, in accordance with our terms and conditions. »<\/li>\n<\/ul>\n<p>Formules utiles : « as per our records », « please find attached a copy of the invoice », « we would appreciate your prompt payment », « thank you for your cooperation », « kind regards ». Éviter les majuscules, les menaces vagues et les excuses excessives.<\/p>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>Objet clair (« Overdue invoice no. X – €Y »), montant et date dans la première phrase, action attendue et date limite explicites.<\/p><\/div>"},{"title":"Numbers, dates and presenting figures orally","html":"<p>Les chiffres à l'oral et à l'écrit :<\/p>\n<ul>\n  <li>Séparateurs : en anglais, la virgule sépare les milliers et le point les décimales : 1,250.50 = « one thousand two hundred and fifty point five zero » (ou « … fifty euros and fifty cents »).<\/li>\n  <li>Pourcentages : 12.5% = « twelve point five percent » ; « up 3 percentage points » ≠ « up 3 percent ».<\/li>\n  <li>Grands nombres : 2.4 million, 1.2 billion (milliard), K / M / bn dans les slides.<\/li>\n  <li>Variations : to increase / rise / grow by 8 % ; to decrease / fall / drop by 5 % ; to remain flat ; year-on-year (YoY), quarter-on-quarter, versus budget.<\/li>\n  <li>Dates : 15 June 2026 (UK) / June 15, 2026 (US) ; « due on », « by » (au plus tard le), « within 30 days ».<\/li>\n<\/ul>\n<p>Structure d'une présentation : « Today I'd like to cover three points… », « Let me start with… », « Moving on to… », « To sum up… », « I'd be happy to take your questions. »<\/p>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>Point pour les décimales, virgule pour les milliers. « Billion » = milliard. « By » = au plus tard.<\/p><\/div>"},{"title":"Application : présenter son poste et son projet en anglais","html":"<p>Pitch de 60 secondes, utilisable en entretien ou à l'oral :<\/p>\n<p>« I work as a credit and collections apprentice at a logistics company. I manage the accounts receivable aging report and prioritise collection calls based on days overdue and invoice amount, in order to reduce our DSO. Over the past year I redesigned our monthly tracking workbook: I replaced fragile external lookups with a structured table and a scoring formula that ranks the top fifteen accounts to chase each month. My master's thesis looks at whether risk-based prioritisation actually shortens payment delays, using twelve months of receivables data. Next, I'd like to move towards a treasury or credit management role. »<\/p>\n<p>Questions probables et réponses courtes : « What is DSO? » — « Days sales outstanding: the average number of days it takes to collect payment after a sale. » « How do you handle a disputed invoice? » — « I log the dispute, involve the sales team to resolve it, and exclude it from dunning until it is settled. »<\/p>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>Un pitch = rôle, résultat concret, projet, ambition — quatre phrases, vocabulaire précis, pas de traduction mot à mot du français.<\/p><\/div>"}],"glossary":[{"term":"Accounts receivable","def":"Créances clients (on nous doit)."},{"term":"Accounts payable","def":"Dettes fournisseurs (nous devons)."},{"term":"Aging report","def":"Balance âgée : créances classées par tranche d'ancienneté (buckets)."},{"term":"Overdue / past due","def":"En retard de paiement (échéance dépassée)."},{"term":"Outstanding","def":"En cours, non encore réglé (échu ou non)."},{"term":"Write-off","def":"Passage en perte d'une créance irrécouvrable."},{"term":"Allowance for doubtful accounts","def":"Provision pour créances douteuses."},{"term":"Bad debt","def":"Créance irrécouvrable."},{"term":"Dunning","def":"Processus de relance des impayés (reminders, final notice)."},{"term":"Credit hold","def":"Blocage des livraisons ou commandes d'un client en retard de paiement."},{"term":"Remittance advice","def":"Avis de règlement envoyé par le client précisant les factures payées."},{"term":"Credit note","def":"Avoir."},{"term":"DSO","def":"Days sales outstanding : délai moyen de recouvrement."},{"term":"Working capital","def":"Besoin en fonds de roulement (BFR)."},{"term":"Cash flow forecast","def":"Prévision de trésorerie."},{"term":"Overdraft / credit line","def":"Découvert / ligne de crédit."},{"term":"Leverage / gearing","def":"Endettement, effet de levier."},{"term":"Covenant","def":"Clause contractuelle d'un prêt (ratios à respecter)."},{"term":"Hedging","def":"Couverture d'un risque financier (change, taux)."},{"term":"Due diligence","def":"Audits préalables à une acquisition."},{"term":"Turnover / revenue","def":"Chiffre d'affaires (UK / US)."},{"term":"Net income / earnings","def":"Résultat net."}],"formulas":[{"name":"Objet d'un email de relance","f":"Overdue invoice no. [X] – €[amount] – due [date]","note":"Précis, sans point d'exclamation."},{"name":"Reminder 1 (friendly)","f":"According to our records, invoice no. X for €Y, due on [date], remains outstanding. Could you please confirm when we can expect payment?","note":"+ « Please disregard this message if payment has already been made. »"},{"name":"Reminder 2 (firm)","f":"Despite our previous reminder, invoice no. X is now [N] days overdue. We kindly ask you to settle the outstanding balance of €Y by [date].","note":"+ ouvrir la porte au litige : « Should there be any dispute… »"},{"name":"Final notice","f":"This is a final notice. Unless payment is received by [date], we will place your account on credit hold and refer the matter to our legal department.","note":"Citer les conditions générales."},{"name":"Nombres","f":"1,250.50 → one thousand two hundred and fifty point five zero ; 2.4 million ; 1.2 billion (milliard)","note":"Point = décimales, virgule = milliers."},{"name":"Variations","f":"up / down by X % ; X percentage points ; year-on-year (YoY) ; versus budget ; flat","note":"« By » pour l'ampleur, « to » pour le niveau atteint."},{"name":"Dates et délais","f":"due on 15 June ; payable within 30 days ; by 31 July (au plus tard) ; net 30 ; 2/10 net 30","note":"UK : 15 June 2026 ; US : June 15, 2026."},{"name":"Structure d'un exposé","f":"Today I'd like to cover three points → Let me start with → Moving on to → To sum up → I'd be happy to take your questions","note":"Une transition par slide."},{"name":"Pitch 60 secondes","f":"Role → concrete result → current project → next step","note":"Quatre phrases, vocabulaire précis."}],"quiz":[{"q":"« Accounts receivable » désigne :","options":["Les dettes fournisseurs","Les créances clients","Les capitaux propres","Les stocks"],"correct":1,"explain":"Receivable = à recevoir = créances ; payable = dettes fournisseurs."},{"q":"Une facture « outstanding » est :","options":["Forcément en retard","Non encore réglée, échue ou non","Passée en perte","Contestée"],"correct":1,"explain":"Overdue signifie en retard ; outstanding signifie simplement non réglée."},{"q":"« To write off a receivable » signifie :","options":["Relancer le client","Passer la créance en perte","Provisionner la créance","Émettre un avoir"],"correct":1,"explain":"Write-off = perte définitive ; allowance = provision."},{"q":"Les conditions « 2/10 net 30 » signifient :","options":["2 % de pénalité après 10 jours","2 % d'escompte si paiement sous 10 jours, sinon 30 jours","Paiement en 2 fois","10 % d'acompte"],"correct":1,"explain":"Escompte pour paiement anticipé, échéance normale à 30 jours."},{"q":"« Working capital » se traduit par :","options":["Capital social","Fonds de roulement au sens français","Besoin en fonds de roulement","Trésorerie"],"correct":2,"explain":"En anglais, working capital = actif circulant − passif circulant = BFR."},{"q":"« 1.5 billion » correspond à :","options":["1,5 million","1,5 milliard","15 milliards","1 500"],"correct":1,"explain":"Billion = milliard en anglais moderne."},{"q":"Dans une relance, « by 31 July » signifie :","options":["Le 31 juillet exactement","Au plus tard le 31 juillet","À partir du 31 juillet","Environ le 31 juillet"],"correct":1,"explain":"By = date limite ; on = à cette date précise."},{"q":"Quelle formulation convient à une première relance ?","options":["Pay now or we sue you.","According to our records, invoice no. 118 remains outstanding. Could you confirm when we can expect payment?","You never pay on time.","URGENT!!! PAYMENT!!!"],"correct":1,"explain":"Factuelle, polie, avec une demande d'action claire."}],"exercises":[{"title":"Traduire une balance âgée","statement":"Traduis en anglais : « Balance âgée au 31 août : encours total 610 k€, dont 400 k€ non échus, 120 k€ à 1-30 jours de retard, 60 k€ à 31-90 jours, 30 k€ à plus de 90 jours. Provision pour créances douteuses : 21 k€. »","solution":"« Aged receivables as at 31 August: total outstanding €610k, of which €400k current, €120k 1-30 days past due, €60k 31-90 days past due and €30k over 90 days past due. Allowance for doubtful accounts: €21k. »"},{"title":"Rédiger une deuxième relance","statement":"Rédige en anglais une relance ferme pour la facture 2026-204 de 12 800 €, échue le 10 juillet, aujourd'hui 40 jours de retard, avec une date limite au 5 septembre.","solution":"Subject: Overdue invoice no. 2026-204 – €12,800.00 – due 10 July. « Dear Mr Smith, Despite our previous reminder, invoice no. 2026-204 for €12,800.00, due on 10 July, is now 40 days overdue. We kindly ask you to settle the outstanding balance by 5 September. Should there be any dispute regarding this invoice, please let us know as soon as possible so that we can resolve it. Please find attached a copy of the invoice. Thank you for your prompt attention to this matter. Kind regards, … »"},{"title":"Lire des chiffres à l'oral","statement":"Écris en toutes lettres (anglais) : 3,475.20 € ; 12.5 % ; 2.3 billion ; une hausse du DSO de 52 à 58 jours.","solution":"« Three thousand four hundred and seventy-five euros and twenty cents » ; « twelve point five percent » ; « two point three billion » ; « DSO rose by six days, from fifty-two to fifty-eight days » (ou « increased from 52 to 58 days »)."}],"notes":""}];

      ["definitions", "Définitions", countKeys(pr.termsKnown) + "/" + m.glossary.length],
      ["formules", "Formules", countKeys(pr.formulasKnown) + "/" + m.formulas.length],
      ["evaluation", "Quiz", st.quizBest ? st.quizBest.score + "/" + st.quizBest.total : "—"],
      ["exercices", "Exercices", st.ex + "/" + m.exercises.length],
      ["notes", "Notes", m.notes ? "✎" : "—"]
    ];
    return '<div class="seg" role="tablist">' + tabs.map(function (t) {
      return '<button role="tab" class="' + (state.tab === t[0] ? 'active' : '') + '" data-tab="' + t[0] + '">' + t[1] + '<span class="c">' + t[2] + '</span></button>';
    }).join("") + '</div>';
  }

  function renderCours(m) {
    var pr = state.progress[m.id];
    return m.lessons.map(function (lesson, i) {
      var read = pr.lessonsRead[i];
      return '<article class="lesson"><div class="lesson-head"><span class="n">' + pad(i + 1) + '</span><h3>' + lesson.title + '</h3>' +
        toggleBtn(read, 'data-lesson-toggle="' + i + '"', 'Lu', 'Marquer comme lu') + '</div>' +
        '<div class="lesson-body">' + lesson.html + '</div></article>';
    }).join("");
  }

  function renderCards(m, kind) {
    var isDef = kind === "definitions";
    var items = isDef ? m.glossary : m.formulas;
    var known = isDef ? state.progress[m.id].termsKnown : state.progress[m.id].formulasKnown;
    var cardMode = !!state.cardMode[kind];
    var knownCount = countKeys(known);

    var bar = '<div class="toolbar"><span class="hint">' + (isDef
        ? "Chaque terme avec sa définition. En mode cartes, réponds de tête, révèle, puis coche « Je maîtrise »."
        : "Les formules et repères à connaître par cœur. En mode cartes, seul le nom apparaît : retrouve la formule, puis révèle.") + '</span>' +
      '<div class="right"><button class="pill' + (cardMode ? ' on' : '') + '" data-cardmode="' + kind + '">' + (cardMode ? 'Mode cartes ✓' : 'Mode cartes') + '</button>' +
      (cardMode ? '<button class="pill" data-flip-all="' + kind + '">Tout révéler</button>' : '') +
      '<span class="mono" style="font-size:0.76rem;color:var(--ink-3)">' + knownCount + '/' + items.length + ' maîtrisées</span></div></div>';

    var list = items.map(function (it, i) {
      var key = kind + ":" + i;
      var isKnown = !!known[i];
      var flipped = !!(state.flipped[m.id] && state.flipped[m.id][key]);
      var face;
      if (cardMode && !flipped) {
        face = '<button class="front" data-flip="' + key + '"><span><b>?</b><span>Révéler ' + (isDef ? 'la définition' : 'la formule') + '</span></span></button>';
      } else if (isDef) {
        face = '<div class="def">' + it.def + '</div>';
      } else {
        face = '<div class="f">' + esc(it.f) + '</div>' + (it.note ? '<div class="note">' + it.note + '</div>' : '');
      }
      return '<div class="fc' + (isKnown ? ' known' : '') + '"><div class="top"><div class="term' + (isDef ? '' : ' mono') + '">' + (isDef ? it.term : it.name) + '</div>' +
        toggleBtn(isKnown, 'data-known="' + key + '"', 'Maîtrisée', 'Je maîtrise') + '</div>' + face + '</div>';
    }).join("");

    return bar + '<div class="cards">' + list + '</div>';
  }

  function renderEvaluation(m) {
    var submitted = !!state.quizSubmitted[m.id];
    var answers = state.quizAnswers[m.id] || {};
    var pr = state.progress[m.id];
    var letters = ["A", "B", "C", "D"];

    var bar = '<div class="qbar"><div>' + m.quiz.length + ' questions, une réponse par question. Chaque question est expliquée après correction.</div>' +
      '<div class="best"><div class="v">' + (pr.quizBest ? pr.quizBest.score + '/' + pr.quizBest.total : '—') + '</div><div class="l">Meilleur score</div></div></div>';

    var result = "";
    if (submitted) {
      var score = 0;
      m.quiz.forEach(function (q, i) { if (answers[i] === q.correct) score++; });
      var verdict = score === m.quiz.length ? "Sans faute. Passe aux exercices ou au module suivant." : score >= m.quiz.length * 0.75 ? "Solide. Relis les explications des questions manquées." : score >= m.quiz.length * 0.5 ? "À retravailler : reprends les leçons concernées avant de refaire le quiz." : "Reprends le cours en entier, puis refais le quiz.";
      result = '<div class="qresult"><div class="v">' + score + '/' + m.quiz.length + '</div><div class="m">' + verdict + '</div></div>';
    }

    var qs = m.quiz.map(function (q, i) {
      var sel = answers[i];
      var opts = q.options.map(function (opt, oi) {
        var cls = "opt";
        if (submitted) { if (oi === q.correct) cls += " correct"; else if (oi === sel) cls += " incorrect"; }
        else if (sel === oi) cls += " sel";
        return '<label class="' + cls + '"><input type="radio" name="q-' + m.id + '-' + i + '" value="' + oi + '" ' + (sel === oi ? 'checked' : '') + (submitted ? ' disabled' : '') + ' data-quiz-answer="' + m.id + ':' + i + ':' + oi + '"><span class="letter">' + letters[oi] + '</span><span>' + opt + '</span></label>';
      }).join("");
      var explain = "";
      if (submitted) {
        var ok = sel === q.correct;
        explain = '<div class="qx' + (ok ? '' : ' ko') + '"><span class="tag">' + (ok ? 'Correct' : (sel === undefined ? 'Sans réponse' : 'Incorrect')) + '</span>' + q.explain + '</div>';
      }
      return '<div class="qq"><div class="qt"><span class="qn">' + pad(i + 1) + '</span><span>' + q.q + '</span></div><div class="opts">' + opts + '</div>' + explain + '</div>';
    }).join("");

    var action = submitted
      ? '<button class="btn ghost" data-quiz-retry="' + m.id + '">Refaire le quiz</button>'
      : '<button class="btn acc" data-quiz-submit="' + m.id + '">Corriger le quiz</button>';
    return bar + result + qs + action;
  }

  function renderExercices(m) {
    var pr = state.progress[m.id];
    return m.exercises.map(function (ex, i) {
      var done = pr.exercisesDone[i];
      var revealed = !!(state.revealed[m.id] && state.revealed[m.id][i]);
      return '<div class="ex"><div class="head"><span class="n">' + pad(i + 1) + '</span><h3>' + ex.title + '</h3>' + toggleBtn(done, 'data-ex-toggle="' + i + '"', 'Fait', 'Marquer comme fait') + '</div>' +
        '<p class="st">' + ex.statement + '</p>' +
        (revealed ? '<div class="sol"><span class="label">Solution</span><p>' + ex.solution + '</p></div><button class="btn ghost sm" data-ex-hide="' + i + '">Masquer la solution</button>'
                  : '<button class="btn ghost sm" data-ex-reveal="' + i + '">Voir la solution</button>') +
      '</div>';
    }).join("");
  }

  function renderNotes(m) {
    if (!m.notes) {
      return '<div class="notes-empty"><p>Pas encore de notes pour ce module.</p><p>Pour en ajouter : ouvre le fichier du module dans <code>content/modules/</code>, écris sous la section <code># Notes</code>, puis relance <code>npm run build</code>.</p></div>';
    }
    return '<article class="lesson"><div class="lesson-body notes">' + m.notes + '</div></article>';
  }

  function renderModule(m) {
    var body;
    switch (state.tab) {
      case "notes": body = renderNotes(m); break;
      case "definitions": body = renderCards(m, "definitions"); break;
      case "formules": body = renderCards(m, "formules"); break;
      case "evaluation": body = renderEvaluation(m); break;
      case "exercices": body = renderExercices(m); break;
      default: body = renderCours(m);
    }
    var st = moduleStats(m);
    return '<button class="back" data-go="home">← Tous les modules</button>' +
      '<div class="banner"><div><div class="chips"><span class="chip">' + m.code + '</span><span class="chip' + (m.priority === 1 ? ' p1' : ' acc') + '">' + PRIO_LABEL[m.priority] + '</span></div>' +
        '<h1>' + m.title + '</h1><p>' + m.tagline + '</p></div>' + bigRing(st.overall) + '<div class="wm">' + pad(moduleIndex(m)) + '</div></div>' +
      renderSeg(m) + '<div>' + body + '</div>';
  }

  /* ---------- Global pages ---------- */

  function renderGlobal(kind) {
    var isDef = kind === "glossaire";
    var groups = MODULES.map(function (m) {
      var items = isDef ? m.glossary : m.formulas;
      var known = isDef ? state.progress[m.id].termsKnown : state.progress[m.id].formulasKnown;
      var cards = items.map(function (it, i) {
        return '<div class="fc' + (known[i] ? ' known' : '') + '"><div class="top"><div class="term' + (isDef ? '' : ' mono') + '">' + (isDef ? it.term : it.name) + '</div><span class="mod">' + m.code + '</span></div>' +
          (isDef ? '<div class="def">' + it.def + '</div>' : '<div class="f">' + esc(it.f) + '</div>' + (it.note ? '<div class="note">' + it.note + '</div>' : '')) + '</div>';
      }).join("");
      return '<div class="hued" style="--h:' + hue(m) + '"><div class="ghead"><span class="n">' + pad(moduleIndex(m)) + '</span><h2>' + m.title + '</h2></div><div class="cards">' + cards + '</div></div>';
    }).join("");
    var total = MODULES.reduce(function (a, m) { return a + (isDef ? m.glossary.length : m.formulas.length); }, 0);
    return '<div class="ptitle"><h1>' + (isDef ? 'Glossaire complet' : 'Formulaire complet') + '</h1><p>' + total + (isDef ? ' définitions' : ' formules et repères') + ' regroupés par module, dans l\'ordre du programme. Pour une fiche papier avant l\'examen, imprime cette page.</p>' +
      '<div style="margin-top:0.9rem"><button class="btn ghost sm" data-print="1">Imprimer</button></div></div>' + groups;
  }

  function renderSearch() {
    var q = norm(state.search.trim());
    var hits = [];
    MODULES.forEach(function (m) {
      m.glossary.forEach(function (g) { if (norm(g.term + " " + g.def).indexOf(q) !== -1) hits.push({ k: "Définition", t: g.term, d: g.def, m: m, tab: "definitions" }); });
      m.formulas.forEach(function (f) { if (norm(f.name + " " + f.f + " " + (f.note || "")).indexOf(q) !== -1) hits.push({ k: "Formule", t: f.name, f: f.f, d: f.note || "", m: m, tab: "formules" }); });
      m.lessons.forEach(function (l) { var txt = l.html.replace(/<[^>]+>/g, " "); if (norm(l.title + " " + txt).indexOf(q) !== -1) hits.push({ k: "Leçon", t: l.title, d: "Dans le cours du module " + pad(moduleIndex(m)), m: m, tab: "cours" }); });
      if (m.notes && norm(m.notes.replace(/<[^>]+>/g, " ")).indexOf(q) !== -1) hits.push({ k: "Notes", t: "Notes du module " + pad(moduleIndex(m)), d: m.title, m: m, tab: "notes" });
    });
    var list = hits.slice(0, 60).map(function (h) {
      return '<div class="hit hued" style="--h:' + hue(h.m) + '"><div><div class="k">' + h.k + ' · module ' + pad(moduleIndex(h.m)) + '</div><div class="t">' + h.t + '</div></div>' +
        '<button class="go" data-open-module-tab="' + h.m.id + ':' + h.tab + '">Ouvrir →</button>' +
        (h.f ? '<div class="f">' + esc(h.f) + '</div>' : '') + (h.d ? '<div class="d">' + h.d + '</div>' : '') + '</div>';
    }).join("");
    return '<div class="ptitle"><h1>Recherche</h1><p>' + hits.length + ' résultat' + (hits.length > 1 ? 's' : '') + ' pour « ' + esc(state.search) + ' »' + (hits.length > 60 ? ' (60 affichés)' : '') + '.</p></div>' +
      (list || '<p class="empty">Rien trouvé. Essaie un autre mot-clé (ex. « BFR », « swap », « APA »).</p>');
  }

  /* ---------- Render ---------- */

  function render() {
    var app = document.getElementById("app");
    var main;
    var h = 185;
    if (state.view === "module") {
      var m = getModule(state.moduleId);
      if (m) { main = renderModule(m); h = hue(m); } else main = renderHome();
    } else if (state.view === "formulaire" || state.view === "glossaire") main = renderGlobal(state.view);
    else if (state.view === "search") main = renderSearch();
    else main = renderHome();

    document.body.classList.toggle("ambiance-lofi", state.ambiance === "lofi");
    if (state.theme === "light" || state.theme === "dark") document.documentElement.setAttribute("data-theme", state.theme);
    else document.documentElement.removeAttribute("data-theme");
    app.innerHTML = '<div class="app hued" style="--h:' + h + '">' + renderSidebar() +
      '<div style="min-width:0">' + renderTopbar() + (state.navOpen ? '<div class="scrim" data-nav-toggle="1"></div>' : '') +
      '<main class="main">' + main + '</main></div></div>';
    if (state.scrollTop) { window.scrollTo({ top: 0 }); state.scrollTop = false; }
  }

  function openModule(id, tab) {
    state.view = "module";
    state.moduleId = id;
    state.tab = tab || "cours";
    state.lastModule = id;
    state.navOpen = false;
    state.scrollTop = true;
    savePrefs();
    render();
  }

  var app = document.getElementById("app");

  app.addEventListener("click", function (e) {
    var t = e.target, el;

    if ((el = t.closest("[data-open-module-tab]"))) { var p = el.getAttribute("data-open-module-tab").split(":"); openModule(p[0], p[1]); return; }
    if ((el = t.closest("[data-open-module]"))) { openModule(el.getAttribute("data-open-module")); return; }
    if ((el = t.closest("[data-nav-toggle]"))) { state.navOpen = !state.navOpen; render(); return; }
    if ((el = t.closest("[data-go]"))) { state.view = el.getAttribute("data-go"); state.search = ""; state.resetArmed = false; state.navOpen = false; state.scrollTop = true; render(); return; }
    if ((el = t.closest("[data-tab]"))) { state.tab = el.getAttribute("data-tab"); render(); return; }

    if ((el = t.closest("[data-lesson-toggle]"))) { var li = parseInt(el.getAttribute("data-lesson-toggle"), 10); var pr = state.progress[state.moduleId]; pr.lessonsRead[li] = !pr.lessonsRead[li]; saveProgress(); render(); return; }
    if ((el = t.closest("[data-ex-toggle]"))) { var ei = parseInt(el.getAttribute("data-ex-toggle"), 10); var pr2 = state.progress[state.moduleId]; pr2.exercisesDone[ei] = !pr2.exercisesDone[ei]; saveProgress(); render(); return; }
    if ((el = t.closest("[data-ex-reveal]"))) { state.revealed[state.moduleId] = state.revealed[state.moduleId] || {}; state.revealed[state.moduleId][parseInt(el.getAttribute("data-ex-reveal"), 10)] = true; render(); return; }
    if ((el = t.closest("[data-ex-hide]"))) { state.revealed[state.moduleId] = state.revealed[state.moduleId] || {}; state.revealed[state.moduleId][parseInt(el.getAttribute("data-ex-hide"), 10)] = false; render(); return; }

    if ((el = t.closest("[data-cardmode]"))) { var kind = el.getAttribute("data-cardmode"); state.cardMode[kind] = !state.cardMode[kind]; state.flipped[state.moduleId] = {}; savePrefs(); render(); return; }
    if ((el = t.closest("[data-flip-all]"))) { var k2 = el.getAttribute("data-flip-all"); var m2 = getModule(state.moduleId); var items = k2 === "definitions" ? m2.glossary : m2.formulas; state.flipped[state.moduleId] = state.flipped[state.moduleId] || {}; items.forEach(function (_, i) { state.flipped[state.moduleId][k2 + ":" + i] = true; }); render(); return; }
    if ((el = t.closest("[data-flip]"))) { state.flipped[state.moduleId] = state.flipped[state.moduleId] || {}; state.flipped[state.moduleId][el.getAttribute("data-flip")] = true; render(); return; }
    if ((el = t.closest("[data-known]"))) { var parts = el.getAttribute("data-known").split(":"); var store = parts[0] === "definitions" ? state.progress[state.moduleId].termsKnown : state.progress[state.moduleId].formulasKnown; if (store[parts[1]]) delete store[parts[1]]; else store[parts[1]] = true; saveProgress(); render(); return; }

    if ((el = t.closest("[data-quiz-submit]"))) { var mid = el.getAttribute("data-quiz-submit"); var mq = getModule(mid); var answers = state.quizAnswers[mid] || {}; var score = 0; mq.quiz.forEach(function (q, i) { if (answers[i] === q.correct) score++; }); state.quizSubmitted[mid] = true; var pr3 = state.progress[mid]; if (!pr3.quizBest || score > pr3.quizBest.score) { pr3.quizBest = { score: score, total: mq.quiz.length }; saveProgress(); } state.scrollTop = true; render(); return; }
    if ((el = t.closest("[data-quiz-retry]"))) { var mid2 = el.getAttribute("data-quiz-retry"); state.quizSubmitted[mid2] = false; state.quizAnswers[mid2] = {}; state.scrollTop = true; render(); return; }

    if ((el = t.closest("[data-print]"))) { window.print(); return; }
    if ((el = t.closest("[data-theme-toggle]"))) { state.theme = state.theme === "auto" ? "dark" : state.theme === "dark" ? "light" : "auto"; savePrefs(); render(); return; }
    if ((el = t.closest("[data-ambiance]"))) { state.ambiance = state.ambiance === "lofi" ? "neutre" : "lofi"; savePrefs(); render(); return; }
    if ((el = t.closest("[data-reset]"))) {
      if (!state.resetArmed) { state.resetArmed = true; render(); }
      else { state.progress = defaultProgress(); state.resetArmed = false; state.quizSubmitted = {}; state.quizAnswers = {}; state.flipped = {}; saveProgress(); render(); }
      return;
    }
  });

  app.addEventListener("change", function (e) {
    var radio = e.target.closest("[data-quiz-answer]");
    if (radio) {
      var parts = radio.getAttribute("data-quiz-answer").split(":");
      var mid = parts[0], qi = parseInt(parts[1], 10), oi = parseInt(parts[2], 10);
      state.quizAnswers[mid] = state.quizAnswers[mid] || {};
      state.quizAnswers[mid][qi] = oi;
      // Light-touch: update selection styling without a full re-render (keeps scroll position).
      var lab = radio.closest("label");
      if (lab && lab.parentNode) {
        var sib = lab.parentNode.querySelectorAll(".opt");
        for (var i = 0; i < sib.length; i++) sib[i].classList.remove("sel");
        lab.classList.add("sel");
      }
    }
  });

  app.addEventListener("input", function (e) {
    var s = e.target.closest("[data-search]");
    if (s) {
      state.search = s.value;
      var pos = s.selectionStart;
      if (state.search.trim().length >= 2) state.view = "search";
      else if (state.view === "search") state.view = "home";
      render();
      var again = document.querySelector("[data-search]");
      if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (err) {} }
    }
  });

  render();
  initSync();
})();

</script>
</body>
</html>
