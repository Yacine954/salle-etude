/* Accent derived from the current module hue */
:root, .hued {
  --acc: hsl(var(--h) var(--acc-s) var(--acc-l));
  --acc-soft: hsl(var(--h) var(--soft-s) var(--soft-l));
  --acc-soft2: hsl(var(--h) var(--soft-s) var(--soft2-l));
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Public Sans", system-ui, -apple-system, sans-serif;
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  * { animation: none !important; transition: none !important; }
}

a { color: var(--acc); }
button { font-family: inherit; cursor: pointer; color: inherit; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
code { font-family: "DM Mono", ui-monospace, monospace; font-size: 0.88em; background: var(--bg-sunk); padding: 0.05em 0.35em; border-radius: 4px; }

h1, h2, h3, h4 { font-family: "Bricolage Grotesque", "Public Sans", system-ui, sans-serif; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; margin: 0; line-height: 1.15; }
.mono { font-family: "DM Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
.num { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }

/* ---------- App shell ---------- */
.app { display: grid; grid-template-columns: 272px minmax(0, 1fr); min-height: 100vh; }

.sidebar {
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  background: var(--bg-elev); border-right: 1px solid var(--line);
  padding: 1.25rem 0.9rem 1.5rem; display: flex; flex-direction: column; gap: 1.1rem;
}
.brand { display: flex; align-items: center; gap: 0.7rem; padding: 0.2rem 0.4rem; }
.brand .mark {
  width: 38px; height: 38px; border-radius: 10px; flex: none;
  background: var(--ink); color: var(--bg);
  display: grid; place-items: center; font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 1.05rem; letter-spacing: -0.04em;
}
.brand .t { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 1rem; line-height: 1.1; }
.brand .s { font-size: 0.74rem; color: var(--ink-3); margin-top: 0.15rem; }
.brand .mark img { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; display: block; }

.side-search { position: relative; }
.side-search input {
  width: 100%; font: inherit; font-size: 0.9rem; padding: 0.6rem 0.8rem 0.6rem 2.2rem;
  border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink);
}
.side-search svg { position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--ink-3); }

.side-group { display: flex; flex-direction: column; gap: 0.15rem; }
.side-label { font-family: "DM Mono", monospace; font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); padding: 0.4rem 0.6rem 0.35rem; }

.nav-item {
  display: flex; align-items: center; gap: 0.7rem; width: 100%; text-align: left;
  background: none; border: none; border-radius: 9px; padding: 0.5rem 0.6rem; color: var(--ink-2); font-size: 0.9rem; font-weight: 500;
  transition: background 0.15s;
}
.nav-item:hover { background: var(--bg); color: var(--ink); }
.nav-item.active { background: var(--acc-soft); color: var(--ink); }
.nav-item .ic { width: 18px; height: 18px; color: var(--ink-3); flex: none; }
.nav-item.active .ic { color: var(--acc); }

.mod-item {
  display: grid; grid-template-columns: 26px 1fr 26px; align-items: center; gap: 0.55rem; width: 100%; text-align: left;
  background: none; border: none; border-radius: 9px; padding: 0.45rem 0.6rem; color: var(--ink-2); font-size: 0.86rem; line-height: 1.25;
  transition: background 0.15s;
}
.mod-item:hover { background: var(--bg); color: var(--ink); }
.mod-item.active { background: var(--acc-soft); color: var(--ink); }
.mod-item .n { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 0.82rem; color: var(--acc); letter-spacing: -0.02em; }
.mod-item .name { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

.ring { width: 26px; height: 26px; }
.ring circle { fill: none; stroke-width: 3; }
.ring .bg { stroke: var(--line); }
.ring .fg { stroke: var(--acc); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset 0.4s; }

.side-foot { margin-top: auto; padding: 0.6rem 0.4rem 0; border-top: 1px solid var(--line); font-size: 0.78rem; color: var(--ink-3); display: flex; flex-direction: column; gap: 0.5rem; }
.side-foot .bar { height: 6px; border-radius: 99px; background: var(--bg-sunk); overflow: hidden; }
.side-foot .bar > span { display: block; height: 100%; background: var(--ink); }
.side-foot .sync { display: flex; align-items: center; gap: 0.45rem; font-size: 0.72rem; line-height: 1.3; color: var(--ink-3); }
.side-foot .sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--line-strong); flex: none; }
.side-foot .sync[data-sync="synced"] i { background: var(--good); }
.side-foot .sync[data-sync="syncing"] i { background: var(--acc); }
.side-foot .sync[data-sync="error"] i { background: var(--bad); }

.topbar { display: none; }

.main { padding: 2.2rem 2.6rem 5rem; max-width: 900px; width: 100%; min-width: 0; }

/* ---------- Buttons & chips ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 0.45rem; border: 1px solid var(--ink); background: var(--ink); color: var(--bg);
  border-radius: 10px; padding: 0.62rem 1.1rem; font-size: 0.9rem; font-weight: 600; transition: transform 0.12s, box-shadow 0.12s;
}
.btn:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
.btn.ghost { background: var(--bg-elev); color: var(--ink); border-color: var(--line); }
.btn.acc { background: var(--acc); border-color: var(--acc); color: #fff; }
.btn.sm { padding: 0.42rem 0.8rem; font-size: 0.82rem; }

.chip {
  display: inline-flex; align-items: center; gap: 0.35rem; font-family: "DM Mono", monospace; font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase;
  padding: 0.22rem 0.55rem; border-radius: 6px; border: 1px solid var(--line); color: var(--ink-2); background: var(--bg-elev);
}
.chip.acc { color: var(--acc); border-color: var(--acc); background: var(--acc-soft2); }
.chip.p1 { color: var(--ink); background: var(--ink); color: var(--bg); border-color: var(--ink); }

.toggle {
  display: inline-flex; align-items: center; gap: 0.45rem; background: var(--bg-elev); border: 1px solid var(--line); border-radius: 999px;
  padding: 0.32rem 0.7rem 0.32rem 0.5rem; font-size: 0.8rem; color: var(--ink-2); white-space: nowrap; transition: all 0.15s;
}
.toggle .box { width: 15px; height: 15px; border-radius: 5px; border: 1.5px solid var(--line-strong); display: grid; place-items: center; }
.toggle .box svg { width: 10px; height: 10px; display: none; }
.toggle.on { border-color: var(--good); color: var(--good); background: var(--good-soft); }
.toggle.on .box { background: var(--good); border-color: var(--good); }
.toggle.on .box svg { display: block; color: #fff; }

/* ---------- Home ---------- */
.home-hero { display: grid; grid-template-columns: 1fr auto; gap: 1.5rem; align-items: end; margin-bottom: 1.8rem; }
.home-hero h1 { font-size: clamp(2rem, 4vw, 2.9rem); letter-spacing: -0.03em; }
.home-hero p { color: var(--ink-2); max-width: 56ch; margin: 0.6rem 0 0; }
.big-pct { text-align: right; }
.big-pct .v { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 3.4rem; line-height: 1; letter-spacing: -0.05em; }
.big-pct .l { font-family: "DM Mono", monospace; font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }

.strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(52px, 1fr)); gap: 0.35rem; margin-bottom: 1.6rem; }
.strip button {
  border: none; background: var(--acc-soft); border-radius: 8px; height: 46px; padding: 0; position: relative; overflow: hidden; color: var(--acc);
  font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 0.85rem; transition: transform 0.12s;
}
.strip button:hover { transform: translateY(-2px); }
.strip button > i { position: absolute; left: 0; bottom: 0; height: 100%; width: var(--w); background: var(--acc); opacity: 0.22; }
.strip button > span { position: relative; }

.resume {
  display: grid; grid-template-columns: auto 1fr auto; gap: 1rem; align-items: center;
  background: var(--ink); color: var(--bg); border-radius: 14px; padding: 1rem 1.2rem; margin-bottom: 1.8rem; border: none; text-align: left; width: 100%;
}
.resume .n { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 1.6rem; letter-spacing: -0.04em; color: var(--acc); }
.resume .l { font-family: "DM Mono", monospace; font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.7; }
.resume .t { font-weight: 600; font-size: 1rem; margin-top: 0.1rem; }
.resume .go { font-size: 0.85rem; opacity: 0.85; }

.sem-head { display: flex; align-items: baseline; gap: 0.8rem; margin: 1.6rem 0 0.8rem; }
.sem-head h2 { font-size: 1.15rem; }
.sem-head span { font-family: "DM Mono", monospace; font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }

.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 0.9rem; }

.mcard {
  position: relative; overflow: hidden; text-align: left; width: 100%;
  background: var(--bg-elev); border: 1px solid var(--line); border-radius: 14px; padding: 1.1rem 1.15rem 1rem;
  display: flex; flex-direction: column; gap: 0.55rem; transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
}
.mcard:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--acc); }
.mcard::before { content: ""; position: absolute; left: 0; top: 0; right: 0; height: 5px; background: var(--acc); }
.mcard .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.6rem; }
.mcard .n { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 1.9rem; line-height: 1; letter-spacing: -0.05em; color: var(--acc); }
.mcard h3 { font-size: 1.05rem; }
.mcard p { margin: 0; color: var(--ink-2); font-size: 0.86rem; line-height: 1.45; }
.mcard .stats { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.2rem; }
.mcard .st { font-family: "DM Mono", monospace; font-size: 0.7rem; padding: 0.2rem 0.5rem; border-radius: 6px; background: var(--bg); color: var(--ink-2); }
.mcard .st b { color: var(--ink); font-weight: 500; }
.mcard .bar { height: 5px; border-radius: 99px; background: var(--bg-sunk); overflow: hidden; margin-top: 0.3rem; }
.mcard .bar > span { display: block; height: 100%; background: var(--acc); }

/* ---------- Module workspace ---------- */
.back { display: inline-flex; align-items: center; gap: 0.4rem; background: none; border: none; color: var(--ink-3); font-size: 0.85rem; padding: 0; margin-bottom: 1rem; }
.back:hover { color: var(--ink); }

.banner {
  position: relative; overflow: hidden; border-radius: 16px; background: var(--acc-soft); padding: 1.6rem 1.8rem 1.5rem; margin-bottom: 1.4rem;
  display: grid; grid-template-columns: 1fr auto; gap: 1.2rem; align-items: center;
}
.banner .wm { position: absolute; right: -0.4rem; bottom: -1.6rem; font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 11rem; line-height: 1; letter-spacing: -0.08em; color: var(--acc); opacity: var(--wm-a); pointer-events: none; user-select: none; }
.banner .chips { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 0.6rem; }
.banner h1 { font-size: clamp(1.5rem, 3vw, 2.1rem); letter-spacing: -0.025em; position: relative; }
.banner p { margin: 0.5rem 0 0; color: var(--ink-2); max-width: 58ch; position: relative; }
.banner .bigring { width: 84px; height: 84px; position: relative; }
.banner .bigring circle { fill: none; stroke-width: 7; }
.banner .bigring .bg { stroke: var(--bg-elev); opacity: 0.7; }
.banner .bigring .fg { stroke: var(--acc); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; }
.banner .bigring text { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 20px; fill: var(--ink); text-anchor: middle; dominant-baseline: central; }

.seg { display: flex; gap: 0.25rem; background: var(--bg-sunk); padding: 0.3rem; border-radius: 12px; margin-bottom: 1.5rem; flex-wrap: wrap; }
.seg button {
  flex: 1 1 auto; background: none; border: none; border-radius: 9px; padding: 0.55rem 0.7rem; font-size: 0.88rem; font-weight: 500; color: var(--ink-2);
  display: inline-flex; align-items: center; justify-content: center; gap: 0.45rem; transition: background 0.15s, color 0.15s;
}
.seg button.active { background: var(--bg-elev); color: var(--ink); box-shadow: var(--shadow); font-weight: 600; }
.seg button .c { font-family: "DM Mono", monospace; font-size: 0.68rem; color: var(--ink-3); }
.seg button.active .c { color: var(--acc); }

.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 0.8rem; flex-wrap: wrap; margin-bottom: 1.1rem; }
.toolbar .hint { color: var(--ink-2); font-size: 0.88rem; max-width: 58ch; }
.toolbar .right { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
.pill { background: var(--bg-elev); border: 1px solid var(--line); border-radius: 999px; padding: 0.4rem 0.85rem; font-size: 0.82rem; color: var(--ink-2); }
.pill.on { background: var(--acc); border-color: var(--acc); color: #fff; font-weight: 600; }

/* Lessons */
.lesson { background: var(--bg-elev); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 1rem; overflow: hidden; }
.lesson-head { display: grid; grid-template-columns: auto 1fr auto; gap: 0.9rem; align-items: center; padding: 0.95rem 1.2rem; border-bottom: 1px solid var(--line); }
.lesson-head .n { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 1.3rem; color: var(--acc); letter-spacing: -0.04em; }
.lesson-head h3 { font-size: 1.02rem; }
.lesson-body { padding: 1.3rem 1.4rem 1.4rem; }
.lesson-body p { margin: 0 0 0.85rem; max-width: 66ch; }
.lesson-body ul, .lesson-body ol { margin: 0 0 0.85rem; padding-left: 1.25rem; max-width: 66ch; }
.lesson-body li { margin-bottom: 0.35rem; }
.lesson-body dl { display: grid; grid-template-columns: max-content 1fr; gap: 0.35rem 1rem; margin: 0 0 0.9rem; max-width: 66ch; }
.lesson-body dt { font-family: "DM Mono", monospace; font-size: 0.8rem; color: var(--acc); font-weight: 500; max-width: 13rem; padding-top: 0.15rem; }
.lesson-body dd { margin: 0; }
.lesson-body strong { font-weight: 600; }

.formula {
  font-family: "DM Mono", monospace; font-variant-numeric: tabular-nums; font-size: 0.84rem; line-height: 1.55;
  background: var(--bg-sunk); border-left: 3px solid var(--acc); border-radius: 0 8px 8px 0; padding: 0.7rem 0.95rem; margin: 0 0 0.9rem; max-width: 66ch; overflow-x: auto; white-space: pre-wrap;
}
.retenir { position: relative; background: var(--acc-soft); border-radius: 10px; padding: 0.9rem 1.05rem 0.9rem 2.3rem; max-width: 66ch; }
.retenir::before { content: "★"; position: absolute; left: 0.95rem; top: 0.95rem; color: var(--acc); font-size: 0.85rem; line-height: 1; }
.retenir .label { font-family: "DM Mono", monospace; font-size: 0.66rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--acc); display: block; margin-bottom: 0.2rem; }
.retenir p { margin: 0; }

/* Notes et contenu Markdown */
.lesson-body h1, .lesson-body h2, .lesson-body h3 { margin: 1.1rem 0 0.5rem; max-width: 66ch; }
.lesson-body h1 { font-size: 1.35rem; } .lesson-body h2 { font-size: 1.15rem; } .lesson-body h3 { font-size: 1rem; }
.lesson-body > :first-child { margin-top: 0; }
.lesson-body blockquote { margin: 0 0 0.85rem; padding: 0.5rem 0.9rem; border-left: 3px solid var(--line-strong); color: var(--ink-2); max-width: 66ch; }
.lesson-body pre { background: var(--bg-sunk); border-radius: 8px; padding: 0.7rem 0.9rem; overflow-x: auto; font-family: "DM Mono", ui-monospace, monospace; font-size: 0.84rem; line-height: 1.5; margin: 0 0 0.9rem; max-width: 66ch; }
.lesson-body pre code { background: none; padding: 0; font-size: inherit; }
.lesson-body table { border-collapse: collapse; margin: 0 0 0.9rem; font-size: 0.9rem; display: block; overflow-x: auto; max-width: 100%; }
.lesson-body th, .lesson-body td { border: 1px solid var(--line); padding: 0.35rem 0.6rem; text-align: left; vertical-align: top; }
.lesson-body th { background: var(--bg-sunk); font-weight: 600; }
.lesson-body hr { border: none; border-top: 1px solid var(--line); margin: 1.2rem 0; }
.lesson-body img { border-radius: 8px; }
.notes-empty { background: var(--bg-elev); border: 1px dashed var(--line-strong); border-radius: 14px; padding: 1.2rem 1.4rem; color: var(--ink-2); max-width: 66ch; }
.notes-empty p { margin: 0 0 0.5rem; } .notes-empty p:last-child { margin: 0; }

/* Flashcards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 0.8rem; }
.fc {
  background: var(--bg-elev); border: 1px solid var(--line); border-radius: 14px; padding: 1rem 1.05rem; display: flex; flex-direction: column; gap: 0.6rem; min-height: 120px;
  transition: border-color 0.15s, transform 0.15s;
}
.fc.known { border-color: var(--good); }
.fc .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.6rem; }
.fc .term { font-weight: 600; font-size: 0.98rem; line-height: 1.3; }
.fc .term.mono { font-family: "DM Mono", monospace; font-size: 0.84rem; color: var(--acc); font-weight: 500; }
.fc .def { color: var(--ink); font-size: 0.9rem; line-height: 1.5; }
.fc .f { font-family: "DM Mono", monospace; font-variant-numeric: tabular-nums; font-size: 0.82rem; background: var(--bg-sunk); border-left: 3px solid var(--acc); border-radius: 0 8px 8px 0; padding: 0.55rem 0.8rem; white-space: pre-wrap; overflow-x: auto; }
.fc .note { color: var(--ink-2); font-size: 0.82rem; }
.fc .mod { font-family: "DM Mono", monospace; font-size: 0.66rem; color: var(--ink-3); letter-spacing: 0.06em; text-transform: uppercase; }
.fc .front {
  flex: 1; display: grid; place-items: center; text-align: center; background: var(--acc-soft2); border: 1.5px dashed var(--acc); border-radius: 10px; padding: 1rem; cursor: pointer; color: var(--acc);
  font-size: 0.85rem; gap: 0.2rem; transition: background 0.15s;
}
.fc .front:hover { background: var(--acc-soft); }
.fc .front b { font-family: "Bricolage Grotesque", sans-serif; font-size: 1.6rem; font-weight: 800; display: block; line-height: 1; }
.fc .front span { font-size: 0.78rem; }

/* Quiz */
.qbar { display: grid; grid-template-columns: 1fr auto; gap: 1rem; align-items: center; background: var(--bg-elev); border: 1px solid var(--line); border-radius: 14px; padding: 1rem 1.2rem; margin-bottom: 1.2rem; }
.qbar .best { text-align: right; }
.qbar .best .v { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 1.6rem; line-height: 1; letter-spacing: -0.04em; color: var(--acc); }
.qbar .best .l { font-family: "DM Mono", monospace; font-size: 0.66rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }
.qresult { border-radius: 14px; padding: 1.1rem 1.3rem; margin-bottom: 1.2rem; background: var(--ink); color: var(--bg); display: grid; grid-template-columns: auto 1fr; gap: 1rem; align-items: center; }
.qresult .v { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 2.2rem; line-height: 1; letter-spacing: -0.05em; color: var(--acc); }
.qresult .m { font-size: 0.92rem; }

.qq { background: var(--bg-elev); border: 1px solid var(--line); border-radius: 14px; padding: 1.1rem 1.25rem; margin-bottom: 0.9rem; }
.qq .qt { display: grid; grid-template-columns: auto 1fr; gap: 0.7rem; align-items: baseline; font-weight: 600; margin-bottom: 0.85rem; max-width: 66ch; }
.qq .qn { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; color: var(--acc); font-size: 1.05rem; letter-spacing: -0.03em; }
.opts { display: flex; flex-direction: column; gap: 0.45rem; }
.opt {
  display: grid; grid-template-columns: auto 1fr; gap: 0.7rem; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 0.55rem 0.7rem; background: var(--bg); cursor: pointer; max-width: 66ch; font-size: 0.92rem;
  transition: border-color 0.12s, background 0.12s;
}
.opt:hover { border-color: var(--line-strong); }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt .letter { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-family: "DM Mono", monospace; font-size: 0.78rem; border: 1px solid var(--line-strong); color: var(--ink-2); background: var(--bg-elev); }
.opt.sel { border-color: var(--acc); background: var(--acc-soft2); }
.opt.sel .letter { background: var(--acc); border-color: var(--acc); color: #fff; }
.opt.correct { border-color: var(--good); background: var(--good-soft); }
.opt.correct .letter { background: var(--good); border-color: var(--good); color: #fff; }
.opt.incorrect { border-color: var(--bad); background: var(--bad-soft); }
.opt.incorrect .letter { background: var(--bad); border-color: var(--bad); color: #fff; }
.qx { margin-top: 0.85rem; padding: 0.7rem 0.9rem; border-radius: 10px; font-size: 0.88rem; max-width: 66ch; background: var(--bg); border-left: 3px solid var(--good); }
.qx.ko { border-left-color: var(--bad); }
.qx .tag { font-family: "DM Mono", monospace; font-size: 0.66rem; letter-spacing: 0.1em; text-transform: uppercase; margin-right: 0.5rem; color: var(--good); }
.qx.ko .tag { color: var(--bad); }

/* Exercises */
.ex { background: var(--bg-elev); border: 1px solid var(--line); border-radius: 14px; padding: 1.15rem 1.25rem; margin-bottom: 0.9rem; }
.ex .head { display: grid; grid-template-columns: auto 1fr auto; gap: 0.8rem; align-items: center; margin-bottom: 0.6rem; }
.ex .n { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 1.3rem; color: var(--acc); letter-spacing: -0.04em; }
.ex h3 { font-size: 1rem; }
.ex .st { margin: 0 0 0.9rem; max-width: 66ch; }
.sol { background: var(--acc-soft); border-radius: 10px; padding: 0.95rem 1.05rem; max-width: 66ch; margin-bottom: 0.7rem; }
.sol .label { font-family: "DM Mono", monospace; font-size: 0.66rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--acc); display: block; margin-bottom: 0.35rem; }
.sol p { margin: 0; font-size: 0.9rem; }

/* Global & search */
.ghead { display: flex; align-items: baseline; gap: 0.7rem; margin: 1.6rem 0 0.7rem; }
.ghead h2 { font-size: 1.1rem; }
.ghead .n { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; color: var(--acc); font-size: 1.1rem; letter-spacing: -0.03em; }
.empty { color: var(--ink-3); font-style: italic; }
.hit { display: grid; grid-template-columns: 1fr auto; gap: 0.5rem 1rem; background: var(--bg-elev); border: 1px solid var(--line); border-radius: 12px; padding: 0.8rem 1rem; margin-bottom: 0.6rem; align-items: start; }
.hit .k { font-family: "DM Mono", monospace; font-size: 0.64rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }
.hit .t { font-weight: 600; }
.hit .d { grid-column: 1 / -1; color: var(--ink-2); font-size: 0.88rem; }
.hit .f { grid-column: 1 / -1; font-family: "DM Mono", monospace; font-size: 0.8rem; background: var(--bg-sunk); border-left: 3px solid var(--acc); border-radius: 0 8px 8px 0; padding: 0.5rem 0.8rem; white-space: pre-wrap; }
.hit .go { background: var(--acc-soft2); border: 1px solid var(--acc); color: var(--acc); border-radius: 8px; padding: 0.3rem 0.6rem; font-size: 0.75rem; font-weight: 600; white-space: nowrap; }

.ptitle { margin-bottom: 1.4rem; }
.ptitle h1 { font-size: clamp(1.6rem, 3vw, 2.2rem); letter-spacing: -0.03em; }
.ptitle p { color: var(--ink-2); margin: 0.5rem 0 0; max-width: 60ch; }

.foot { margin-top: 3rem; padding-top: 1.2rem; border-top: 1px solid var(--line); color: var(--ink-3); font-size: 0.8rem; display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; align-items: center; }

/* ---------- Ambiance lofi ---------- */
body.ambiance-lofi {
  --bg-elev: var(--lofi-elev);
  --bg: var(--lofi-bg);
  --bg-sunk: var(--lofi-sunk);
  background: var(--lofi-sky) fixed;
}
body.ambiance-lofi::before, body.ambiance-lofi::after {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
}
/* Ciel, lueur chaude, skyline et premières étoiles */
body.ambiance-lofi::before {
  background:
    radial-gradient(1.6px 1.6px at 8% 12%, #fff 100%, transparent),
    radial-gradient(1.2px 1.2px at 21% 28%, #fff 100%, transparent),
    radial-gradient(1.8px 1.8px at 33% 9%, #fff 100%, transparent),
    radial-gradient(1.2px 1.2px at 47% 22%, #fff 100%, transparent),
    radial-gradient(1.5px 1.5px at 58% 6%, #fff 100%, transparent),
    radial-gradient(1.2px 1.2px at 69% 31%, #fff 100%, transparent),
    radial-gradient(1.7px 1.7px at 81% 14%, #fff 100%, transparent),
    radial-gradient(1.2px 1.2px at 92% 26%, #fff 100%, transparent),
    radial-gradient(1.4px 1.4px at 75% 40%, #fff 100%, transparent),
    radial-gradient(1.2px 1.2px at 14% 44%, #fff 100%, transparent),
    var(--lofi-skyline) center bottom / auto 240px repeat-x,
    var(--lofi-glow),
    var(--lofi-sky);
}
/* Deuxième couche d'étoiles, qui scintille (invisible de jour) */
body.ambiance-lofi::after {
  background:
    radial-gradient(1.3px 1.3px at 27% 17%, #fff 100%, transparent),
    radial-gradient(1.8px 1.8px at 40% 35%, #fff 100%, transparent),
    radial-gradient(1.2px 1.2px at 52% 13%, #fff 100%, transparent),
    radial-gradient(1.5px 1.5px at 64% 21%, #fff 100%, transparent),
    radial-gradient(1.2px 1.2px at 86% 8%, #fff 100%, transparent),
    radial-gradient(1.6px 1.6px at 95% 38%, #fff 100%, transparent),
    radial-gradient(1.2px 1.2px at 5% 30%, #fff 100%, transparent),
    radial-gradient(1.4px 1.4px at 44% 3%, #fff 100%, transparent);
  opacity: calc(var(--lofi-stars) * 0.9);
  animation: lofi-twinkle 6s ease-in-out infinite alternate;
}
@keyframes lofi-twinkle {
  from { opacity: calc(var(--lofi-stars) * 0.25); }
  to   { opacity: calc(var(--lofi-stars) * 0.95); }
}
/* Grain très léger par-dessus tout */
.ambiance-lofi .app::after {
  content: ""; position: fixed; inset: 0; z-index: 60; pointer-events: none; opacity: 0.07;
  background: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxODAiIGhlaWdodD0iMTgwIj4KICA8ZmlsdGVyIGlkPSJuIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iMC44NSIgbnVtT2N0YXZlcz0iMiIgc3RpdGNoVGlsZXM9InN0aXRjaCIvPjxmZUNvbG9yTWF0cml4IHZhbHVlcz0iMCAwIDAgMCAwLjUgIDAgMCAwIDAgMC41ICAwIDAgMCAwIDAuNSAgMCAwIDAgMC43IDAiLz48L2ZpbHRlcj4KICA8cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWx0ZXI9InVybCgjbikiLz4KPC9zdmc+Cg==") repeat; mix-blend-mode: multiply;
}
/* Les panneaux laissent deviner la scène */
.ambiance-lofi .sidebar, .ambiance-lofi .topbar, .ambiance-lofi .mcard, .ambiance-lofi .lesson, .ambiance-lofi .fc,
.ambiance-lofi .qq, .ambiance-lofi .ex, .ambiance-lofi .hit, .ambiance-lofi .qbar, .ambiance-lofi .notes-empty {
  backdrop-filter: blur(16px) saturate(1.15); -webkit-backdrop-filter: blur(16px) saturate(1.15);
}
.ambiance-lofi .sidebar { border-right-color: transparent; }
.ambiance-lofi .home-hero h1, .ambiance-lofi .ptitle h1 { text-shadow: 0 1px 0 var(--bg-elev); }

/* ---------- Responsive ---------- */

  .app { grid-template-columns: 1fr; }
  .topbar {

  .sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: min(86vw, 320px); z-index: 30; transform: translateX(-104%); transition: transform 0.2s; box-shadow: var(--shadow); }
  .sidebar.open { transform: translateX(0); }
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 25; }
  .main { padding: 1.3rem 1rem 4rem; }
  .home-hero { grid-template-columns: 1fr; }
  .big-pct { text-align: left; }
  .strip { grid-template-columns: repeat(5, 1fr); }
  .banner { grid-template-columns: 1fr; padding: 1.3rem 1.2rem; }
  .banner .bigring { display: none; }
  .banner .wm { font-size: 7rem; }
  .lesson-body dl { grid-template-columns: 1fr; }
  .lesson-head, .ex .head { grid-template-columns: auto 1fr; }
  .lesson-head .toggle, .ex .head .toggle { grid-column: 1 / -1; justify-self: start; }
  .seg button { flex: 1 1 30%; }
}

@media print {
  .sidebar, .topbar, .seg, .toolbar, .back, .foot, .toggle, .btn, .fc .front { display: none !important; }

<script>
var MODULES = [{"id":"startups","code":"S9","priority":3,"title":"Financement des startups & capital-risque","tagline":"Cycle de financement, acteurs du capital-risque, instruments, valorisation en incertitude et lecture d'un term sheet.","hue":24,"lessons":[{"title":"Le cycle de financement d'une startup","html":"<p>Une startup se finance par étapes successives, chacune correspondant à un niveau de maturité et à un type d'investisseur :<\/p>\n<dl>\n  <dt>Love money<\/dt><dd>apports des fondateurs, famille et proches — petits montants, quasi sans négociation.<\/dd>\n  <dt>Business angels<\/dt><dd>particuliers fortunés investissant leur propre argent (50 k€ à 500 k€ typiquement), souvent avec un accompagnement.<\/dd>\n  <dt>Amorçage (seed)<\/dt><dd>premier tour structuré avec des fonds spécialisés, pour valider le produit et les premiers clients.<\/dd>\n  <dt>Séries A, B, C…<\/dt><dd>tours successifs de plus en plus gros pour accélérer (produit, commercial, international). Chaque tour est mené par un « lead investor ».<\/dd>\n  <dt>Sortie (exit)<\/dt><dd>introduction en bourse (IPO) ou cession à un industriel (trade sale) ou à un autre fonds (secondary) : c'est là que les investisseurs réalisent leur plus-value.<\/dd>\n<\/dl>\n<p>À chaque tour, l'entreprise émet de nouvelles actions : les actionnaires existants sont <strong>dilués<\/strong>. La table de capitalisation (cap table) suit la répartition du capital tour après tour.<\/p>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>Post-money = Pre-money + montant levé. La part de l'investisseur = montant levé ÷ post-money. Tout le reste (dilution, cap table) découle de ces deux égalités.<\/p><\/div>"},{"title":"Les acteurs du capital-risque","html":"<p>Un fonds de capital-risque (venture capital, VC) est en général structuré en deux niveaux : les <strong>LP<\/strong> (limited partners : institutionnels, family offices, assureurs) apportent l'argent ; les <strong>GP<\/strong> (general partners : l'équipe de gestion) sélectionnent et accompagnent les participations.<\/p>\n<ul>\n  <li>Durée de vie du fonds : environ 10 ans (5 ans d'investissement, 5 ans de gestion et sortie).<\/li>\n  <li>Rémunération des GP : frais de gestion (~2 % par an des montants engagés) et « carried interest » (~20 % de la plus-value au-delà d'un rendement minimum, le « hurdle rate »).<\/li>\n  <li>Logique de portefeuille : sur 10 participations, quelques-unes échouent, la plupart rendent à peine la mise, une ou deux font le rendement du fonds (« power law »).<\/li>\n<\/ul>\n<p>Autres acteurs : corporate venture (fonds d'un grand groupe, logique stratégique), Bpifrance (financement public, prêts d'amorçage, co-investissement), accélérateurs et incubateurs (accompagnement contre une petite part du capital).<\/p>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>Le VC exige un rendement élevé (TRI cible 25-35 %) parce qu'il finance des actifs illiquides, risqués, et que quelques réussites doivent compenser de nombreux échecs.<\/p><\/div>"},{"title":"Les instruments et les clauses du pacte","html":"<p>Les investisseurs n'achètent presque jamais des actions ordinaires « nues ». Ils négocient des <strong>actions de préférence<\/strong> assorties de droits spécifiques, et parfois des instruments intermédiaires :<\/p>\n<dl>\n  <dt>BSA-AIR<\/dt><dd>bon de souscription « accord d'investissement rapide » : l'investisseur apporte les fonds maintenant, la valorisation sera fixée au tour suivant avec une décote et souvent un plafond (cap).<\/dd>\n  <dt>Obligation convertible<\/dt><dd>dette qui se convertit en actions au tour suivant, à des conditions négociées (décote, cap).<\/dd>\n<\/dl>\n<p>Clauses fréquentes du pacte d'actionnaires :<\/p>\n<ul>\n  <li><strong>Préférence de liquidation<\/strong> : en cas de sortie, l'investisseur récupère d'abord sa mise (1x, parfois plus), avant le partage avec les autres.<\/li>\n  <li><strong>Anti-dilution<\/strong> : si un tour suivant se fait à une valorisation plus basse (down round), l'investisseur reçoit des actions supplémentaires (« full ratchet » — le plus dur — ou « weighted average »).<\/li>\n  <li><strong>Drag-along / tag-along<\/strong> : obligation de suivre une cession majoritaire / droit de vendre aux mêmes conditions.<\/li>\n  <li><strong>Vesting<\/strong> des fondateurs : leurs actions se « libèrent » progressivement (souvent 4 ans, avec un « cliff » d'un an) ; en cas de départ, clauses de good/bad leaver.<\/li>\n<\/ul>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>La valorisation affichée d'un tour ne dit pas tout : la préférence de liquidation et l'anti-dilution changent radicalement ce que les fondateurs touchent réellement à la sortie.<\/p><\/div>"},{"title":"Valoriser une startup et suivre ses métriques","html":"<p>Sans historique de résultats, le DCF est peu fiable. On utilise des méthodes qui partent de la sortie espérée ou de comparables :<\/p>\n<dl>\n  <dt>VC method<\/dt><dd>on estime la valeur de sortie dans n années, on l'actualise au TRI exigé (ou on la divise par le multiple visé) : cela donne la valorisation post-money acceptable aujourd'hui.<\/dd>\n  <dt>Multiples<\/dt><dd>valorisation = multiple × ARR (revenu annuel récurrent) pour les SaaS, ou × GMV, × utilisateurs selon le secteur.<\/dd>\n  <dt>Berkus / Scorecard<\/dt><dd>méthodes qualitatives pour l'amorçage : on attribue une valeur à chaque facteur (équipe, produit, marché, traction).<\/dd>\n<\/dl>\n<p>Métriques suivies par les investisseurs :<\/p>\n<ul>\n  <li><strong>Burn rate<\/strong> : trésorerie consommée par mois ; <strong>runway<\/strong> : nombre de mois avant la panne sèche.<\/li>\n  <li><strong>CAC<\/strong> (coût d'acquisition client) et <strong>LTV<\/strong> (valeur vie client) : on vise LTV/CAC &gt; 3.<\/li>\n  <li><strong>Churn<\/strong> : taux de perte de clients ; <strong>MRR/ARR<\/strong> : revenu récurrent mensuel/annuel.<\/li>\n<\/ul>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>Runway = trésorerie ÷ burn rate mensuel. Une startup lève en général 12 à 18 mois de runway, et commence le tour suivant 6 mois avant la fin.<\/p><\/div>"},{"title":"Application : lire un term sheet de série A","html":"<p>Exemple : une startup a 1 000 000 d'actions détenues par les fondateurs. Un fonds propose 2 M€ sur une valorisation pre-money de 6 M€.<\/p>\n<ul>\n  <li>Post-money = 6 + 2 = 8 M€. Part du fonds = 2 ÷ 8 = 25 %.<\/li>\n  <li>Prix par action = 6 M€ ÷ 1 000 000 = 6 €. Actions émises = 2 M€ ÷ 6 € ≈ 333 333.<\/li>\n  <li>Les fondateurs passent de 100 % à 1 000 000 ÷ 1 333 333 = 75 %.<\/li>\n  <li>Si le term sheet prévoit un pool d'options (BSPCE) de 10 % post-money créé <em>avant<\/em> l'entrée du fonds, la dilution est supportée par les fondateurs seuls : ils tombent à 65 %.<\/li>\n<\/ul>\n<p>Points à vérifier dans un term sheet : valorisation pre/post et traitement du pool d'options, préférence de liquidation (1x non participante est le standard « équilibré »), anti-dilution (weighted average plutôt que full ratchet), gouvernance (siège au board, droits de veto), clauses de sortie.<\/p>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>Sais refaire ce calcul en 4 lignes (post-money, %, prix par action, actions émises) — c'est l'exercice type de ce module.<\/p><\/div>"}],"glossary":[{"term":"Pre-money","def":"Valorisation de l'entreprise juste avant l'entrée des nouveaux investisseurs."},{"term":"Post-money","def":"Valorisation juste après le tour : pre-money + montant levé. Sert de base au calcul de la part des investisseurs."},{"term":"Dilution","def":"Baisse du pourcentage de capital détenu par les actionnaires existants lorsque de nouvelles actions sont émises."},{"term":"Cap table","def":"Table de capitalisation : tableau qui liste tous les actionnaires, leurs titres et leurs pourcentages, tour après tour."},{"term":"Term sheet","def":"Lettre d'intention non engageante qui résume les conditions financières et juridiques proposées par l'investisseur avant la documentation définitive."},{"term":"BSA-AIR","def":"Bon de souscription d'actions « accord d'investissement rapide » : financement immédiat dont la valorisation est fixée au tour suivant, avec décote et plafond."},{"term":"Préférence de liquidation","def":"Droit de l'investisseur à récupérer sa mise (1x ou plus) en priorité lors d'une sortie, avant tout partage avec les actionnaires ordinaires."},{"term":"Anti-dilution (ratchet)","def":"Clause qui protège l'investisseur si un tour suivant se fait à valorisation inférieure, en lui attribuant des actions supplémentaires (full ratchet ou weighted average)."},{"term":"Vesting","def":"Acquisition progressive des actions des fondateurs ou salariés dans le temps (souvent 4 ans avec un cliff d'un an), pour garantir leur engagement."},{"term":"Burn rate / runway","def":"Trésorerie nette consommée par mois / nombre de mois de trésorerie restants au rythme actuel."},{"term":"Carried interest","def":"Part de la plus-value (généralement 20 %) reversée à l'équipe de gestion d'un fonds au-delà d'un rendement minimum."},{"term":"Exit","def":"Sortie des investisseurs : introduction en bourse, cession à un industriel ou à un autre fonds."}],"formulas":[{"name":"Post-money","f":"Post-money = Pre-money + Montant levé","note":"Base de tout calcul de tour."},{"name":"Part de l'investisseur","f":"% investisseur = Montant levé ÷ Post-money","note":"Ex. 2 M€ sur 8 M€ post = 25 %."},{"name":"Dilution des anciens actionnaires","f":"Nouvelle part = Ancienne part × (Pre-money ÷ Post-money)","note":"Ex. 100 % × 6/8 = 75 %."},{"name":"Prix par action et actions émises","f":"Prix = Pre-money ÷ Nombre d'actions existantes ; Actions émises = Montant levé ÷ Prix","note":"Vérifie que ancien + nouveau = 100 %."},{"name":"VC method","f":"Post-money = Valeur de sortie ÷ (1 + TRI exigé)^n  (ou Valeur de sortie ÷ multiple visé)","note":"Pre-money = Post-money − montant investi."},{"name":"Runway","f":"Runway (mois) = Trésorerie disponible ÷ Burn rate mensuel net","note":"Lever 12-18 mois de runway."},{"name":"LTV et ratio LTV/CAC","f":"LTV = ARPU × marge brute ÷ taux de churn ; cible LTV/CAC > 3","note":"ARPU = revenu moyen par client par période."}],"quiz":[{"q":"Une startup lève 1 M€ sur une valorisation pre-money de 4 M€. Quelle part du capital obtient l'investisseur ?","options":["25 %","20 %","33 %","80 %"],"correct":1,"explain":"Post-money = 4 + 1 = 5 M€ ; part = 1 ÷ 5 = 20 %."},{"q":"Qu'est-ce qu'un BSA-AIR ?","options":["Une action de préférence avec dividende garanti","Un instrument qui finance immédiatement en reportant la valorisation au tour suivant","Un prêt bancaire garanti par Bpifrance","Une option d'achat sur les actions des fondateurs"],"correct":1,"explain":"Le BSA-AIR reporte la fixation de la valorisation au tour suivant, avec décote et plafond négociés."},{"q":"La préférence de liquidation 1x signifie que l'investisseur :","options":["Reçoit le double de sa mise en cas de sortie","Récupère sa mise en priorité avant tout partage","Est remboursé uniquement en cas de faillite","Renonce à tout dividende"],"correct":1,"explain":"En cas de sortie, l'investisseur touche d'abord 1x son investissement, puis le solde est partagé selon les règles du pacte."},{"q":"Le « carried interest » d'un fonds de VC correspond à :","options":["Les frais de gestion annuels","La part de plus-value reversée à l'équipe de gestion","Les intérêts payés aux LP","Le taux d'actualisation utilisé"],"correct":1,"explain":"Le carried (souvent 20 %) rémunère les GP sur la performance, au-delà du hurdle rate."},{"q":"Une startup a 300 k€ en banque et un burn rate net de 50 k€/mois. Son runway est de :","options":["3 mois","6 mois","12 mois","15 mois"],"correct":1,"explain":"300 ÷ 50 = 6 mois. Il est temps de préparer le tour suivant."},{"q":"Le vesting avec « cliff » d'un an signifie que :","options":["Les actions sont vendues au bout d'un an","Aucune action n'est acquise avant 12 mois, puis acquisition progressive","Le fondateur reçoit toutes ses actions à la signature","Les actions sont bloquées 4 ans sans exception"],"correct":1,"explain":"Le cliff empêche un départ précoce de repartir avec des actions ; après 12 mois, le vesting devient progressif."},{"q":"La méthode « VC method » consiste à :","options":["Actualiser les dividendes futurs","Partir de la valeur de sortie espérée et la ramener à aujourd'hui au TRI exigé","Additionner les actifs de la startup","Appliquer un PER sectoriel au bénéfice actuel"],"correct":1,"explain":"Faute de résultats, on raisonne à partir de la sortie : valeur de sortie ÷ (1+TRI)^n = post-money acceptable."},{"q":"Un ratio LTV/CAC de 1,2 indique que :","options":["L'acquisition client est très rentable","Chaque client rapporte à peine plus qu'il ne coûte à acquérir — modèle fragile","Le churn est nul","La startup n'a pas de clients"],"correct":1,"explain":"On vise LTV/CAC > 3 ; à 1,2, la marge dégagée par client couvre à peine son coût d'acquisition."}],"exercises":[{"title":"Calcul de dilution","statement":"Les fondateurs détiennent 2 000 000 d'actions (100 %). Un fonds investit 3 M€ sur une pre-money de 9 M€. Calcule le post-money, la part du fonds, le prix par action, le nombre d'actions émises et la part finale des fondateurs.","solution":"Post-money = 12 M€. Part du fonds = 3 ÷ 12 = 25 %. Prix par action = 9 M€ ÷ 2 000 000 = 4,50 €. Actions émises = 3 M€ ÷ 4,50 = 666 667. Fondateurs = 2 000 000 ÷ 2 666 667 = 75 %."},{"title":"VC method","statement":"Un fonds vise une sortie à 60 M€ dans 5 ans et exige un TRI de 40 %. Il souhaite investir 4 M€. Quelle valorisation post-money maximale peut-il accepter, et quelle pre-money cela implique-t-il ?","solution":"(1,40)^5 ≈ 5,38. Post-money max = 60 ÷ 5,38 ≈ 11,2 M€. Pre-money = 11,2 − 4 ≈ 7,2 M€. Part du fonds = 4 ÷ 11,2 ≈ 36 %."},{"title":"Runway et prochain tour","statement":"Trésorerie : 900 k€. Charges mensuelles : 120 k€, revenus mensuels : 40 k€. Combien de mois de runway ? Si un tour prend 6 mois à boucler, quand faut-il le lancer ?","solution":"Burn net = 120 − 40 = 80 k€/mois. Runway = 900 ÷ 80 ≈ 11 mois. Il faut lancer la levée dès maintenant ou au plus tard dans 5 mois (11 − 6)."}],"notes":""},{"id":"risques","code":"S9","priority":1,"title":"Contrôle et gestion des risques financiers","tagline":"Typologie des risques, exposition de taux et de change, dérivés de couverture, VaR, contrôle interne — et le risque de crédit client vu du terrain.","hue":355,"lessons":[{"title":"Les quatre familles de risques financiers","html":"<p>On distingue quatre grandes familles de risques financiers dans une entreprise :<\/p>\n<dl>\n  <dt>Risque de crédit<\/dt><dd>probabilité qu'une contrepartie (client, emprunteur, banque) ne paie pas ce qu'elle doit.<\/dd>\n  <dt>Risque de marché<\/dt><dd>variation défavorable d'un prix : taux d'intérêt, taux de change, cours des actions, matières premières.<\/dd>\n  <dt>Risque de liquidité<\/dt><dd>incapacité à mobiliser du cash à temps pour honorer un engagement, même si l'entreprise est solvable sur le papier.<\/dd>\n  <dt>Risque opérationnel<\/dt><dd>pertes liées à des processus, systèmes ou personnes défaillants : erreur de saisie, fraude, panne informatique, cyberattaque.<\/dd>\n<\/dl>\n<p>Le risque de crédit se décompose en trois paramètres dont le produit donne la perte attendue :<\/p>\n<div class=\"formula\">Perte attendue (ECL) = PD × EAD × LGD\nPD = probabilité de défaut · EAD = exposition au moment du défaut · LGD = perte en cas de défaut (1 − taux de récupération)<\/div>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>Cette formule est la base de la dépréciation des créances sous IFRS 9 — elle revient dans la dernière leçon de ce module et dans le module Entreprise et valeur.<\/p><\/div>"},{"title":"Mesurer l'exposition : taux et change","html":"<p>Avant de couvrir, il faut mesurer. Deux expositions classiques en entreprise :<\/p>\n<p><strong>Risque de change.<\/strong> Une entreprise qui facture en dollars et paie ses charges en euros est exposée à la baisse du dollar. On distingue l'exposition de transaction (flux déjà engagés), de consolidation (filiales étrangères) et économique (compétitivité). La position de change nette = créances en devise − dettes en devise, par devise et par échéance.<\/p>\n<p><strong>Risque de taux.<\/strong> Une dette à taux variable expose à la hausse des taux ; un placement à taux fixe expose à la hausse des taux (perte de valeur). La sensibilité d'une obligation se mesure par la <strong>duration<\/strong> : plus elle est longue, plus le prix réagit aux taux.<\/p>\n<div class=\"formula\">Variation de prix d'une obligation ≈ − Duration modifiée × Δ taux × Prix\nDuration modifiée = Duration ÷ (1 + taux)<\/div>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>On ne couvre que ce qu'on a mesuré : position nette par devise et par échéance, gap de taux entre actifs et passifs.<\/p><\/div>"},{"title":"Se couvrir : les instruments dérivés","html":"<p>Quatre familles d'instruments permettent de couvrir un risque de marché :<\/p>\n<dl>\n  <dt>Forward<\/dt><dd>contrat de gré à gré qui fixe aujourd'hui un prix pour une transaction future — engagement ferme des deux parties. Ex. : vente à terme de 1 M$ à 0,92 € dans 3 mois.<\/dd>\n  <dt>Future<\/dt><dd>équivalent standardisé et coté du forward, avec appels de marge quotidiens et une chambre de compensation qui élimine le risque de contrepartie.<\/dd>\n  <dt>Option<\/dt><dd>droit, non obligation, d'acheter (call) ou de vendre (put) à un prix fixé (strike), moyennant une prime payée d'avance. L'acheteur limite sa perte à la prime et garde le potentiel favorable.<\/dd>\n  <dt>Swap<\/dt><dd>échange de flux futurs. Le swap de taux échange un taux fixe contre un taux variable sur un même notionnel (sans échanger le capital) ; le swap de devises échange des flux dans deux devises.<\/dd>\n<\/dl>\n<p>Comptablement, IFRS 9 permet la « comptabilité de couverture » si la relation de couverture est documentée et efficace, ce qui évite la volatilité du résultat.<\/p>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>Forward et future = engagement ferme (on renonce au gain potentiel) ; option = droit (perte limitée à la prime, on garde le gain potentiel — mais ça coûte).<\/p><\/div>"},{"title":"Mesurer le risque : VaR et stress tests","html":"<p>La Value at Risk (VaR) estime la perte maximale probable sur un horizon donné, avec un niveau de confiance donné (95 % ou 99 %). Trois approches :<\/p>\n<ul>\n  <li><strong>Paramétrique<\/strong> : suppose des rendements normaux ; VaR = valeur × z × σ.<\/li>\n  <li><strong>Historique<\/strong> : on rejoue les variations passées et on prend le quantile.<\/li>\n  <li><strong>Monte-Carlo<\/strong> : on simule des milliers de scénarios.<\/li>\n<\/ul>\n<div class=\"formula\">VaR paramétrique = Valeur du portefeuille × z × σ\nz = 1,645 (95 %) · 2,326 (99 %) · VaR sur T jours ≈ VaR 1 jour × √T<\/div>\n<p>Limites : l'hypothèse de normalité sous-estime les événements extrêmes (« queues épaisses ») ; la VaR ne dit rien de l'ampleur de la perte au-delà du seuil (d'où l'« expected shortfall », moyenne des pertes au-delà de la VaR). Les <strong>stress tests<\/strong> complètent en simulant des chocs : crise de 2008, hausse de taux de 300 pb, défaut du premier client.<\/p>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>VaR 99 % > VaR 95 % ; la VaR croît avec la racine du temps ; les stress tests répondent à « et si ça dérape vraiment ? ».<\/p><\/div>"},{"title":"Le contrôle interne : cadre COSO et trois lignes","html":"<p>Le référentiel COSO structure le contrôle interne autour de cinq composantes :<\/p>\n<ul>\n  <li>l'environnement de contrôle (culture, valeurs, organisation, exemplarité de la direction) ;<\/li>\n  <li>l'évaluation des risques (cartographie : probabilité × impact) ;<\/li>\n  <li>les activités de contrôle (procédures, autorisations, séparation des tâches, rapprochements) ;<\/li>\n  <li>l'information et la communication ;<\/li>\n  <li>le pilotage — la supervision continue du dispositif dans le temps.<\/li>\n<\/ul>\n<p>Le principe le plus testé en pratique est la <strong>séparation des tâches<\/strong> : la personne qui engage une opération ne doit pas être celle qui la valide, ni celle qui l'exécute ou l'enregistre.<\/p>\n<p>Le modèle des « trois lignes de maîtrise » : la première ligne (les opérationnels) gère le risque au quotidien ; la deuxième (risques, conformité, contrôle de gestion) définit le cadre et contrôle ; la troisième (l'audit interne) évalue l'ensemble de façon indépendante et rapporte au comité d'audit.<\/p>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>Cinq composantes COSO, trois lignes de maîtrise, et un exemple concret de séparation des tâches (circuit achats ou circuit des encaissements) : c'est le trio à connaître par cœur.<\/p><\/div>"},{"title":"Application : le risque de crédit client, du terrain à la norme","html":"<p>IFRS 9 impose un modèle de dépréciation en « pertes attendues » à trois stades : stade 1 (risque normal, provision = pertes attendues à 12 mois), stade 2 (dégradation significative, provision = pertes attendues à maturité), stade 3 (défaut avéré). Pour les créances commerciales, l'approche simplifiée utilise directement une <strong>matrice de provisionnement<\/strong> par tranche d'ancienneté.<\/p>\n<p>Une balance âgée est exactement cette matrice en devenir : chaque tranche (0-30, 31-60, 61-90, +90 jours) porte un taux de perte historique croissant. Provision = Σ (encours de la tranche × taux de perte de la tranche).<\/p>\n<p>Le contrôle du risque client en amont : limite de crédit par client, scoring (historique, notation Banque de France, comportement de paiement), conditions générales (acomptes, pénalités de retard), assurance-crédit, et priorisation des relances là où la perte attendue (montant × probabilité de non-paiement) est la plus forte — c'est la logique d'un TOP 15.<\/p>\n<div class=\"formula\">Provision IFRS 9 (approche simplifiée) = Σ (Encours par tranche d'ancienneté × Taux de perte attendu de la tranche)<\/div>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>Balance âgée → matrice de provisionnement → perte attendue : sais dérouler ce lien en une phrase, c'est l'angle qui rentabilise le plus ce module par rapport à ton poste.<\/p><\/div>"}],"glossary":[{"term":"PD / EAD / LGD","def":"Probabilité de défaut, exposition au moment du défaut, perte en cas de défaut : les trois composantes de la perte attendue (ECL = PD × EAD × LGD)."},{"term":"Risque de contrepartie","def":"Risque que l'autre partie d'un contrat (dérivé, dépôt, créance) ne tienne pas son engagement."},{"term":"Position de change","def":"Différence entre avoirs et engagements dans une devise, par échéance ; base de toute couverture de change."},{"term":"Duration","def":"Durée moyenne pondérée des flux d'une obligation ; mesure sa sensibilité aux variations de taux."},{"term":"Forward","def":"Contrat de gré à gré fixant aujourd'hui le prix d'une opération future ; engagement ferme des deux parties."},{"term":"Future","def":"Contrat à terme standardisé, coté, avec appels de marge et chambre de compensation."},{"term":"Option (call / put)","def":"Droit d'acheter (call) ou de vendre (put) à un prix fixé (strike) jusqu'à une échéance, contre paiement d'une prime."},{"term":"Swap de taux","def":"Échange de flux d'intérêts fixes contre variables sur un notionnel identique, sans échange du capital."},{"term":"Notionnel","def":"Montant de référence sur lequel sont calculés les flux d'un dérivé ; il n'est pas échangé."},{"term":"VaR","def":"Value at Risk : perte maximale probable sur un horizon et à un niveau de confiance donnés."},{"term":"Expected shortfall","def":"Perte moyenne dans les cas où la VaR est dépassée ; corrige la principale limite de la VaR."},{"term":"Stress test","def":"Simulation d'un scénario extrême (historique ou hypothétique) pour mesurer l'impact sur l'entreprise."},{"term":"COSO","def":"Référentiel de contrôle interne en cinq composantes : environnement, évaluation des risques, activités de contrôle, information/communication, pilotage."},{"term":"Séparation des tâches","def":"Principe selon lequel engager, valider, exécuter et enregistrer une opération doivent relever de personnes différentes."},{"term":"Trois lignes de maîtrise","def":"Opérationnels (1), fonctions risques/conformité (2), audit interne (3) : répartition des responsabilités de contrôle."},{"term":"Matrice de provisionnement","def":"Tableau IFRS 9 (approche simplifiée) donnant un taux de perte attendu par tranche d'ancienneté des créances."}],"formulas":[{"name":"Perte attendue (ECL)","f":"ECL = PD × EAD × LGD","note":"LGD = 1 − taux de récupération."},{"name":"VaR paramétrique","f":"VaR = Valeur × z × σ","note":"z = 1,282 (90 %) · 1,645 (95 %) · 2,326 (99 %)."},{"name":"VaR sur un horizon T","f":"VaR(T jours) ≈ VaR(1 jour) × √T","note":"Hypothèse de rendements indépendants."},{"name":"Sensibilité d'une obligation","f":"ΔPrix ≈ − Duration modifiée × Δtaux × Prix","note":"Duration modifiée = Duration ÷ (1 + taux)."},{"name":"Résultat d'un call à l'échéance","f":"Gain acheteur = max(S − K ; 0) − prime","note":"S = cours à l'échéance, K = strike."},{"name":"Résultat d'un put à l'échéance","f":"Gain acheteur = max(K − S ; 0) − prime","note":"Couvre une baisse de S."},{"name":"Flux net d'un swap de taux","f":"Flux net = Notionnel × (taux fixe − taux variable) × (jours ÷ 360)","note":"Payé par la partie dont le taux est le plus élevé."},{"name":"Provision par matrice d'ancienneté","f":"Provision = Σ (encours tranche × taux de perte tranche)","note":"IFRS 9 approche simplifiée, créances commerciales."},{"name":"Score de risque (cartographie)","f":"Criticité = Probabilité × Impact","note":"Échelles 1 à 4 ou 1 à 5."}],"quiz":[{"q":"Que mesure la « perte en cas de défaut » (LGD) ?","options":["La probabilité que le client fasse défaut","La part de l'exposition qui ne sera pas récupérée si le défaut survient","Le montant total de la créance","Le délai moyen de paiement"],"correct":1,"explain":"LGD = 1 − taux de récupération. Elle est distincte de la PD (probabilité) et de l'EAD (exposition)."},{"q":"Une entreprise européenne qui encaissera 1 M$ dans 3 mois veut se couvrir sans renoncer à un éventuel gain si le dollar monte. Elle utilise :","options":["Une vente à terme (forward)","Un put sur dollar","Un swap de taux","Un future sur taux"],"correct":1,"explain":"Le put protège contre la baisse du dollar tout en gardant le potentiel de hausse ; le forward fige le cours."},{"q":"Un swap de taux classique échange :","options":["Deux devises différentes","Un taux fixe contre un taux variable sur un même notionnel","Des actions contre des obligations","Une créance contre une dette"],"correct":1,"explain":"Les flux d'intérêts sont échangés, jamais le notionnel."},{"q":"La VaR à 1 jour est de 10 000 €. La VaR à 16 jours vaut environ :","options":["160 000 €","40 000 €","10 000 €","2 500 €"],"correct":1,"explain":"VaR(T) ≈ VaR(1) × √T = 10 000 × 4 = 40 000 €."},{"q":"Quelle est la principale limite de la VaR paramétrique ?","options":["Elle est trop complexe à calculer","Elle suppose des rendements normaux et sous-estime les événements extrêmes","Elle ne s'applique qu'aux actions","Elle nécessite un ordinateur puissant"],"correct":1,"explain":"D'où les stress tests et l'expected shortfall."},{"q":"Parmi les composantes COSO, laquelle correspond à la supervision continue du dispositif ?","options":["L'environnement de contrôle","Le pilotage","L'évaluation des risques","L'information et la communication"],"correct":1,"explain":"Le pilotage (monitoring) vérifie dans la durée que les contrôles fonctionnent."},{"q":"Dans le modèle des trois lignes de maîtrise, l'audit interne est :","options":["La première ligne","La deuxième ligne","La troisième ligne","Hors du modèle"],"correct":2,"explain":"Il évalue de façon indépendante les deux premières lignes et rapporte au comité d'audit."},{"q":"Sous IFRS 9, l'approche simplifiée pour les créances commerciales utilise :","options":["Une provision forfaitaire de 5 %","Une matrice de taux de perte par tranche d'ancienneté","Aucune provision avant le défaut avéré","La valeur de marché des créances"],"correct":1,"explain":"Chaque tranche de la balance âgée reçoit un taux de perte attendu ; provision = Σ encours × taux."}],"exercises":[{"title":"VaR paramétrique","statement":"Un portefeuille vaut 500 000 €. L'écart-type mensuel des variations est de 4 %. Calcule la VaR mensuelle à 95 % (z = 1,645) et à 99 % (z = 2,326).","solution":"VaR 95 % = 500 000 × 1,645 × 0,04 = 32 900 €. VaR 99 % = 500 000 × 2,326 × 0,04 = 46 520 €. Interprétation : dans 95 % (resp. 99 %) des mois, la perte ne dépasse pas ce montant."},{"title":"Matrice de provisionnement IFRS 9","statement":"Balance âgée : non échu 400 k€ (taux de perte 0,5 %), 1-30 j 120 k€ (2 %), 31-90 j 60 k€ (8 %), +90 j 30 k€ (40 %). Calcule la provision totale.","solution":"400 × 0,5 % = 2 ; 120 × 2 % = 2,4 ; 60 × 8 % = 4,8 ; 30 × 40 % = 12. Provision = 21,2 k€, soit 3,5 % de l'encours total de 610 k€."},{"title":"Couverture de change à terme","statement":"Un exportateur recevra 2 M$ dans 6 mois. Cours comptant : 1 € = 1,10 $. Cours à terme 6 mois : 1 € = 1,12 $. Combien d'euros sécurise-t-il en vendant à terme ? Que se passe-t-il si dans 6 mois le cours est de 1,05 $ ?","solution":"À terme : 2 000 000 ÷ 1,12 = 1 785 714 €. Sans couverture à 1,05 $ : 2 000 000 ÷ 1,05 = 1 904 762 € — la couverture aurait « coûté » 119 048 € de manque à gagner, mais elle aurait protégé si le dollar avait baissé (ex. 1,20 $ → 1 666 667 €). Le forward fige, il ne parie pas."},{"title":"Faiblesse de contrôle interne","statement":"Dans une PME, le même collaborateur enregistre les règlements clients, lettre les comptes et prépare les avoirs. Quel risque et quelle correction ?","solution":"Cumul des fonctions d'enregistrement, de rapprochement et d'ajustement : un détournement d'encaissement pourrait être masqué par un avoir (schéma « lapping »). Correction : séparer l'émission des avoirs (validation par un responsable avec seuil), rapprochement bancaire par une autre personne, revue mensuelle des avoirs par la direction."}],"notes":""},{"id":"valeur","code":"S9","priority":2,"title":"Entreprise et valeur : IFRS, analyse financière, évaluation","tagline":"Lire des comptes en IFRS, diagnostiquer avec les bons ratios, puis valoriser par DCF et par multiples.","hue":212,"lessons":[{"title":"Le référentiel IFRS : principes et normes clés","html":"<p>Les IFRS (International Financial Reporting Standards) s'appliquent aux comptes consolidés des sociétés cotées européennes. Deux principes structurants : la <strong>prééminence de la substance sur la forme<\/strong> (on comptabilise la réalité économique) et un recours étendu à la <strong>juste valeur<\/strong> (fair value) à côté du coût historique.<\/p>\n<dl>\n  <dt>IAS 1 / IAS 7<\/dt><dd>présentation des états financiers / tableau des flux de trésorerie (exploitation, investissement, financement).<\/dd>\n  <dt>IFRS 9<\/dt><dd>instruments financiers : classement, évaluation, dépréciation des créances en pertes attendues, comptabilité de couverture.<\/dd>\n  <dt>IFRS 15<\/dt><dd>revenu : reconnu quand chaque obligation de performance est remplie (modèle en 5 étapes).<\/dd>\n  <dt>IFRS 16<\/dt><dd>locations : le preneur inscrit un droit d'utilisation à l'actif et une dette de loyers au passif — l'EBITDA monte, la dette aussi.<\/dd>\n  <dt>IAS 36 / IAS 38<\/dt><dd>dépréciation d'actifs (test de valeur recouvrable, goodwill) / immobilisations incorporelles (frais de développement activables sous conditions).<\/dd>\n<\/dl>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>Pour l'examen : IFRS 9 = créances et dérivés, IFRS 15 = chiffre d'affaires, IFRS 16 = loyers au bilan, IAS 36 = dépréciation/goodwill.<\/p><\/div>"},{"title":"Lire les comptes : bilan fonctionnel et SIG","html":"<p>Le <strong>bilan fonctionnel<\/strong> reclasse le bilan par cycles : investissement (actif immobilisé), financement (capitaux permanents = capitaux propres + dettes financières à long terme), exploitation (stocks, créances, dettes fournisseurs) et trésorerie.<\/p>\n<div class=\"formula\">FR = Capitaux permanents − Actif immobilisé\nBFR = Stocks + Créances d'exploitation − Dettes d'exploitation\nTrésorerie nette = FR − BFR<\/div>\n<p>Les <strong>soldes intermédiaires de gestion<\/strong> (SIG) décomposent le compte de résultat en cascade : marge commerciale → production → valeur ajoutée → excédent brut d'exploitation (EBE, proche de l'EBITDA) → résultat d'exploitation (REX, proche de l'EBIT) → résultat courant avant impôt → résultat net.<\/p>\n<p>La <strong>capacité d'autofinancement<\/strong> (CAF) mesure le cash potentiel généré par l'activité : résultat net + charges calculées (dotations) − produits calculés (reprises) − plus-values de cession.<\/p>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>Un FR positif finance le BFR ; si le BFR dépasse le FR, la trésorerie nette est négative et l'entreprise vit à découvert. C'est le diagnostic de base.<\/p><\/div>"},{"title":"Les ratios de diagnostic","html":"<p>Quatre familles de ratios, à toujours lire en tendance et en comparaison sectorielle :<\/p>\n<ul>\n  <li><strong>Rotation / délais<\/strong> : DSO (délai clients), DPO (délai fournisseurs), DIO (délai stocks). BFR en jours de CA = BFR ÷ CA × 360.<\/li>\n  <li><strong>Structure<\/strong> : endettement net ÷ capitaux propres (gearing), dette nette ÷ EBITDA (capacité de remboursement, alerte au-delà de 3-4x), autonomie financière.<\/li>\n  <li><strong>Rentabilité<\/strong> : marge d'EBITDA, ROCE (rentabilité économique des capitaux employés), ROE (rentabilité des capitaux propres).<\/li>\n  <li><strong>Liquidité<\/strong> : ratio de liquidité générale (actif circulant ÷ passif circulant), couverture des intérêts (EBIT ÷ charges d'intérêts).<\/li>\n<\/ul>\n<p>L'<strong>effet de levier<\/strong> relie les deux rentabilités : s'endetter augmente le ROE tant que la rentabilité économique dépasse le coût de la dette.<\/p>\n<div class=\"formula\">ROE = ROCE + (ROCE − i) × D ÷ CP   (après impôt)\nDSO = Créances clients TTC ÷ CA TTC × 365<\/div>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>Le levier joue dans les deux sens : si ROCE < i, la dette détruit de la rentabilité pour l'actionnaire (« effet de massue »).<\/p><\/div>"},{"title":"Évaluer par les flux : le DCF","html":"<p>La méthode DCF (discounted cash flows) valorise l'entreprise par la somme actualisée de ses flux de trésorerie disponibles futurs.<\/p>\n<ol>\n  <li>Prévoir les <strong>free cash flows<\/strong> (FCF) sur 5 à 7 ans : FCF = EBIT × (1 − t) + dotations − investissements − ΔBFR.<\/li>\n  <li>Calculer le <strong>WACC<\/strong> (coût moyen pondéré du capital) : moyenne du coût des fonds propres (ke, par le MEDAF) et du coût de la dette après impôt, pondérée par la structure financière cible.<\/li>\n  <li>Calculer la <strong>valeur terminale<\/strong> (Gordon-Shapiro) : FCF de l'année n+1 ÷ (WACC − g), g étant le taux de croissance à l'infini (prudent : 1-2 %).<\/li>\n  <li>Actualiser FCF et valeur terminale : on obtient la <strong>valeur d'entreprise<\/strong> (VE).<\/li>\n  <li>Passer à la <strong>valeur des fonds propres<\/strong> : VE − dette nette (dettes financières − trésorerie) − intérêts minoritaires + participations.<\/li>\n<\/ol>\n<div class=\"formula\">WACC = E/(D+E) × ke + D/(D+E) × kd × (1 − t)\nke = rf + β × (Rm − rf)\nVT = FCF(n+1) ÷ (WACC − g)<\/div>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>La valeur terminale pèse souvent 60-80 % de la VE : les hypothèses g et WACC sont donc les plus sensibles — toujours présenter une matrice de sensibilité.<\/p><\/div>"},{"title":"Évaluer par comparaison : multiples et ANR","html":"<p>Les <strong>multiples<\/strong> valorisent en appliquant à un agrégat de la cible le rapport observé sur des sociétés comparables (cotées : multiples boursiers ; ou transactions récentes : multiples transactionnels).<\/p>\n<ul>\n  <li>Multiples de valeur d'entreprise : VE ÷ EBITDA (le plus courant), VE ÷ EBIT, VE ÷ CA.<\/li>\n  <li>Multiples de capitaux propres : PER (cours ÷ BPA), P/B (cours ÷ actif net comptable).<\/li>\n  <li>Ajustements : décote d'illiquidité pour une société non cotée (20-30 %), prime de contrôle pour une acquisition majoritaire.<\/li>\n<\/ul>\n<p>L'<strong>actif net réévalué<\/strong> (ANR) : capitaux propres comptables corrigés des plus ou moins-values latentes sur les actifs — pertinent pour les holdings, foncières, sociétés à forte composante patrimoniale.<\/p>\n<p>En pratique, on croise les méthodes (« football field ») et on retient une fourchette, pas un chiffre.<\/p>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>VE/EBITDA compare des entreprises indépendamment de leur structure financière ; le PER dépend de l'endettement. Ne jamais mélanger un multiple de VE avec un agrégat de fonds propres.<\/p><\/div>"},{"title":"Application : le poste clients dans le diagnostic","html":"<p>Le DSO est l'indicateur qui mesure, à l'échelle de l'entreprise, l'efficacité du recouvrement. Un DSO de 60 jours signifie que le chiffre d'affaires d'environ deux mois est immobilisé chez les clients.<\/p>\n<ul>\n  <li>Impact trésorerie : chaque jour de DSO en plus immobilise CA TTC ÷ 365 de cash supplémentaire.<\/li>\n  <li>Impact résultat : les créances anciennes génèrent des provisions (IFRS 9) et des pertes définitives (créances irrécouvrables).<\/li>\n  <li>Impact valorisation : un BFR structurellement élevé réduit les FCF, donc la valeur DCF ; un acheteur ajuste le prix (« BFR normatif ») dans une acquisition.<\/li>\n<\/ul>\n<p>Un diagnostic complet du poste clients : DSO en tendance, balance âgée (part > 90 jours), concentration (part des 10 premiers clients), taux de litiges, taux de pertes sur créances, comparaison avec les conditions de paiement contractuelles (écart = retard moyen).<\/p>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>Sais faire le lien chiffré : ΔDSO × CA journalier = cash immobilisé ; c'est aussi l'argument pour justifier un investissement dans le recouvrement.<\/p><\/div>"}],"glossary":[{"term":"Juste valeur","def":"Prix qui serait reçu pour vendre un actif lors d'une transaction normale entre participants de marché à la date d'évaluation."},{"term":"Fonds de roulement (FR)","def":"Excédent des ressources stables sur les emplois stables ; finance le BFR."},{"term":"BFR","def":"Besoin en fonds de roulement : stocks + créances d'exploitation − dettes d'exploitation ; besoin de financement du cycle d'exploitation."},{"term":"Trésorerie nette","def":"FR − BFR ; disponibilités moins concours bancaires courants."},{"term":"EBE / EBITDA","def":"Résultat de l'exploitation avant amortissements, provisions, résultat financier et impôt ; mesure la performance opérationnelle brute."},{"term":"CAF","def":"Capacité d'autofinancement : flux de trésorerie potentiel dégagé par l'activité (résultat net + charges calculées − produits calculés)."},{"term":"DSO / DPO / DIO","def":"Délais moyens en jours de recouvrement clients, de paiement fournisseurs et de rotation des stocks."},{"term":"ROCE","def":"Return on capital employed : rentabilité économique = REX après impôt ÷ capitaux employés (immobilisations + BFR)."},{"term":"ROE","def":"Return on equity : rentabilité des capitaux propres = résultat net ÷ capitaux propres."},{"term":"Effet de levier","def":"Amplification du ROE par l'endettement, positive si la rentabilité économique dépasse le coût de la dette, négative sinon."},{"term":"WACC","def":"Coût moyen pondéré du capital : taux d'actualisation des FCF, moyenne du coût des fonds propres et de la dette après impôt."},{"term":"Free cash flow","def":"Flux de trésorerie disponible après impôt sur l'exploitation, investissements et variation de BFR ; ce qui revient aux apporteurs de capitaux."},{"term":"Valeur terminale","def":"Valeur de l'entreprise au-delà de l'horizon de prévision, calculée par une rente perpétuelle croissante (Gordon-Shapiro)."},{"term":"Valeur d'entreprise vs valeur des fonds propres","def":"VE = valeur de l'actif économique ; valeur des fonds propres = VE − dette nette."},{"term":"Dette nette","def":"Dettes financières − trésorerie et placements."},{"term":"PER","def":"Price earnings ratio : cours ÷ bénéfice par action ; multiple de capitaux propres."},{"term":"Goodwill","def":"Écart d'acquisition : prix payé − juste valeur des actifs nets identifiables ; soumis à un test de dépréciation annuel (IAS 36)."},{"term":"BFR normatif","def":"Niveau « normal » de BFR retenu dans une acquisition pour ajuster le prix."}],"formulas":[{"name":"Bilan fonctionnel","f":"FR = Capitaux permanents − Actif immobilisé ; BFR = Stocks + Créances − Dettes d'exploitation ; TN = FR − BFR","note":"Diagnostic d'équilibre financier."},{"name":"EBE","f":"EBE = Valeur ajoutée + Subventions d'exploitation − Impôts et taxes − Charges de personnel","note":"≈ EBITDA."},{"name":"CAF","f":"CAF = Résultat net + Dotations − Reprises + VNC des actifs cédés − Produits de cession","note":"Ou : EBE + produits encaissables − charges décaissables."},{"name":"Délais","f":"DSO = Créances TTC ÷ CA TTC × 365 ; DPO = Dettes fournisseurs ÷ Achats TTC × 365 ; DIO = Stocks ÷ Coût des ventes × 365","note":"365 ou 360 selon la convention du cours."},{"name":"Rentabilités","f":"ROE = Résultat net ÷ Capitaux propres ; ROCE = REX × (1 − t) ÷ (Immobilisations + BFR)","note":"t = taux d'impôt."},{"name":"Effet de levier","f":"ROE = ROCE + (ROCE − i) × D ÷ CP","note":"i = coût de la dette après impôt."},{"name":"Coût des fonds propres (MEDAF)","f":"ke = rf + β × (Rm − rf)","note":"rf = taux sans risque, (Rm − rf) = prime de risque de marché."},{"name":"WACC","f":"WACC = E/(D+E) × ke + D/(D+E) × kd × (1 − t)","note":"Pondérations en valeur de marché."},{"name":"Free cash flow","f":"FCF = EBIT × (1 − t) + Dotations − Capex − ΔBFR","note":"ΔBFR positif = consommation de cash."},{"name":"Valeur terminale (Gordon)","f":"VT = FCF(n+1) ÷ (WACC − g)","note":"Actualiser ensuite : VT ÷ (1 + WACC)^n."},{"name":"Du DCF à la valeur des titres","f":"VE = Σ FCF(t) ÷ (1 + WACC)^t + VT ÷ (1 + WACC)^n ; Valeur des fonds propres = VE − Dette nette","note":"Equity bridge."},{"name":"Multiples","f":"VE = multiple × EBITDA ; Capitalisation = PER × Résultat net","note":"Ne pas mélanger VE et fonds propres."},{"name":"Impact du DSO","f":"Cash immobilisé = ΔDSO × CA TTC ÷ 365","note":"Argument chiffré pour le recouvrement."}],"quiz":[{"q":"Sous IFRS 16, un contrat de location chez le preneur :","options":["Reste hors bilan","Crée un actif « droit d'utilisation » et une dette de loyers","Est comptabilisé en charge unique à la signature","N'a aucun effet sur l'EBITDA"],"correct":1,"explain":"L'actif et la dette apparaissent au bilan ; le loyer est remplacé par amortissement + intérêts, ce qui augmente l'EBITDA."},{"q":"FR = 200, BFR = 260. La trésorerie nette est de :","options":["+60","−60","+460","0"],"correct":1,"explain":"TN = FR − BFR = 200 − 260 = −60 : l'entreprise finance une partie de son BFR par du découvert."},{"q":"Le ROCE est de 8 % et le coût de la dette après impôt de 5 %. S'endetter davantage :","options":["Réduit le ROE","Augmente le ROE (levier positif)","N'a aucun effet sur le ROE","Rend le ROE négatif"],"correct":1,"explain":"ROCE > i : chaque euro emprunté rapporte plus qu'il ne coûte, le ROE augmente."},{"q":"Dans un DCF, la valeur terminale se calcule par :","options":["EBITDA × multiple sectoriel uniquement","FCF(n+1) ÷ (WACC − g)","Somme des dividendes passés","Capitaux propres × PER"],"correct":1,"explain":"Formule de Gordon-Shapiro, rente perpétuelle croissante au taux g."},{"q":"VE = 120 M€, dette financière = 40 M€, trésorerie = 10 M€. La valeur des fonds propres est :","options":["120 M€","80 M€","90 M€","150 M€"],"correct":2,"explain":"Dette nette = 40 − 10 = 30 ; fonds propres = 120 − 30 = 90 M€."},{"q":"Quel multiple compare des entreprises indépendamment de leur structure financière ?","options":["PER","VE / EBITDA","P/B","Dividende / cours"],"correct":1,"explain":"Le PER est affecté par les charges financières ; VE/EBITDA raisonne avant financement."},{"q":"Un DSO qui passe de 45 à 60 jours avec un CA TTC de 36,5 M€ immobilise en plus :","options":["150 000 €","1 500 000 €","15 000 €","6 000 000 €"],"correct":1,"explain":"CA journalier = 36,5 M ÷ 365 = 100 k€ ; 15 jours × 100 k€ = 1,5 M€."},{"q":"Le goodwill est :","options":["Amorti linéairement sur 5 ans en IFRS","Soumis à un test de dépréciation annuel (IAS 36)","Toujours nul dans les comptes consolidés","Un passif"],"correct":1,"explain":"En IFRS, le goodwill n'est pas amorti mais testé chaque année (et en cas d'indice de perte de valeur)."}],"exercises":[{"title":"Bilan fonctionnel","statement":"Capitaux propres 500, dettes financières LT 300, actif immobilisé 650, stocks 120, créances clients 210, dettes fournisseurs 160, disponibilités 20. Calcule FR, BFR et TN, puis vérifie la cohérence.","solution":"FR = (500 + 300) − 650 = 150. BFR = 120 + 210 − 160 = 170. TN = 150 − 170 = −20. Vérification : disponibilités 20 − concours bancaires 40 = −20 (il manque 40 de découvert au passif pour équilibrer, ce qui est cohérent avec une TN négative)."},{"title":"WACC et coût des fonds propres","statement":"rf = 3 %, prime de marché = 5 %, β = 1,2, coût de la dette avant impôt = 4 %, taux d'impôt 25 %, structure cible 60 % fonds propres / 40 % dette. Calcule ke puis le WACC.","solution":"ke = 3 % + 1,2 × 5 % = 9 %. kd après impôt = 4 % × 0,75 = 3 %. WACC = 0,6 × 9 % + 0,4 × 3 % = 5,4 % + 1,2 % = 6,6 %."},{"title":"DCF simplifié","statement":"FCF prévus : 10, 12, 14 (années 1 à 3). WACC = 8 %, g = 2 %. Dette nette = 30. Calcule la VE et la valeur des fonds propres.","solution":"Actualisation : 10/1,08 = 9,26 ; 12/1,08² = 10,29 ; 14/1,08³ = 11,11 → somme 30,66. VT = 14 × 1,02 ÷ (0,08 − 0,02) = 238 ; actualisée : 238 ÷ 1,08³ = 188,9. VE ≈ 219,6. Fonds propres = 219,6 − 30 ≈ 189,6. La VT représente 86 % de la VE : sensibilité forte à g et au WACC."},{"title":"Effet de levier","statement":"Capitaux employés 1 000 (CP 400, dette 600). REX 100, taux d'impôt 25 %, coût de la dette 4 % avant impôt. Calcule ROCE, i après impôt et ROE par la formule du levier, puis vérifie par le compte de résultat.","solution":"ROCE = 100 × 0,75 ÷ 1 000 = 7,5 %. i = 4 % × 0,75 = 3 %. ROE = 7,5 % + (7,5 % − 3 %) × 600/400 = 7,5 % + 6,75 % = 14,25 %. Vérification : intérêts 24, résultat avant impôt 76, RN = 57, ROE = 57 ÷ 400 = 14,25 %."}],"notes":""},{"id":"gouvernance","code":"S9","priority":2,"title":"Gouvernance, RSE & communication financière","tagline":"Théorie de l'agence, organes de gouvernance, finance durable (CSRD), obligations d'information et art du reporting.","hue":272,"lessons":[{"title":"Théorie de l'agence et mécanismes de gouvernance","html":"<p>La <strong>théorie de l'agence<\/strong> (Jensen et Meckling, 1976) décrit la relation entre un principal (l'actionnaire) et un agent (le dirigeant) dont les intérêts divergent et qui dispose de plus d'information. Il en résulte des <strong>coûts d'agence<\/strong> : coûts de surveillance (audit, conseil), coûts de dédouanement (reporting du dirigeant) et perte résiduelle.<\/p>\n<p>La gouvernance d'entreprise rassemble les mécanismes qui alignent les intérêts :<\/p>\n<ul>\n  <li><strong>internes<\/strong> : conseil d'administration et comités (audit, rémunérations, nominations), administrateurs indépendants, rémunération variable et actions de performance, « say on pay » (vote des actionnaires sur la rémunération) ;<\/li>\n  <li><strong>externes<\/strong> : marché du contrôle (OPA hostiles), analystes, agences de notation, activisme actionnarial, cadre légal.<\/li>\n<\/ul>\n<p>En France, le code AFEP-MEDEF (grandes sociétés cotées) et le code Middlenext fixent les bonnes pratiques selon le principe « appliquer ou expliquer » (comply or explain).<\/p>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>Trois coûts d'agence (surveillance, dédouanement, perte résiduelle) et deux familles de mécanismes (internes / externes) : c'est le squelette de toute question de cours sur la gouvernance.<\/p><\/div>"},{"title":"Les organes : structures, comités, contrôle légal","html":"<p>Une SA peut adopter une structure <strong>moniste<\/strong> (conseil d'administration + directeur général, éventuellement PDG cumulant les deux) ou <strong>dualiste<\/strong> (directoire qui dirige, conseil de surveillance qui contrôle). La dissociation président / directeur général est recommandée par les codes.<\/p>\n<p>Le <strong>comité d'audit<\/strong> (obligatoire pour les entités d'intérêt public) suit l'élaboration de l'information financière, l'efficacité du contrôle interne et de la gestion des risques, et l'indépendance des commissaires aux comptes.<\/p>\n<p>Les <strong>commissaires aux comptes<\/strong> certifient les comptes (audit légal), avec rotation obligatoire et limitation des services hors audit. La loi <strong>Sapin II<\/strong> impose un dispositif anticorruption (cartographie des risques, code de conduite, alerte interne) ; la loi sur le <strong>devoir de vigilance<\/strong> exige un plan couvrant les risques sociaux et environnementaux de la chaîne d'approvisionnement.<\/p>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>Moniste vs dualiste, rôle du comité d'audit, indépendance des CAC, Sapin II : sais les situer en deux phrases chacun.<\/p><\/div>"},{"title":"RSE et finance durable : ESG, CSRD, taxonomie","html":"<p>La responsabilité sociétale des entreprises (RSE) s'évalue selon trois piliers <strong>ESG<\/strong> : environnement (climat, ressources, pollution), social (condi
