tions de travail, diversité, chaîne d'approvisionnement), gouvernance (éthique, transparence, indépendance).<\/p>\n<p>La directive européenne <strong>CSRD<\/strong> impose un rapport de durabilité normé (standards <strong>ESRS<\/strong>), audité, fondé sur la <strong>double matérialité<\/strong> : l'impact de l'entreprise sur son environnement (matérialité d'impact) et l'impact des enjeux de durabilité sur sa performance financière (matérialité financière).<\/p>\n<p>La <strong>taxonomie<\/strong> européenne classe les activités économiques durables selon six objectifs environnementaux ; les entreprises publient la part de leur CA, capex et opex alignés. Les investisseurs utilisent des notations ESG et des fonds « article 8 / article 9 » (règlement SFDR). Le risque de <strong>greenwashing<\/strong> (communication trompeuse) est désormais sanctionné.<\/p>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>CSRD = quoi publier (ESRS), taxonomie = quelles activités sont vertes, double matérialité = les deux sens de l'impact. Ne pas les confondre à l'examen.<\/p><\/div>"},{"title":"Communication financière : obligations et pratiques","html":"<p>Une société cotée doit publier une <strong>information réglementée<\/strong> sous le contrôle de l'AMF : information <strong>périodique<\/strong> (rapport financier annuel avec comptes audités, rapport semestriel, et souvent informations trimestrielles) et information <strong>permanente<\/strong> (toute information privilégiée doit être rendue publique dès que possible, sauf différé justifié).<\/p>\n<p>Une <strong>information privilégiée<\/strong> est précise, non publique et susceptible d'influencer le cours : l'utiliser ou la transmettre constitue un délit ou manquement d'initié (règlement Abus de marché). Les « fenêtres négatives » interdisent aux initiés de traiter avant les publications.<\/p>\n<p>Pratiques : communiqués de résultats, <strong>guidance<\/strong> (objectifs annoncés) et <strong>profit warning<\/strong> (avertissement quand la guidance ne sera pas tenue), présentations aux analystes, roadshows, assemblée générale, site investisseurs. Principes : exactitude, précision, sincérité, égalité d'accès à l'information.<\/p>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>Information périodique vs permanente, définition de l'information privilégiée, rôle de l'AMF : les trois points incontournables.<\/p><\/div>"},{"title":"Application : construire un reporting de performance","html":"<p>Un bon reporting interne suit la même discipline que la communication financière externe : des chiffres justes, un message clair, des écarts expliqués, des actions engagées. Structure type en quatre temps :<\/p>\n<ol>\n  <li><strong>Contexte<\/strong> : périmètre, période, faits marquants (un client majeur en litige, un changement d'outil).<\/li>\n  <li><strong>Chiffres clés<\/strong> : 3 à 5 indicateurs maximum, en niveau et en tendance — pour le recouvrement : DSO, encours échu total, part > 90 jours, taux de recouvrement du mois, nombre de litiges.<\/li>\n  <li><strong>Écarts<\/strong> : par rapport à l'objectif et au mois précédent, avec la cause principale de chaque écart.<\/li>\n  <li><strong>Actions<\/strong> : ce qui a été fait, ce qui est prévu, ce qui nécessite une décision (ex. passage en contentieux, provision).<\/li>\n<\/ol>\n<p>Exemple de message : « Le DSO recule de 58 à 54 jours grâce à la priorisation des 15 plus gros dossiers ; l'encours > 90 jours reste concentré sur trois clients pour lesquels une mise en demeure est proposée. »<\/p>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>Contexte → chiffres → écarts → actions. Un reporting sans écarts expliqués ni actions n'est qu'un tableau.<\/p><\/div>"}],"glossary":[{"term":"Coûts d'agence","def":"Coûts nés de la divergence d'intérêts entre actionnaires et dirigeants : surveillance, dédouanement, perte résiduelle."},{"term":"Asymétrie d'information","def":"Situation où le dirigeant en sait plus que l'actionnaire sur l'entreprise ; source des problèmes d'agence."},{"term":"Administrateur indépendant","def":"Membre du conseil sans lien de dépendance (salarié, client, fournisseur, actionnaire important) avec la société."},{"term":"Comité d'audit","def":"Comité du conseil chargé du suivi de l'information financière, du contrôle interne, des risques et de l'indépendance des auditeurs."},{"term":"Say on pay","def":"Vote des actionnaires en assemblée générale sur la politique et les éléments de rémunération des dirigeants."},{"term":"Comply or explain","def":"Principe des codes de gouvernance : appliquer les recommandations ou expliquer pourquoi on s'en écarte."},{"term":"ESG","def":"Environnement, social, gouvernance : les trois piliers d'évaluation extra-financière."},{"term":"CSRD / ESRS","def":"Directive européenne sur le reporting de durabilité / standards de contenu de ce rapport."},{"term":"Double matérialité","def":"Analyser à la fois l'impact de l'entreprise sur la société et l'environnement, et l'impact financier des enjeux de durabilité sur l'entreprise."},{"term":"Taxonomie européenne","def":"Classification des activités économiques durables selon six objectifs environnementaux."},{"term":"Greenwashing","def":"Communication donnant une image écologique trompeuse ; sanctionnable comme pratique commerciale trompeuse."},{"term":"Information réglementée","def":"Ensemble des informations qu'une société cotée doit publier (périodiques et permanentes) sous contrôle de l'AMF."},{"term":"Information privilégiée","def":"Information précise, non publique, susceptible d'influencer sensiblement le cours ; son usage constitue un abus de marché."},{"term":"Guidance","def":"Objectifs chiffrés communiqués au marché par la direction (CA, marge, résultat)."},{"term":"Profit warning","def":"Avertissement sur résultats : annonce que les objectifs communiqués ne seront pas atteints."},{"term":"Devoir de vigilance","def":"Obligation légale pour les grandes entreprises d'identifier et prévenir les atteintes aux droits humains et à l'environnement dans leur chaîne de valeur."}],"formulas":[{"name":"Coûts d'agence","f":"Coûts d'agence = Coûts de surveillance + Coûts de dédouanement + Perte résiduelle","note":"Jensen & Meckling (1976)."},{"name":"Mécanismes de gouvernance","f":"Internes (conseil, comités, rémunération, say on pay) + Externes (marché du contrôle, analystes, notation, loi)","note":"Toujours citer les deux familles."},{"name":"Les trois piliers ESG","f":"E (climat, ressources, pollution) · S (travail, diversité, chaîne d'approvisionnement) · G (éthique, transparence, indépendance)","note":"Notation extra-financière."},{"name":"Double matérialité","f":"Matérialité d'impact (entreprise → monde) + Matérialité financière (monde → entreprise)","note":"Principe fondateur de la CSRD."},{"name":"Information privilégiée (3 critères)","f":"Précise + Non publique + Susceptible d'influencer sensiblement le cours","note":"Les trois doivent être réunis."},{"name":"Structure d'un reporting","f":"Contexte → Chiffres clés (3 à 5) → Écarts expliqués → Actions et décisions","note":"Vaut pour l'interne comme pour l'externe."},{"name":"Indicateurs recouvrement","f":"DSO · Encours échu · Part > 90 j · Taux de recouvrement du mois · Nombre de litiges","note":"En niveau et en tendance."}],"quiz":[{"q":"Dans la théorie de l'agence, le « principal » est :","options":["Le dirigeant","L'actionnaire","Le commissaire aux comptes","Le salarié"],"correct":1,"explain":"L'actionnaire (principal) délègue la gestion au dirigeant (agent)."},{"q":"Dans une structure dualiste, l'organe qui dirige est :","options":["Le conseil de surveillance","Le directoire","Le comité d'audit","L'assemblée générale"],"correct":1,"explain":"Le directoire dirige, le conseil de surveillance contrôle."},{"q":"Le principe « comply or explain » signifie :","options":["Appliquer toutes les lois sans exception","Appliquer les recommandations du code ou justifier les écarts","Expliquer les comptes aux salariés","Se conformer aux normes IFRS"],"correct":1,"explain":"Les codes de gouvernance ne sont pas contraignants, mais tout écart doit être expliqué."},{"q":"La double matérialité consiste à analyser :","options":["Deux exercices comptables","L'impact de l'entreprise sur le monde et l'impact des enjeux ESG sur l'entreprise","Les comptes sociaux et consolidés","Les risques financiers et opérationnels"],"correct":1,"explain":"C'est le principe central de la CSRD."},{"q":"La taxonomie européenne sert à :","options":["Classer les activités économiques durables","Fixer le taux d'impôt sur les sociétés","Noter les dirigeants","Publier les comptes semestriels"],"correct":0,"explain":"Elle définit quelles activités contribuent aux objectifs environnementaux."},{"q":"Une information est privilégiée si elle est :","options":["Publiée dans un communiqué","Précise, non publique et susceptible d'influencer le cours","Connue uniquement des salariés","Relative aux dividendes"],"correct":1,"explain":"Les trois critères doivent être réunis ; l'utiliser est un abus de marché."},{"q":"Un « profit warning » est :","options":["Une hausse de dividende","Un avertissement que les objectifs annoncés ne seront pas atteints","Un rapport du comité d'audit","Une sanction de l'AMF"],"correct":1,"explain":"Il relève de l'information permanente : à publier dès que l'écart est avéré."},{"q":"Dans un reporting de performance, l'élément le plus souvent oublié et pourtant décisif est :","options":["Le logo","Les écarts expliqués et les actions","Le nombre de pages","La couleur des graphiques"],"correct":1,"explain":"Sans écart expliqué ni action, le reporting n'aide pas à décider."}],"exercises":[{"title":"Identifier un conflit d'agence","statement":"Un dirigeant propose une acquisition coûteuse qui doublerait la taille du groupe, avec une rentabilité attendue inférieure au coût du capital. Explique le conflit d'agence et deux mécanismes de gouvernance qui peuvent le limiter.","solution":"Conflit : le dirigeant peut préférer la taille (prestige, rémunération liée au CA) à la création de valeur pour l'actionnaire. Mécanismes : (1) conseil avec administrateurs indépendants et comité stratégique qui challenge le projet ; (2) rémunération variable indexée sur la création de valeur (TSR, ROCE) plutôt que sur la taille ; on peut ajouter le marché du contrôle et l'activisme."},{"title":"Qualifier une information","statement":"Le directeur financier apprend que le premier client du groupe (20 % du CA) va résilier son contrat. Rien n'est public. Son ami lui demande s'il doit vendre ses actions. Que doit-il faire ?","solution":"L'information est précise, non publique et de nature à influencer le cours : elle est privilégiée. Le DAF ne doit ni la transmettre ni conseiller (délit d'initié par communication/recommandation). La société doit la publier dès que possible (information permanente), sauf différé légitime et confidentialité assurée."},{"title":"Rédiger un reporting mensuel","statement":"Rédige en 5 lignes le reporting recouvrement du mois : DSO 52 jours (objectif 50, mois précédent 56), encours échu 1,2 M€ dont 300 k€ > 90 jours concentrés sur 2 clients, 4 nouveaux litiges.","solution":"Contexte : périmètre clients France, mois M. Chiffres : DSO 52 j (−4 j vs M−1, +2 j vs objectif) ; encours échu 1,2 M€ ; > 90 j : 300 k€ sur 2 clients ; 4 litiges ouverts. Écarts : l'objectif n'est pas atteint à cause des 2 dossiers > 90 j (sans eux, DSO ≈ 49 j). Actions : mise en demeure proposée sur les 2 dossiers (décision attendue), résolution des 4 litiges avec le service commercial sous 15 jours, maintien de la priorisation TOP 15."}],"notes":""},{"id":"vba","code":"S9","priority":1,"title":"Outils numériques : Excel avancé & VBA","tagline":"Automatiser un classeur : objets, boucles, fonctions, gestion d'erreurs — et savoir quand une formule moderne ou Power Query suffit.","hue":152,"lessons":[{"title":"L'environnement : VBE, modules, enregistreur","html":"<p>VBA (Visual Basic for Applications) est le langage intégré à Excel. On y accède par l'éditeur <strong>VBE<\/strong> (Alt + F11). Le code se range dans des <strong>modules<\/strong> (standard, de feuille, de classeur « ThisWorkbook », de formulaire).<\/p>\n<ul>\n  <li>L'<strong>enregistreur de macros<\/strong> traduit vos actions en code : idéal pour découvrir la syntaxe d'une opération (tri, mise en forme), à nettoyer ensuite (supprimer les Select/Activate inutiles).<\/li>\n  <li>Un classeur contenant des macros doit être enregistré en <strong>.xlsm<\/strong> ; la sécurité des macros peut bloquer l'exécution (fichiers téléchargés).<\/li>\n  <li><strong>Option Explicit<\/strong> en tête de module oblige à déclarer les variables : cela évite 80 % des bugs de faute de frappe.<\/li>\n<\/ul>\n<div class=\"formula\">Option Explicit\n\nSub Bonjour()\n    MsgBox \"Classeur ouvert le \" &amp; Format(Date, \"dd/mm/yyyy\")\nEnd Sub<\/div>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>Sub = procédure qui agit ; Function = renvoie une valeur (utilisable dans une cellule). Option Explicit toujours.<\/p><\/div>"},{"title":"Le modèle objet : Workbook, Worksheet, Range","html":"<p>Tout en VBA passe par une hiérarchie d'objets : Application → Workbooks → Worksheets → Range/Cells. Un objet a des <strong>propriétés<\/strong> (Value, Font.Bold, Interior.Color) et des <strong>méthodes<\/strong> (Copy, Sort, ClearContents).<\/p>\n<div class=\"formula\">Dim ws As Worksheet\nSet ws = ThisWorkbook.Worksheets(\"Balance\")\n\nws.Range(\"A1\").Value = \"Client\"\nws.Cells(2, 3).Value = 1500           ' ligne 2, colonne C\nDim lastRow As Long\nlastRow = ws.Cells(ws.Rows.Count, 1).End(xlUp).Row   ' dernière ligne remplie en colonne A\n\nWith ws.Range(\"A1:F1\")\n    .Font.Bold = True\n    .Interior.Color = RGB(220, 228, 208)\nEnd With<\/div>\n<p>Les <strong>tableaux structurés<\/strong> (ListObject) sont plus robustes que des plages : <code>ws.ListObjects(\"tBalance\").ListRows.Count<\/code>, <code>.ListColumns(\"Montant\").DataBodyRange<\/code>. Toujours qualifier la feuille (ws.Range plutôt que Range) pour éviter d'écrire au mauvais endroit.<\/p>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>Set pour les objets, With…End With pour grouper, End(xlUp) pour trouver la dernière ligne : trois réflexes de base.<\/p><\/div>"},{"title":"Variables, conditions, boucles, fonctions","html":"<p><strong>Types<\/strong> : Long (entiers), Double (décimaux), String, Boolean, Date, Variant (à éviter), objets (Range, Worksheet). <strong>Conditions<\/strong> : If…ElseIf…Else…End If ; Select Case pour plusieurs valeurs.<\/p>\n<div class=\"formula\">Dim i As Long, anciennete As Long\nFor i = 2 To lastRow\n    anciennete = Date - ws.Cells(i, \"D\").Value      ' D = date d'échéance\n    Select Case anciennete\nCase Is &lt;= 0:  ws.Cells(i, \"G\").Value = \"Non échu\"\nCase 1 To 30:   ws.Cells(i, \"G\").Value = \"1-30 j\"\nCase 31 To 90:  ws.Cells(i, \"G\").Value = \"31-90 j\"\nCase Else:      ws.Cells(i, \"G\").Value = \"+90 j\"\n    End Select\nNext i<\/div>\n<p><strong>Boucles<\/strong> : For…Next (nombre connu), For Each (collection : chaque feuille, chaque cellule), Do While / Do Until (condition). <strong>Fonctions personnalisées<\/strong> :<\/p>\n<div class=\"formula\">Function ScoreRelance(montant As Double, jours As Long) As Double\n    ScoreRelance = montant * (1 + jours / 30)\nEnd Function\n' Dans une cellule : =ScoreRelance(E2; F2)<\/div>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>For pour parcourir des lignes, Select Case pour classer, Function pour un calcul réutilisable dans les cellules.<\/p><\/div>"},{"title":"Interaction, erreurs, événements, performance","html":"<p><strong>Dialogue<\/strong> : MsgBox (message, choix Oui/Non), InputBox (saisie), UserForm (formulaire complet). <strong>Erreurs<\/strong> : sans traitement, une erreur arrête la macro ; on encadre les zones à risque.<\/p>\n<div class=\"formula\">Sub Exporter()\n    On Error GoTo Gestion\n    Application.ScreenUpdating = False     ' plus rapide\n    ' ... traitement ...\nSortie:\n    Application.ScreenUpdating = True\n    Exit Sub\nGestion:\n    MsgBox \"Erreur \" &amp; Err.Number &amp; \" : \" &amp; Err.Description\n    Resume Sortie\nEnd Sub<\/div>\n<p><strong>Événements<\/strong> : du code qui se déclenche tout seul. Dans ThisWorkbook : <code>Workbook_Open<\/code> (à l'ouverture) ; dans le module d'une feuille : <code>Worksheet_Change(ByVal Target As Range)<\/code> (à chaque modification — utile pour horodater une saisie de relance).<\/p>\n<p><strong>Performance<\/strong> : désactiver ScreenUpdating et le calcul automatique pendant le traitement, lire une plage dans un tableau (Variant) plutôt que cellule par cellule, éviter Select/Activate.<\/p>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>On Error GoTo + Resume, ScreenUpdating False/True, événements Open et Change : ce qui distingue une macro « qui marche » d'une macro fiable.<\/p><\/div>"},{"title":"Coder ou ne pas coder : formules modernes et Power Query","html":"<p>Avant d'écrire une macro, vérifier si Excel sait déjà le faire :<\/p>\n<dl>\n  <dt>XLOOKUP / RECHERCHEX<\/dt><dd>remplace RECHERCHEV : =RECHERCHEX(clé ; plage_clés ; plage_résultats ; \"non trouvé\"). Pas de numéro de colonne, gestion de l'absence.<\/dd>\n  <dt>FILTER / FILTRE, SORT / TRIER, UNIQUE<\/dt><dd>formules dynamiques : =TRIER(FILTRE(tBalance ; tBalance[Retard]&gt;90) ; 5 ; -1) donne la liste triée des créances > 90 jours, mise à jour automatiquement.<\/dd>\n  <dt>SUMIFS / SOMME.SI.ENS, COUNTIFS<\/dt><dd>totaux par tranche d'ancienneté ou par agent, sans macro.<\/dd>\n  <dt>LET, LAMBDA<\/dt><dd>nommer des étapes intermédiaires, créer ses fonctions sans VBA.<\/dd>\n  <dt>Power Query<\/dt><dd>importer et transformer des données (fusion de fichiers mensuels, nettoyage, jointures) de façon rejouable en un clic : Données → Obtenir des données. Le bon outil pour consolider des exports de l'ERP.<\/dd>\n<\/dl>\n<p>Règle pratique : transformation de données → Power Query ; calcul et restitution → formules dynamiques et tableaux structurés ; actions répétitives (mise en forme, export, envoi, génération de rapport) → VBA.<\/p>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>Un VLOOKUP vers un fichier externe casse ; Power Query + tableau structuré + RECHERCHEX ne cassent pas. C'est la modernisation type d'un classeur de suivi.<\/p><\/div>"},{"title":"Application : générer un TOP 15 automatiquement","html":"<p>Objectif : à l'ouverture du classeur, trier la balance par score décroissant et copier les 15 premières lignes dans la feuille Synthèse, avec horodatage.<\/p>\n<div class=\"formula\">Sub GenererTop15()\n    Dim wsB As Worksheet, wsS As Worksheet\n    Set wsB = ThisWorkbook.Worksheets(\"Balance\")\n    Set wsS = ThisWorkbook.Worksheets(\"Synthèse\")\n\n    Dim lastRow As Long\n    lastRow = wsB.Cells(wsB.Rows.Count, 1).End(xlUp).Row\n    If lastRow &lt; 2 Then Exit Sub\n\n    ' Colonne H = score (montant × facteur d'ancienneté), calculé par formule\n    With wsB.Sort\n.SortFields.Clear\n.SortFields.Add Key:=wsB.Range(\"H2:H\" &amp; lastRow), Order:=xlDescending\n.SetRange wsB.Range(\"A1:H\" &amp; lastRow)\n.Header = xlYes\n.Apply\n    End With\n\n    wsS.Range(\"A3:H100\").ClearContents\n    wsB.Range(\"A2:H\" &amp; Application.Min(16, lastRow)).Copy\n    wsS.Range(\"A3\").PasteSpecial xlPasteValues\n    Application.CutCopyMode = False\n    wsS.Range(\"A1\").Value = \"TOP 15 généré le \" &amp; Format(Now, \"dd/mm/yyyy hh:mm\")\nEnd Sub\n\n' Dans ThisWorkbook :\nPrivate Sub Workbook_Open()\n    GenererTop15\nEnd Sub<\/div>\n<p>Variante sans VBA : dans Synthèse, <code>=PRENDRE(TRIER(tBalance ; 8 ; -1) ; 15)<\/code> donne le même TOP 15, recalculé en permanence.<\/p>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>Une macro utile = trouver la dernière ligne, trier, copier en valeurs, horodater. Sais la lire ligne par ligne, c'est un sujet d'examen classique.<\/p><\/div>"}],"glossary":[{"term":"Macro","def":"Suite d'instructions VBA exécutée par Excel pour automatiser une tâche."},{"term":"VBE","def":"Visual Basic Editor : l'éditeur de code intégré (Alt + F11)."},{"term":"Module","def":"Conteneur de code : module standard, module de feuille, ThisWorkbook, UserForm."},{"term":"Sub / Function","def":"Procédure qui exécute des actions / fonction qui renvoie une valeur (utilisable dans une formule)."},{"term":"Option Explicit","def":"Instruction qui oblige à déclarer toutes les variables ; évite les erreurs de frappe silencieuses."},{"term":"Objet, propriété, méthode","def":"Élément d'Excel (Range, Worksheet) ; caractéristique (Value, Color) ; action (Copy, Sort)."},{"term":"Range / Cells","def":"Plage désignée par adresse (\"A1:C10\") / cellule désignée par ligne et colonne (Cells(2, 3))."},{"term":"ListObject","def":"Tableau structuré Excel manipulable par nom (tBalance), avec colonnes nommées et extension automatique."},{"term":"With … End With","def":"Bloc qui évite de répéter la référence à un objet."},{"term":"For … Next / For Each","def":"Boucle avec compteur / boucle sur chaque élément d'une collection."},{"term":"Select Case","def":"Structure de choix multiple, plus lisible qu'une cascade de If pour classer une valeur."},{"term":"On Error GoTo","def":"Redirection vers un gestionnaire d'erreurs pour éviter l'arrêt brutal d'une macro."},{"term":"Événement","def":"Procédure déclenchée automatiquement par une action : Workbook_Open, Worksheet_Change."},{"term":"ScreenUpdating","def":"Propriété qui désactive le rafraîchissement de l'écran pendant une macro pour accélérer l'exécution."},{"term":"RECHERCHEX (XLOOKUP)","def":"Fonction de recherche moderne remplaçant RECHERCHEV, avec valeur par défaut si non trouvé."},{"term":"Formules dynamiques","def":"FILTRE, TRIER, UNIQUE, PRENDRE… : formules qui renvoient une plage entière et se recalculent seules."},{"term":"Power Query","def":"Outil d'import et de transformation de données rejouable, intégré à Excel (Données → Obtenir des données)."}],"formulas":[{"name":"Dernière ligne remplie","f":"lastRow = ws.Cells(ws.Rows.Count, 1).End(xlUp).Row","note":"Colonne 1 = A ; adapter la colonne de référence."},{"name":"Boucle sur les lignes","f":"For i = 2 To lastRow … Next i","note":"Commencer à 2 pour sauter l'en-tête."},{"name":"Ancienneté d'une créance","f":"anciennete = Date − ws.Cells(i, \"D\").Value","note":"En formule : =AUJOURDHUI()−D2."},{"name":"Classement par tranche","f":"Select Case anciennete : Case Is <= 0 / Case 1 To 30 / Case 31 To 90 / Case Else","note":"Tranches de balance âgée."},{"name":"Tri d'une plage","f":"ws.Sort.SortFields.Add Key:=Range, Order:=xlDescending ; .SetRange ; .Header = xlYes ; .Apply","note":"Clear avant d'ajouter."},{"name":"Copie en valeurs","f":"Source.Copy : Destination.PasteSpecial xlPasteValues : Application.CutCopyMode = False","note":"Évite de coller les formules."},{"name":"Gestion d'erreurs","f":"On Error GoTo Gestion … Exit Sub … Gestion: MsgBox Err.Description : Resume Sortie","note":"Toujours rétablir ScreenUpdating."},{"name":"RECHERCHEX","f":"=RECHERCHEX(clé ; plage_clés ; plage_résultats ; \"non trouvé\")","note":"Remplace RECHERCHEV."},{"name":"Filtrer et trier sans macro","f":"=TRIER(FILTRE(tBalance ; tBalance[Retard]>90) ; 5 ; -1)","note":"5 = index de la colonne de tri, -1 = décroissant."},{"name":"TOP N sans macro","f":"=PRENDRE(TRIER(tBalance ; 8 ; -1) ; 15)","note":"Excel 365."},{"name":"Totaux par tranche","f":"=SOMME.SI.ENS(tBalance[Montant] ; tBalance[Tranche] ; \"+90 j\")","note":"Répartition par antériorité ou par agent."}],"quiz":[{"q":"Quelle est la différence entre Sub et Function ?","options":["Sub est plus rapide","Function renvoie une valeur et peut s'utiliser dans une cellule","Sub ne peut pas contenir de boucle","Il n'y a aucune différence"],"correct":1,"explain":"Une Function renvoie un résultat (=MaFonction(A1)), une Sub exécute des actions."},{"q":"Que fait ws.Cells(ws.Rows.Count, 1).End(xlUp).Row ?","options":["Compte le nombre de feuilles","Renvoie le numéro de la dernière ligne remplie de la colonne A","Supprime la dernière ligne","Trie la colonne A"],"correct":1,"explain":"On part du bas de la colonne et on remonte (xlUp) jusqu'à la première cellule non vide."},{"q":"Option Explicit sert à :","options":["Accélérer les macros","Obliger la déclaration des variables","Afficher les erreurs en anglais","Protéger le classeur"],"correct":1,"explain":"Sans elle, une faute de frappe crée silencieusement une nouvelle variable vide."},{"q":"Pour classer une valeur dans l'une de quatre tranches, la structure la plus lisible est :","options":["Une boucle Do While","Select Case","On Error GoTo","With … End With"],"correct":1,"explain":"Select Case gère des plages de valeurs (Case 1 To 30) de façon claire."},{"q":"Le code de la procédure Workbook_Open se place dans :","options":["Un module standard","ThisWorkbook","Le module de la feuille Synthèse","Un UserForm"],"correct":1,"explain":"Les événements du classeur vivent dans ThisWorkbook ; ceux d'une feuille dans son module."},{"q":"Quel outil est le plus adapté pour fusionner chaque mois 12 exports CSV de l'ERP ?","options":["RECHERCHEV","Power Query","Une mise en forme conditionnelle","MsgBox"],"correct":1,"explain":"Power Query rejoue l'import et la transformation en un clic, sans code."},{"q":"=RECHERCHEX(A2 ; tRef[Client] ; tRef[Niveau] ; \"nouveau\") renvoie \"nouveau\" quand :","options":["Le client existe","Le client est absent de tRef","La formule est incorrecte","Le classeur est fermé"],"correct":1,"explain":"Le 4e argument est la valeur par défaut si la clé n'est pas trouvée."},{"q":"Pourquoi coller en valeurs (xlPasteValues) dans la Synthèse ?","options":["Pour garder les formules vivantes","Pour figer le résultat et éviter les liens cassés","Pour changer la police","Pour supprimer les doublons"],"correct":1,"explain":"La Synthèse doit rester lisible même si la source change ou est absente."}],"exercises":[{"title":"Écrire une boucle de classement","statement":"La colonne E contient les dates d'échéance (lignes 2 à lastRow). Écris le code qui inscrit en colonne F la tranche « Non échu », « 1-30 j », « 31-90 j » ou « +90 j ».","solution":"For i = 2 To lastRow : j = Date − ws.Cells(i, \"E\").Value : Select Case j : Case Is <= 0: ws.Cells(i, \"F\") = \"Non échu\" : Case 1 To 30: ws.Cells(i, \"F\") = \"1-30 j\" : Case 31 To 90: ws.Cells(i, \"F\") = \"31-90 j\" : Case Else: ws.Cells(i, \"F\") = \"+90 j\" : End Select : Next i  (déclarer i et j As Long, ws As Worksheet)."},{"title":"Trouver le bug","statement":"Ce code plante ou donne un mauvais résultat : Sub T() / For i = 1 To lastRow / Cells(i, 3).Value = Cells(i, 2).Value * 1.2 / Next i / End Sub. Trouve au moins trois problèmes.","solution":"(1) i et lastRow ne sont pas déclarés ni calculés (lastRow vaut 0 → boucle vide) ; (2) la boucle commence à 1 et écrase l'en-tête ; (3) Cells n'est pas qualifié par une feuille : la macro écrit dans la feuille active, pas forcément la bonne ; (4) pas d'Option Explicit ; (5) 1.2 en dur : préférer une constante nommée."},{"title":"Remplacer un VLOOKUP externe","statement":"La colonne « Niveau de relance » était alimentée par RECHERCHEV vers le classeur du mois précédent, ce qui cassait le classement quand le fichier était absent. Propose une solution robuste en formule, puis une en Power Query.","solution":"Formule : conserver un onglet « Historique » dans le classeur courant (copié en valeurs à la clôture du mois) et utiliser =RECHERCHEX([@Client] ; tHisto[Client] ; tHisto[Niveau] ; \"nouveau\") — pas de lien externe, valeur par défaut gérée. Power Query : requête qui charge le fichier du mois précédent depuis un dossier fixe, fusionne sur le code client (jointure externe gauche) et charge le résultat dans un tableau ; si le fichier manque, la requête signale l'erreur au lieu de casser silencieusement les formules."}],"notes":""},{"id":"hautbilan","code":"S10","priority":3,"title":"Financement du haut de bilan : droit financier, M&A, titrisation","tagline":"Structure financière, instruments de fonds propres et de dette, opérations de fusion-acquisition, titrisation et affacturage.","hue":40,"lessons":[{"title":"Choisir sa structure financière","html":"<p>Le haut de bilan, ce sont les ressources stables : capitaux propres et dettes financières à moyen-long terme. La question centrale : quelle proportion de dette ?<\/p>\n<ul>\n  <li><strong>Modigliani-Miller<\/strong> (1958) : en marché parfait, la structure financière est neutre. Avec impôt (1963), la dette crée de la valeur grâce à la déductibilité des intérêts (économie d'impôt = t × D).<\/li>\n  <li><strong>Trade-off theory<\/strong> : on arbitre l'avantage fiscal de la dette contre les coûts de faillite et d'agence ; il existe un niveau optimal.<\/li>\n  <li><strong>Pecking order<\/strong> (Myers) : hiérarchie de préférence — autofinancement, puis dette, puis augmentation de capital en dernier (signal négatif).<\/li>\n<\/ul>\n<p>Indicateurs de capacité d'endettement : dette nette ÷ EBITDA (banques : &lt; 3-4x), couverture des intérêts (EBIT ÷ frais financiers &gt; 3), gearing (dette nette ÷ capitaux propres). Les prêteurs imposent des <strong>covenants<\/strong> : ratios à respecter sous peine d'exigibilité anticipée.<\/p>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>MM avec impôt : V(endettée) = V(non endettée) + t × D. Trade-off = optimum ; pecking order = hiérarchie. Sais opposer les deux.<\/p><\/div>"},{"title":"Les instruments de fonds propres et de dette","html":"<p><strong>Augmentation de capital<\/strong> : émission d'actions nouvelles, souvent avec <strong>droit préférentiel de souscription<\/strong> (DPS) pour les actionnaires existants — le DPS compense la dilution et se négocie. Prix d'émission = valeur nominale + prime d'émission.<\/p>\n<p><strong>Émission obligataire<\/strong> : dette de marché, coupon fixe ou variable, remboursement in fine ou amortissable. Le taux = taux sans risque + <strong>spread<\/strong> lié à la notation (agences : S&amp;P, Moody's, Fitch ; « investment grade » à partir de BBB−). Les <strong>obligations convertibles<\/strong> offrent un coupon réduit contre une option de conversion en actions.<\/p>\n<p><strong>Financements hybrides et structurés<\/strong> : dette mezzanine (subordonnée, rémunérée par intérêts + bons de souscription), dette unitranche (une seule tranche senior + junior, fonds de dette privée), prêt participatif. <strong>LBO<\/strong> (leveraged buy-out) : rachat via une holding endettée, la dette étant remboursée par les dividendes de la cible ; leviers financier, fiscal (intégration) et juridique.<\/p>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>Valeur théorique du DPS = (cours − prix d'émission) × n ÷ (N + n). LBO = holding + dette senior/mezzanine + remontée de dividendes.<\/p><\/div>"},{"title":"Droit financier : marchés, offres publiques, abus","html":"<p>L'<strong>AMF<\/strong> (Autorité des marchés financiers) réglemente et surveille les marchés, vise les <strong>prospectus<\/strong> d'émission et sanctionne les abus.<\/p>\n<p><strong>Offres publiques<\/strong> : OPA (paiement en numéraire), OPE (en titres), mixte. Franchir 30 % du capital ou des droits de vote d'une société cotée déclenche une offre obligatoire ; au-delà de 90 %, retrait obligatoire possible. Déclarations de franchissement de seuils (5, 10, 15, 20, 25, 30 %…).<\/p>\n<p><strong>Abus de marché<\/strong> (règlement MAR) : opération d'initié, divulgation illicite d'information privilégiée, manipulation de cours. Sanctions administratives (AMF) et pénales.<\/p>\n<p>Dans les cessions de sociétés non cotées : <strong>garantie d'actif et de passif<\/strong> (le vendeur indemnise l'acheteur pour les passifs antérieurs non révélés), clauses de non-concurrence, pactes d'associés.<\/p>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>30 % = offre obligatoire ; 90 % = retrait ; MAR = trois abus. Garantie d'actif-passif = protection de l'acheteur.<\/p><\/div>"},{"title":"Le processus M&A de A à Z","html":"<p>Une acquisition suit un processus balisé :<\/p>\n<ol>\n  <li><strong>Stratégie et ciblage<\/strong> : pourquoi acheter (croissance, synergies, technologie), liste de cibles, approche.<\/li>\n  <li><strong>NDA et lettre d'intention<\/strong> (LOI) : confidentialité, prix indicatif, exclusivité.<\/li>\n  <li><strong>Due diligence<\/strong> : audits financier, fiscal, juridique, social, IT, ESG ; identification des risques et des ajustements de prix.<\/li>\n  <li><strong>Valorisation et négociation<\/strong> : DCF, multiples, synergies ; passage de la valeur d'entreprise au prix des titres (equity bridge : − dette nette ± ajustement de BFR).<\/li>\n  <li><strong>SPA<\/strong> (share purchase agreement) : prix, mécanisme d'ajustement (<strong>locked box<\/strong> : prix figé à une date passée / <strong>completion accounts<\/strong> : ajusté sur les comptes au closing), <strong>earn-out<\/strong> (complément de prix conditionné aux résultats futurs), garanties, conditions suspensives (autorisation concurrence).<\/li>\n  <li><strong>Closing<\/strong> puis <strong>intégration<\/strong> (PMI) : là où les synergies se réalisent — ou pas.<\/li>\n<\/ol>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>Les synergies annoncées sont actualisées et souvent partagées avec le vendeur via la prime ; l'earn-out réduit le désaccord sur la valeur.<\/p><\/div>"},{"title":"Titrisation et affacturage","html":"<p>La <strong>titrisation<\/strong> transforme des actifs peu liquides (créances commerciales, prêts, loyers) en titres négociables. L'entreprise cède les créances à un véhicule ad hoc (<strong>SPV<\/strong>, en France un fonds commun de titrisation, FCT), qui émet des titres adossés (ABS) découpés en <strong>tranches<\/strong> : senior (remboursée en premier, mieux notée), mezzanine, equity (absorbe les premières pertes). Le <strong>rehaussement de crédit<\/strong> (surdimensionnement, garantie) améliore la notation des tranches seniors. La cession doit être une « true sale » pour sortir les actifs du bilan.<\/p>\n<p>L'<strong>affacturage<\/strong> (factoring) est la version simple pour les créances clients : l'entreprise cède ses factures à un factor qui avance 80-90 % du montant immédiatement, gère le recouvrement (ou non, en affacturage confidentiel) et peut assumer le risque d'impayé (sans recours) ou non (avec recours). Coût : commission d'affacturage (0,2-1,5 % du CA cédé) + commission de financement (taux court terme + marge sur les montants avancés). Le <strong>reverse factoring<\/strong> est déclenché par l'acheteur pour payer plus tôt ses fournisseurs.<\/p>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>Titrisation = SPV + tranches + rehaussement ; affacturage = avance + gestion + éventuellement garantie. Avec ou sans recours change tout pour le risque.<\/p><\/div>"},{"title":"Application : affacturage ou recouvrement interne renforcé ?","html":"<p>Un directeur financier compare deux options pour réduire un DSO de 60 jours sur un CA de 36,5 M€ TTC :<\/p>\n<ul>\n  <li><strong>Affacturage<\/strong> : cession de la totalité du poste clients (6 M€ d'encours), avance de 85 %, commission d'affacturage 0,6 % du CA, commission de financement 4 % sur les montants avancés. Coût annuel ≈ 219 k€ + 204 k€ = 423 k€ ; trésorerie immédiate ≈ 5,1 M€.<\/li>\n  <li><strong>Recouvrement interne<\/strong> : un recrutement (55 k€ chargé), un outil de relance (15 k€/an), objectif DSO 48 jours. Coût 70 k€ ; libération de cash 12 × 100 k€ = 1,2 M€ après quelques mois.<\/li>\n<\/ul>\n<p>Lecture : l'affacturage libère beaucoup plus de cash, tout de suite, mais coûte ~6 fois plus et transfère la relation client ; le recouvrement interne est bien moins cher mais plus lent et plafonné. Le choix dépend de l'urgence de trésorerie, du coût du financement alternatif (découvert, ligne) et de la sensibilité de la relation client. Beaucoup d'entreprises combinent : recouvrement interne structuré + affacturage ponctuel ou confidentiel sur une partie du portefeuille.<\/p>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>Toujours comparer coût annualisé, cash libéré, vitesse et impact client. Un bon recouvrement interne rend l'affacturage moins nécessaire — et moins cher si on y recourt quand même (moins de risque pour le factor).<\/p><\/div>"}],"glossary":[{"term":"Haut de bilan","def":"Ressources stables : capitaux propres et dettes financières à moyen-long terme (par opposition au bas de bilan, cycle d'exploitation)."},{"term":"Trade-off theory","def":"Théorie selon laquelle l'endettement optimal équilibre l'avantage fiscal de la dette et les coûts de détresse financière."},{"term":"Pecking order","def":"Hiérarchie de financement : autofinancement, puis dette, puis émission d'actions."},{"term":"Covenant","def":"Clause d'un contrat de prêt imposant des ratios ou des engagements ; leur non-respect peut rendre la dette exigible."},{"term":"DPS","def":"Droit préférentiel de souscription : droit des actionnaires de souscrire en priorité à une augmentation de capital, négociable."},{"term":"Prime d'émission","def":"Différence entre le prix d'émission d'une action nouvelle et sa valeur nominale."},{"term":"Spread","def":"Écart de taux entre une obligation d'entreprise et le taux sans risque, rémunérant le risque de crédit."},{"term":"Notation (rating)","def":"Évaluation du risque de crédit par une agence ; investment grade à partir de BBB− / Baa3."},{"term":"Mezzanine","def":"Dette subordonnée entre la dette senior et les fonds propres, à rendement élevé, souvent avec bons de souscription."},{"term":"LBO","def":"Leveraged buy-out : rachat d'une société par une holding financée majoritairement par dette, remboursée par les dividendes de la cible."},{"term":"OPA / OPE","def":"Offre publique d'achat (en numéraire) / d'échange (en titres) sur une société cotée."},{"term":"Due diligence","def":"Ensemble d'audits (financier, fiscal, juridique, social…) menés par l'acheteur avant une acquisition."},{"term":"SPA","def":"Share purchase agreement : contrat de cession d'actions fixant prix, ajustements, garanties et conditions."},{"term":"Garantie d'actif et de passif","def":"Engagement du vendeur d'indemniser l'acheteur pour les passifs antérieurs à la cession non révélés."},{"term":"Earn-out","def":"Complément de prix payé au vendeur si des objectifs futurs sont atteints."},{"term":"Locked box / completion accounts","def":"Prix figé sur un bilan de référence passé / prix ajusté sur les comptes établis au closing."},{"term":"Synergie","def":"Gain de valeur attendu du rapprochement (coûts, revenus, financier), à actualiser et à confronter à la prime payée."},{"term":"SPV / FCT","def":"Véhicule ad hoc (fonds commun de titrisation en France) qui achète les créances et émet les titres."},{"term":"Tranche senior / equity","def":"Titres remboursés en premier (moins risqués, mieux notés) / titres absorbant les premières pertes."},{"term":"Rehaussement de crédit","def":"Techniques (surdimensionnement, garantie, réserve) améliorant la qualité de crédit des tranches seniors."},{"term":"Affacturage","def":"Cession des créances clients à un factor contre avance de trésorerie, gestion du recouvrement et éventuellement garantie contre l'impayé."},{"term":"Reverse factoring","def":"Affacturage inversé : l'acheteur met en place un programme permettant à ses fournisseurs d'être payés plus tôt par un financeur."}],"formulas":[{"name":"Modigliani-Miller avec impôt","f":"V(endettée) = V(non endettée) + t × D","note":"t × D = valeur actuelle des économies d'impôt (dette perpétuelle)."},{"name":"Coût de la dette après impôt","f":"kd(net) = kd × (1 − t)","note":"Déductibilité des intérêts."},{"name":"Capacité d'endettement","f":"Dette nette ÷ EBITDA (< 3-4x) ; EBIT ÷ Frais financiers (> 3) ; Gearing = Dette nette ÷ CP","note":"Covenants bancaires usuels."},{"name":"Valeur théorique du DPS","f":"DPS = (Cours − Prix d'émission) × n ÷ (N + n)","note":"N actions anciennes, n actions nouvelles."},{"name":"Cours théorique ex-droit","f":"Cours ex-droit = (N × Cours + n × Prix d'émission) ÷ (N + n)","note":"= Cours − DPS."},{"name":"Taux d'une obligation","f":"Taux = Taux sans risque + Spread(notation)","note":"Le spread croît quand la notation baisse."},{"name":"Levier d'un LBO","f":"Dette ÷ EBITDA (souvent 4-6x) ; TRI sponsor = (Valeur de sortie des titres ÷ Equity investi)^(1/n) − 1","note":"Remboursement par les dividendes de la cible."},{"name":"Equity bridge","f":"Prix des titres = Valeur d'entreprise − Dette nette ± Ajustement de BFR (vs normatif)","note":"Base des négociations de SPA."},{"name":"Valeur des synergies","f":"Valeur créée = VA(synergies) − Prime payée − Coûts d'intégration","note":"Positive = acquisition créatrice de valeur."},{"name":"Coût annualisé de l'affacturage","f":"Coût = Commission d'affacturage × CA cédé + Taux de financement × Montant moyen avancé","note":"À rapporter au cash libéré."},{"name":"Cash libéré par le DSO","f":"Cash = ΔDSO × CA TTC ÷ 365","note":"Alternative interne à l'affacturage."}],"quiz":[{"q":"Selon Modigliani-Miller avec impôt, la dette :","options":["Détruit toujours de la valeur","Crée de la valeur via l'économie d'impôt sur les intérêts","N'a aucun effet","Réduit le résultat d'exploitation"],"correct":1,"explain":"V(endettée) = V(non endettée) + t × D."},{"q":"La pecking order theory place en dernier :","options":["L'autofinancement","La dette bancaire","L'augmentation de capital","Le crédit fournisseur"],"correct":2,"explain":"L'émission d'actions envoie un signal négatif (le dirigeant juge le titre surévalué)."},{"q":"Une société a 1 000 000 d'actions cotées 50 € et émet 250 000 actions à 38 €. Le DPS théorique vaut :","options":["12 €","2,40 €","9,60 €","3 €"],"correct":1,"explain":"(50 − 38) × 250 000 ÷ 1 250 000 = 12 × 0,2 = 2,40 €."},{"q":"Dans un LBO, la dette de la holding est remboursée par :","options":["Les salariés","Les dividendes remontés de la cible","L'État","Les fournisseurs"],"correct":1,"explain":"La capacité de la cible à distribuer du cash est le cœur de l'analyse d'un LBO."},{"q":"Le franchissement de quel seuil déclenche une offre publique obligatoire en France ?","options":["10 %","30 %","50 %","90 %"],"correct":1,"explain":"30 % du capital ou des droits de vote ; 90 % permet le retrait obligatoire."},{"q":"Un earn-out est :","options":["Une garantie de passif","Un complément de prix conditionné aux résultats futurs","Une prime de contrôle","Une clause de non-concurrence"],"correct":1,"explain":"Il réconcilie vendeur et acheteur sur une valeur incertaine."},{"q":"Dans une titrisation, la tranche qui absorbe les premières pertes est :","options":["La tranche senior","La tranche mezzanine","La tranche equity","La tranche garantie"],"correct":2,"explain":"Elle est la moins bien notée et la mieux rémunérée ; la senior est remboursée en premier."},{"q":"L'affacturage « sans recours » signifie que :","options":["Le factor n'avance pas de fonds","Le factor supporte le risque d'impayé","L'entreprise garde le risque d'impayé","Le client n'est pas informé"],"correct":1,"explain":"Avec recours, l'entreprise rembourse le factor si le client ne paie pas ; sans recours, le factor assume la perte."}],"exercises":[{"title":"Augmentation de capital et DPS","statement":"Capital : 2 000 000 actions à 30 €. Émission de 500 000 actions à 24 €. Calcule le DPS théorique, le cours ex-droit et vérifie qu'un actionnaire qui vend ses droits n'est pas lésé.","solution":"DPS = (30 − 24) × 500 000 ÷ 2 500 000 = 1,20 €. Cours ex-droit = (2 000 000 × 30 + 500 000 × 24) ÷ 2 500 000 = 28,80 € (= 30 − 1,20). Un actionnaire avec 4 actions (120 €) vend 4 DPS (4,80 €) et garde 4 actions à 28,80 (115,20 €) : total 120 €, pas de perte."},{"title":"Equity bridge","statement":"Valeur d'entreprise négociée : 50 M€. Dettes financières 18 M€, trésorerie 3 M€, BFR au closing 9 M€ contre un BFR normatif de 7 M€. Quel prix pour les titres ?","solution":"Dette nette = 18 − 3 = 15 M€. Excédent de BFR = 9 − 7 = +2 M€ (le vendeur a laissé plus de BFR que la norme, le prix augmente). Prix = 50 − 15 + 2 = 37 M€."},{"title":"Coût de l'affacturage","statement":"CA cédé 24 M€/an, encours moyen 4 M€, avance 85 %, commission d'affacturage 0,5 %, commission de financement 5 %. Calcule le coût annuel et le taux effectif rapporté au cash avancé.","solution":"Commission d'affacturage = 24 M × 0,5 % = 120 k€. Montant avancé = 4 M × 85 % = 3,4 M€ ; financement = 3,4 M × 5 % = 170 k€. Coût total = 290 k€. Taux effectif = 290 ÷ 3 400 = 8,5 % du cash avancé — à comparer au coût d'un découvert ou d'une ligne court terme."}],"notes":""},{"id":"tresorerie","code":"S10","priority":1,"title":"Trésorerie et gestion des flux sous ERP","tagline":"Prévoir, financer, placer, sécuriser et piloter la trésorerie — avec le lien direct entre relance client et cash du groupe.","hue":186,"lessons":[{"title":"Budget de trésorerie et plan glissant","html":"<p>Le <strong>budget de trésorerie<\/strong> prévoit, mois par mois sur l'année, les encaissements (ventes TTC selon les délais clients, subventions, cessions, emprunts) et les décaissements (achats TTC selon les délais fournisseurs, salaires, charges sociales, TVA, impôts, investissements, remboursements). Il se construit à partir des budgets d'exploitation, d'investissement et de financement, en tenant compte des <strong>décalages<\/strong> : une vente de janvier à 60 jours est encaissée en mars.<\/p>\n<p>Le <strong>plan de trésorerie glissant<\/strong> (rolling forecast, souvent 13 semaines) est révisé chaque semaine ou chaque mois : il absorbe l'incertitude réelle des encaissements et permet d'anticiper les tensions.<\/p>\n<div class=\"formula\">Solde fin de période = Solde début + Encaissements − Décaissements\nTVA à décaisser (mois M) = TVA collectée (M−1) − TVA déductible (M−1)<\/div>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>Le budget raisonne en TTC et en date d'encaissement, pas en HT et en date de facture. C'est le piège classique.<\/p><\/div>"},{"title":"Le besoin en fonds de roulement et le cycle cash-to-cash","html":"<p>Le BFR d'exploitation est le cash immobilisé par le cycle d'activité :<\/p>\n<div class=\"formula\">BFR = Stocks + Créances clients − Dettes fournisseurs (et autres dettes d'exploitation)\nBFR en jours de CA = BFR ÷ CA HT × 360<\/div>\n<p>Le <strong>cycle cash-to-cash<\/strong> (ou cash conversion cycle) mesure en jours le temps entre le paiement des fournisseurs et l'encaissement des clients :<\/p>\n<div class=\"formula\">CCC = DIO (stocks) + DSO (clients) − DPO (fournisseurs)<\/div>\n<p>Leviers d'optimisation : réduire le DSO (conditions de paiement, facturation rapide, relance structurée, acomptes), réduire le DIO (gestion des stocks), allonger le DPO sans dégrader la relation fournisseur (dans la limite de la loi LME : 60 jours date de facture ou 45 jours fin de mois). Un BFR négatif (grande distribution) finance l'entreprise.<\/p>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>ΔBFR ≈ CA journalier × ΔDSO : un jour de DSO en moins, c'est un jour de CA de cash libéré. C'est LE calcul à maîtriser.<\/p><\/div>"},{"title":"Financer les déficits, placer les excédents","html":"<p><strong>Déficits court terme<\/strong> : facilité de caisse (quelques jours), découvert autorisé (montant et durée négociés, agios = montant × taux × jours ÷ 360 + commissions), escompte d'effets de commerce, cession Dailly (créances professionnelles), affacturage, billets de trésorerie (grandes entreprises). Un besoin <em>structurel<\/em> (BFR permanent) doit être financé par des ressources stables, pas par du découvert.<\/p>\n<p><strong>Excédents<\/strong> : critères dans l'ordre sécurité, liquidité, rendement. Supports : comptes rémunérés, dépôts à terme, OPCVM monétaires, certificats de dépôt. Éviter d'immobiliser un excédent qui sera nécessaire au prochain pic de décaissements (paie, TVA, échéance d'emprunt).<\/p>\n<p><strong>Dates de valeur et jours de banque<\/strong> : la banque crédite/débite avec un décalage ; connaître ces conventions évite des agios inutiles. La <strong>négociation bancaire<\/strong> porte sur les taux, les commissions (mouvement, plus fort découvert) et les dates de valeur.<\/p>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>Agios = montant × taux × jours ÷ 360. Découvert = besoin ponctuel ; ligne moyen terme ou fonds propres = besoin structurel.<\/p><\/div>"},{"title":"Sécuriser : risques de taux, de change, de contrepartie","html":"<p>Le trésorier gère aussi les risques de marché sur ses flux :<\/p>\n<ul>\n  <li><strong>Change<\/strong> : position par devise et échéance, couverture par ventes/achats à terme ou options ; facturation en euros ou clauses d'indexation quand c'est possible.<\/li>\n  <li><strong>Taux<\/strong> : sur une dette à taux variable, plafonner par un cap ou fixer par un swap ; sur les placements, éviter le risque de perte en capital.<\/li>\n  <li><strong>Contrepartie bancaire<\/strong> : diversifier les banques, suivre leur notation, limiter les dépôts par établissement.<\/li>\n<\/ul>\n<p>Le tout dans un cadre de <strong>contrôle interne<\/strong> : pouvoirs bancaires limités, double signature, séparation entre celui qui initie un virement et celui qui le valide, protection contre la fraude au président et au faux fournisseur (procédure de vérification des changements de RIB).<\/p>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>Les fraudes aux virements sont le premier risque opérationnel d'une trésorerie : double validation et vérification des RIB par un canal indépendant.<\/p><\/div>"},{"title":"Le rôle de l'ERP et des outils de trésorerie","html":"<p>Trois apports concrets des systèmes d'information :<\/p>\n<dl>\n  <dt>Rapprochement bancaire automatisé<\/dt><dd>les relevés (protocoles EBICS, SWIFT, formats CAMT/MT940) sont importés et lettrés automatiquement avec les écritures ; les exceptions sont traitées manuellement.<\/dd>\n  <dt>Cash pooling<\/dt><dd>centralisation des soldes des filiales sur un compte pivot : physique (virements réels quotidiens, « zero balancing ») ou notionnel (compensation des intérêts sans mouvement de fonds). Réduit les frais financiers et optimise le placement du solde net du groupe.<\/dd>\n  <dt>Prévision alimentée par les modules<\/dt><dd>ventes/facturation (échéances clients), achats (échéances fournisseurs), paie, immobilisations : la prévision de trésorerie devient un flux continu au lieu d'une reconstruction manuelle. Les TMS (treasury management systems) ajoutent la gestion des dérivés, des emprunts et du reporting.<\/dd>\n<\/dl>\n<p>Le <strong>netting<\/strong> intra-groupe compense les créances et dettes entre filiales pour réduire le nombre et le coût des flux.<\/p>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>Cash pooling physique vs notionnel, rapprochement automatique, netting : trois mots-clés d'examen sur l'ERP en trésorerie.<\/p><\/div>"},{"title":"Piloter : reporting et indicateurs de trésorerie","html":"<p>Un reporting de trésorerie efficace tient sur une page : position du jour (soldes par banque, lignes disponibles), prévision à 13 semaines avec écarts vs prévision précédente, indicateurs de BFR (DSO, DPO, DIO, CCC), coût de la dette et des couvertures, alertes (covenants, pics à venir).<\/p>\n<p>Les indicateurs sont lus en tendance et expliqués par leurs causes : un DSO qui monte vient-il de nouveaux clients aux délais longs, de litiges, d'une relance insuffisante, ou d'un effet de saisonnalité du CA ? Le taux de recouvrement (encaissé ÷ échu du mois) et l'ancienneté moyenne pondérée complètent le DSO.<\/p>\n<div class=\"formula\">Taux de recouvrement = Encaissements du mois ÷ Encours échu en début de mois\nEncaissement prévisionnel pondéré = Σ (Créance × Probabilité de règlement dans l'horizon)<\/div>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>Un bon reporting explique l'écart entre prévu et réalisé ; c'est là que se joue la crédibilité du trésorier.<\/p><\/div>"},{"title":"Application : du recouvrement à la prévision de trésorerie","html":"<p>Chaque ligne d'une balance âgée est, vue de la trésorerie, un encaissement futur incertain, avec une probabilité de règlement qui décroît avec l'ancienneté. Une prévision réaliste pondère chaque créance par cette probabilité, tranche par tranche, à partir des taux historiques de recouvrement.<\/p>\n<p>Améliorer la priorisation des relances (viser les dossiers à plus fort montant × probabilité de récupération) réduit le DSO, donc le BFR, donc le besoin de financement court terme et son coût. Exemple : CA TTC 36,5 M€, DSO de 58 à 52 jours → 6 × 100 k€ = 600 k€ libérés ; à 5 % de coût de découvert, 30 k€ d'agios économisés par an, sans compter la baisse des provisions.<\/p>\n<p>Le chaînage complet : qualité de facturation → relance structurée → DSO → BFR → trésorerie → coût de financement → résultat. Le recouvrement n'est pas une fonction administrative : c'est le premier fournisseur de cash de l'entreprise.<\/p>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>Sais chiffrer en trois lignes l'effet d'une baisse de DSO sur le cash et sur les agios : c'est l'argument qui justifie un investissement dans le recouvrement.<\/p><\/div>"}],"glossary":[{"term":"Budget de trésorerie","def":"Prévision mensuelle des encaissements et décaissements sur l'année, en TTC et en dates de flux."},{"term":"Plan de trésorerie glissant","def":"Prévision révisée en continu (souvent 13 semaines) pour anticiper les tensions."},{"term":"BFR","def":"Besoin en fonds de roulement : cash immobilisé par le cycle d'exploitation (stocks + créances − dettes d'exploitation)."},{"term":"DSO / DPO / DIO","def":"Délais moyens de recouvrement clients, de paiement fournisseurs, de rotation des stocks."},{"term":"Cycle cash-to-cash (CCC)","def":"DIO + DSO − DPO : jours entre le paiement des fournisseurs et l'encaissement des clients."},{"term":"Trésorerie nette","def":"Disponibilités et placements − concours bancaires courants ; égale à FR − BFR."},{"term":"Découvert autorisé","def":"Autorisation bancaire de solde débiteur dans une limite de montant et de durée, rémunérée par des agios."},{"term":"Facilité de caisse","def":"Découvert de très courte durée (quelques jours par mois) pour absorber des décalages ponctuels."},{"term":"Escompte / Dailly","def":"Mobilisation de créances : cession d'effets de commerce / cession de créances professionnelles à la banque."},{"term":"Agios","def":"Intérêts et commissions facturés sur un découvert : montant × taux × jours ÷ 360 + commissions."},{"term":"Dates de valeur","def":"Dates auxquelles la banque prend en compte une opération pour le calcul des intérêts, différentes de la date d'opération."},{"term":"Cash pooling","def":"Centralisation des soldes des entités d'un groupe : physique (virements réels) ou notionnel (compensation des intérêts)."},{"term":"Netting","def":"Compensation des créances et dettes réciproques entre filiales pour réduire les flux."},{"term":"Rapprochement bancaire","def":"Lettrage des écritures comptables avec les lignes du relevé bancaire, automatisable via l'ERP."},{"term":"EBICS / SWIFT","def":"Protocoles d'échange sécurisé de fichiers (relevés, ordres) entre l'entreprise et ses banques."},{"term":"TMS","def":"Treasury management system : logiciel spécialisé de gestion de trésorerie (positions, prévisions, dérivés, dettes)."},{"term":"Cap de taux","def":"Option qui plafonne le taux d'une dette variable contre paiement d'une prime."},{"term":"Fraude au président / au RIB","def":"Escroquerie par usurpation d'identité pour obtenir un virement ou un changement de coordonnées bancaires."},{"term":"Taux de recouvrement","def":"Encaissements du mois ÷ encours échu en début de mois."}],"formulas":[{"name":"Solde prévisionnel","f":"Solde fin = Solde début + Encaissements − Décaissements","note":"En TTC et en date de flux."},{"name":"TVA à décaisser","f":"TVA due (M) = TVA collectée (M−1) − TVA déductible (M−1)","note":"Régime réel normal, débits ou encaissements selon l'activité."},{"name":"BFR","f":"BFR = Stocks + Créances clients − Dettes fournisseurs","note":"Compléter avec autres créances/dettes d'exploitation."},{"name":"BFR en jours de CA","f":"BFR (jours) = BFR ÷ CA HT × 360","note":"Permet la comparaison sectorielle."},{"name":"Trésorerie nette","f":"TN = FR − BFR","note":"Négative = découvert structurel."},{"name":"Cycle cash-to-cash","f":"CCC = DIO + DSO − DPO","note":"Plus court = moins de cash immobilisé."},{"name":"Impact du DSO sur le BFR","f":"ΔBFR ≈ CA TTC journalier × ΔDSO","note":"CA journalier = CA TTC ÷ 365."},{"name":"Agios de découvert","f":"Agios = Montant × Taux × Jours ÷ 360 (+ commission de plus fort découvert)","note":"Année bancaire de 360 jours."},{"name":"Coût d'un jour de DSO","f":"Coût annuel = CA journalier × Taux de financement","note":"Ex. 100 k€ × 5 % = 5 k€ par jour de DSO."},{"name":"Taux de recouvrement","f":"Taux = Encaissements du mois ÷ Encours échu début de mois","note":"Complète le DSO."},{"name":"Encaissement pondéré","f":"Prévision = Σ (Créance × Probabilité de règlement par tranche)","note":"Probabilités issues de l'historique."}],"quiz":[{"q":"Dans un budget de trésorerie, une vente HT de 10 000 € facturée en janvier à 60 jours (TVA 20 %) apparaît :","options":["10 000 € en janvier","12 000 € en janvier","12 000 € en mars","10 000 € en mars"],"correct":2,"explain":"On raisonne en TTC (12 000 €) et à la date d'encaissement (janvier + 60 jours = mars)."},{"q":"Le BFR se calcule comme :","options":["Stocks + Créances clients − Dettes fournisseurs","Actif total − Passif total","Créances clients − Dettes clients","Chiffre d'affaires − Charges"],"correct":0,"explain":"Formule classique du besoin en fonds de roulement d'exploitation."},{"q":"DIO 40 j, DSO 55 j, DPO 50 j. Le cycle cash-to-cash est de :","options":["145 jours","45 jours","65 jours","35 jours"],"correct":1,"explain":"40 + 55 − 50 = 45 jours."},{"q":"Découvert de 200 000 € pendant 45 jours à 6 %. Les agios s'élèvent à :","options":["12 000 €","1 500 €","1 479 €","9 000 €"],"correct":1,"explain":"200 000 × 6 % × 45 ÷ 360 = 1 500 €."},{"q":"Le cash pooling notionnel :","options":["Transfère physiquement les fonds chaque jour","Compense les intérêts sans mouvement de fonds","Remplace le rapprochement bancaire","Est réservé aux PME"],"correct":1,"explain":"Les soldes restent sur chaque compte ; la banque calcule les intérêts sur la position nette."},{"q":"Pour placer un excédent à très court terme, le critère prioritaire est :","options":["Le rendement avant tout","La sécurité et la liquidité avant le rendement","La durée la plus longue possible","Le montant minimum"],"correct":1,"explain":"Le placement doit être disponible pour le prochain pic de décaissements."},{"q":"La meilleure protection contre la fraude au changement de RIB fournisseur est :","options":["Payer plus vite","Vérifier le changement par un canal indépendant (appel à un contact connu) et double validation","Ne plus payer par virement","Faire confiance à l'email"],"correct":1,"explain":"Le contrôle interne des paiements repose sur la vérification indépendante et la séparation initiation/validation."},{"q":"Dans une prévision d'encaissement construite à partir d'une balance âgée, chaque créance est pondérée par :","options":["Son montant uniquement","Une probabilité de règlement qui décroît avec l'ancienneté","La devise de facturation","Le nombre de relances, indépendamment du montant"],"correct":1,"explain":"Prévision = Σ créance × probabilité par tranche, à partir des taux historiques."}],"exercises":[{"title":"Budget de trésorerie sur trois mois","statement":"Solde au 1er janvier : 50 000 €. Ventes HT : déc. 150 000, janv. 180 000, fév. 160 000, mars 200 000, encaissées à 30 jours (TVA 20 %). Décaissements TTC : janv. 170 000, fév. 175 000, mars 150 000 (hors TVA à décaisser, négligée ici). Calcule les soldes fin janvier, février, mars.","solution":"Encaissements : janvier = ventes de décembre TTC = 180 000 ; février = 216 000 ; mars = 192 000. Fin janvier = 50 000 + 180 000 − 170 000 = 60 000. Fin février = 60 000 + 216 000 − 175 000 = 101 000. Fin mars = 101 000 + 192 000 − 150 000 = 143 000 €."},{"title":"Impact du DSO sur le BFR et les agios","statement":"CA TTC 7 300 000 € (20 000 €/jour). Le DSO passe de 55 à 47 jours. Découvert moyen financé à 5 %. Quel effet sur le BFR et sur les agios annuels ?","solution":"ΔDSO = −8 jours. ΔBFR ≈ 20 000 × (−8) = −160 000 € de cash libéré. Agios économisés = 160 000 × 5 % = 8 000 € par an — et un DSO plus bas réduit aussi les provisions IFRS 9."},{"title":"Cycle cash-to-cash et BFR en jours","statement":"Stocks 300 k€ (coût des ventes 2 700 k€/an), créances 900 k€ (CA TTC 7 300 k€), dettes fournisseurs 500 k€ (achats TTC 3 650 k€). Calcule DIO, DSO, DPO, le CCC et le BFR en jours de CA HT (CA HT 6 083 k€).","solution":"DIO = 300 ÷ 2 700 × 365 = 40,6 j. DSO = 900 ÷ 7 300 × 365 = 45 j. DPO = 500 ÷ 3 650 × 365 = 50 j. CCC = 40,6 + 45 − 50 = 35,6 j. BFR = 300 + 900 − 500 = 700 k€, soit 700 ÷ 6 083 × 360 = 41 jours de CA HT."},{"title":"Prévision d'encaissement pondérée","statement":"Balance âgée : non échu 400 k€ (probabilité de règlement à 60 j : 95 %), 1-30 j 120 k€ (80 %), 31-90 j 60 k€ (50 %), +90 j 30 k€ (20 %). Calcule l'encaissement prévisionnel à 60 jours et compare à l'encours.","solution":"400 × 0,95 + 120 × 0,8 + 60 × 0,5 + 30 × 0,2 = 380 + 96 + 30 + 6 = 512 k€, soit 84 % d'un encours de 610 k€. Les 98 k€ restants sont l'enjeu de la relance."}],"notes":""},{"id":"recherche","code":"S10","priority":3,"title":"Outils de recherche : économétrie & théorie financière","tagline":"Statistiques, régression, séries temporelles, portefeuille et MEDAF, efficience des marchés — et comment tester une hypothèse sur tes propres données.","hue":236,"lessons":[{"title":"Statistiques descriptives et lois usuelles","html":"<p>Avant toute modélisation, décrire : la <strong>moyenne<\/strong> (tendance centrale), la <strong>variance<\/strong> et l'<strong>écart-type<\/strong> (dispersion), la <strong>covariance<\/strong> et le <strong>coefficient de corrélation<\/strong> ρ (liaison linéaire entre deux variables, entre −1 et +1).<\/p>\n<div class=\"formula\">Moyenne x̄ = Σxᵢ ÷ n\nVariance s² = Σ(xᵢ − x̄)² ÷ (n − 1)      Écart-type s = √s²\nCov(x,y) = Σ(xᵢ − x̄)(yᵢ − ȳ) ÷ (n − 1)      ρ = Cov(x,y) ÷ (sₓ · sᵧ)<\/div>\n<p>La <strong>loi normale<\/strong> N(μ, σ) est centrale en finance : 68 % des observations à ±1σ, 95 % à ±1,96σ, 99 % à ±2,58σ. Un <strong>intervalle de confiance<\/strong> à 95 % pour une moyenne : x̄ ± 1,96 × s ÷ √n. Corrélation n'est pas causalité : deux séries peuvent monter ensemble sans lien de cause.<\/p>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>ρ mesure une liaison linéaire ; ρ = 0 n'exclut pas une relation non linéaire. 1,96 est le nombre magique du 95 %.<\/p><\/div>"},{"title":"La régression linéaire par les MCO","html":"<p>Le modèle : y = α + βx + ε. Les <strong>moindres carrés ordinaires<\/strong> (MCO) choisissent α et β pour minimiser la somme des carrés des résidus.<\/p>\n<div class=\"formula\">β̂ = Cov(x,y) ÷ Var(x)        α̂ = ȳ − β̂ x̄\nR² = 1 − SCR ÷ SCT   (part de la variance de y expliquée par x)\nt = β̂ ÷ se(β̂) ; |t| > 1,96 ⇒ β significatif à 5 %  (p-value < 0,05)<\/div>\n<p>Interprétation : β est l'effet sur y d'une hausse d'une unité de x, toutes choses égales par ailleurs (en régression multiple). Hypothèses de Gauss-Markov pour que les MCO soient les meilleurs estimateurs linéaires sans biais : linéarité, résidus d'espérance nulle et de variance constante (<strong>homoscédasticité<\/strong>), non corrélés (<strong>pas d'autocorrélation<\/strong>), variables explicatives non corrélées au résidu (<strong>exogénéité<\/strong>) et non colinéaires.<\/p>\n<p>Problèmes fréquents et remèdes : hétéroscédasticité (écarts-types robustes), autocorrélation (Durbin-Watson, termes retardés), multicolinéarité (VIF, retirer une variable), endogénéité (variables instrumentales), variables omises (biais).<\/p>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>Un coefficient se lit avec son signe, sa taille et sa significativité (t, p-value). R² élevé ≠ modèle causal.<\/p><\/div>"},{"title":"Séries temporelles : notions essentielles","html":"<p>Une série financière (cours, CA mensuel, encours clients) a souvent une <strong>tendance<\/strong>, une <strong>saisonnalité<\/strong> et une composante aléatoire. Régresser deux séries tendancielles l'une sur l'autre donne des corrélations trompeuses (« régression fallacieuse »).<\/p>\n<p>Une série est <strong>stationnaire<\/strong> si sa moyenne et sa variance ne dépendent pas du temps ; on teste la présence d'une racine unitaire (test de Dickey-Fuller augmenté). Si la série n'est pas stationnaire, on travaille sur les différences (rendements plutôt que cours) ou on cherche une relation de cointégration.<\/p>\n<p>Modèles usuels : moyenne mobile et lissage exponentiel pour prévoir, AR(p) (la valeur dépend de ses p valeurs passées), MA(q), ARIMA(p,d,q). Pour la volatilité des rendements : modèles ARCH/GARCH (la variance dépend des chocs passés — les crises se regroupent).<\/p>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>Stationnariser avant de modéliser ; rendements plutôt que niveaux ; GARCH pour la volatilité. Sais ce que teste Dickey-Fuller.<\/p><\/div>"},{"title":"Théorie du portefeuille et MEDAF","html":"<p><strong>Markowitz<\/strong> (1952) : un investisseur arbitre rendement espéré et risque (écart-type). La diversification réduit le risque d'un portefeuille tant que les actifs ne sont pas parfaitement corrélés ; la <strong>frontière efficiente<\/strong> regroupe les portefeuilles offrant le meilleur rendement pour chaque niveau de risque.<\/p>\n<div class=\"formula\">Portefeuille de 2 actifs : E(Rp) = w₁E(R₁) + w₂E(R₂)\nσp² = w₁²σ₁² + w₂²σ₂² + 2w₁w₂ρσ₁σ₂<\/div>\n<p>Le <strong>MEDAF<\/strong> (CAPM, Sharpe 1964) ajoute l'actif sans risque : seul le risque <strong>systématique<\/strong> (non diversifiable, mesuré par le <strong>bêta<\/strong>) est rémunéré. Le bêta mesure la sensibilité du titre au marché (β &gt; 1 : amplifie ; β &lt; 1 : amortit).<\/p>\n<div class=\"formula\">E(Rᵢ) = r_f + βᵢ × [E(R_m) − r_f]        βᵢ = Cov(Rᵢ, R_m) ÷ Var(R_m)\nRatio de Sharpe = (Rp − r_f) ÷ σp<\/div>\n<p>Le MEDAF fournit le coût des fonds propres (ke) utilisé dans le WACC. Limites : bêta instable, prime de risque à estimer, facteurs additionnels (taille, value, momentum — modèles de Fama-French).<\/p>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>Diversification = élimine le risque spécifique ; bêta = risque systématique ; MEDAF = prix de ce risque. Sais calculer un bêta à partir d'une covariance.<\/p><\/div>"},{"title":"Efficience des marchés, structure financière, comportements","html":"<p>L'<strong>hypothèse d'efficience<\/strong> (Fama, 1970) : les prix intègrent l'information disponible. Trois formes : <strong>faible<\/strong> (prix passés — l'analyse technique est inutile), <strong>semi-forte<\/strong> (toute information publique — l'analyse fondamentale ne bat pas le marché), <strong>forte<\/strong> (même l'information privée — contredite par les gains d'initiés).<\/p>\n<p><strong>Modigliani-Miller<\/strong> : sans impôt ni frictions, la structure financière et la politique de dividende sont neutres ; avec impôt, la dette crée de la valeur. <strong>Théorie de l'agence<\/strong> appliquée à la finance : la dette discipline les dirigeants (flux disponibles réduits), les dividendes signalent la confiance.<\/p>\n<p>La <strong>finance comportementale<\/strong> (Kahneman, Thaler) documente les écarts à la rationalité : excès de confiance, aversion aux pertes (on ressent une perte deux fois plus qu'un gain), ancrage, comportement moutonnier, biais de disposition (vendre les gagnants trop tôt, garder les perdants). Ces biais expliquent bulles et sur-réactions.<\/p>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>Trois formes d'efficience, MM sans/avec impôt, cinq biais comportementaux : le kit de la question de cours.<\/p><\/div>"},{"title":"Application : tester l'effet d'une politique de relance","html":"<p>Question de recherche : « une relance structurée réduit-elle le délai de paiement ? » Protocole possible sur des données de balance âgée anonymisées :<\/p>\n<ol>\n  <li><strong>Variable expliquée<\/strong> : délai de paiement observé (jours entre échéance et règlement) par facture.<\/li>\n  <li><strong>Variables explicatives<\/strong> : nombre de relances reçues, montant de la facture, taille du client, secteur, ancienneté de la relation, mois (saisonnalité), variable indicatrice « après mise en place du TOP 15 ».<\/li>\n  <li><strong>Modèle<\/strong> : régression multiple par MCO ; lire le signe et la significativité du coefficient « après TOP 15 » et de « nombre de relances ». Alternative : comparaison avant/après (test de Student sur les moyennes) ou différence de différences si un groupe de clients n'a pas été relancé.<\/li>\n  <li><strong>Vigilance<\/strong> : endogénéité (on relance davantage les mauvais payeurs — le coefficient des relances peut sortir positif !), hétéroscédasticité (écarts-types robustes), variables omises (litiges).<\/li>\n<\/ol>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>L'endogénéité est le piège : la relance cible ceux qui paient mal. Le comparer « avant/après » ou avec un groupe témoin est plus convaincant qu'une simple corrélation.<\/p><\/div>"}],"glossary":[{"term":"Variance / écart-type","def":"Mesures de dispersion autour de la moyenne ; l'écart-type est la racine de la variance, dans l'unité de la variable."},{"term":"Covariance / corrélation","def":"Co-variation de deux variables ; la corrélation ρ la normalise entre −1 et +1."},{"term":"Intervalle de confiance","def":"Fourchette qui contient le vrai paramètre avec une probabilité donnée (95 % : ± 1,96 écart-type de l'estimateur)."},{"term":"MCO","def":"Moindres carrés ordinaires : méthode d'estimation qui minimise la somme des carrés des résidus."},{"term":"R²","def":"Part de la variance de la variable expliquée restituée par le modèle (entre 0 et 1)."},{"term":"t de Student / p-value","def":"Statistique de test d'un coefficient / probabilité d'observer une telle valeur si le vrai coefficient est nul ; p < 0,05 = significatif."},{"term":"Hétéroscédasticité","def":"Variance des résidus non constante ; biaise les écarts-types, pas les coefficients."},{"term":"Autocorrélation","def":"Corrélation des résidus entre eux (séries temporelles) ; test de Durbin-Watson."},{"term":"Multicolinéarité","def":"Variables explicatives fortement corrélées entre elles ; rend les coefficients instables (VIF)."},{"term":"Endogénéité","def":"Corrélation entre une variable explicative et le résidu (causalité inverse, variable omise) ; biaise les MCO."},{"term":"Stationnarité","def":"Propriété d'une série dont moyenne et variance sont constantes dans le temps ; testée par Dickey-Fuller."},{"term":"ARIMA / GARCH","def":"Modèles de séries temporelles pour le niveau (ARIMA) et pour la volatilité (GARCH)."},{"term":"Frontière efficiente","def":"Ensemble des portefeuilles offrant le rendement maximal pour chaque niveau de risque."},{"term":"Risque systématique / spécifique","def":"Risque lié au marché, non diversifiable (bêta) / risque propre au titre, éliminé par la diversification."},{"term":"Bêta","def":"Sensibilité du rendement d'un titre au rendement du marché : Cov(Rᵢ,Rₘ) ÷ Var(Rₘ)."},{"term":"Prime de risque de marché","def":"E(Rₘ) − r_f : rendement excédentaire attendu du marché sur l'actif sans risque."},{"term":"Ratio de Sharpe","def":"Rendement excédentaire par unité de risque : (Rp − r_f) ÷ σp."},{"term":"Efficience (3 formes)","def":"Faible (prix passés), semi-forte (information publique), forte (toute information)."},{"term":"Aversion aux pertes","def":"Biais comportemental : une perte est ressentie environ deux fois plus qu'un gain équivalent."}],"formulas":[{"name":"Moyenne, variance, écart-type","f":"x̄ = Σxᵢ ÷ n ; s² = Σ(xᵢ − x̄)² ÷ (n − 1) ; s = √s²","note":"n − 1 pour un échantillon."},{"name":"Covariance et corrélation","f":"Cov(x,y) = Σ(xᵢ − x̄)(yᵢ − ȳ) ÷ (n − 1) ; ρ = Cov(x,y) ÷ (sₓ sᵧ)","note":"ρ ∈ [−1 ; 1]."},{"name":"Intervalle de confiance (95 %)","f":"x̄ ± 1,96 × s ÷ √n","note":"1,645 pour 90 %, 2,58 pour 99 %."},{"name":"Régression simple (MCO)","f":"y = α + βx + ε ; β̂ = Cov(x,y) ÷ Var(x) ; α̂ = ȳ − β̂x̄","note":"β = effet marginal de x sur y."},{"name":"Qualité d'ajustement","f":"R² = 1 − SCR ÷ SCT = SCE ÷ SCT","note":"R² ajusté pénalise le nombre de variables."},{"name":"Test de significativité","f":"t = β̂ ÷ se(β̂) ; |t| > 1,96 ⇔ p < 0,05","note":"Grand échantillon."},{"name":"Rendement d'un titre","f":"R = (P₁ − P₀ + D) ÷ P₀ ; rendement log = ln(P₁ ÷ P₀)","note":"Travailler sur les rendements, pas les cours."},{"name":"Portefeuille de deux actifs","f":"E(Rp) = w₁E(R₁) + w₂E(R₂) ; σp² = w₁²σ₁² + w₂²σ₂² + 2w₁w₂ρσ₁σ₂","note":"ρ < 1 ⇒ diversification."},{"name":"Bêta","f":"βᵢ = Cov(Rᵢ, Rₘ) ÷ Var(Rₘ) = ρᵢₘ × σᵢ ÷ σₘ","note":"Pente de la régression du titre sur le marché."},{"name":"MEDAF (CAPM)","f":"E(Rᵢ) = r_f + βᵢ × [E(Rₘ) − r_f]","note":"Donne ke pour le WACC."},{"name":"Ratio de Sharpe","f":"Sharpe = (Rp − r_f) ÷ σp","note":"Comparer des portefeuilles à risque différent."},{"name":"Bêta d'une entreprise endettée","f":"β_endetté = β_non endetté × [1 + (1 − t) × D ÷ E]","note":"Formule de Hamada."}],"quiz":[{"q":"Un coefficient de corrélation de −0,9 entre deux variables indique :","options":["Aucune relation","Une forte relation linéaire décroissante","Une causalité de x vers y","Une relation non linéaire"],"correct":1,"explain":"Proche de −1 : liaison linéaire forte et négative. Rien ne dit qu'elle est causale."},{"q":"Dans une régression, un coefficient a t = 0,8. On en conclut que :","options":["Il est significatif à 5 %","Il n'est pas significativement différent de zéro","Le modèle est faux","Le R² est élevé"],"correct":1,"explain":"|t| < 1,96 : on ne peut pas rejeter l'hypothèse β = 0 au seuil de 5 %."},{"q":"L'hétéroscédasticité :","options":["Biaise les coefficients MCO","Biaise les écarts-types des coefficients","Rend le R² négatif","N'a aucun effet"],"correct":1,"explain":"Les coefficients restent sans biais, mais les tests de significativité sont faussés ; remède : écarts-types robustes."},{"q":"Le test de Dickey-Fuller sert à :","options":["Détecter la multicolinéarité","Tester la stationnarité d'une série","Calculer un bêta","Mesurer l'efficience"],"correct":1,"explain":"Il teste la présence d'une racine unitaire ; sans stationnarité, risque de régression fallacieuse."},{"q":"Deux actifs de même écart-type 20 % et de corrélation 0. Un portefeuille 50/50 a un écart-type de :","options":["20 %","14,1 %","10 %","0 %"],"correct":1,"explain":"σp² = 0,25 × 0,04 + 0,25 × 0,04 + 0 = 0,02 ; σp = 14,1 %. La diversification réduit le risque."},{"q":"r_f = 3 %, prime de marché = 5 %, β = 1,4. Le rendement exigé par le MEDAF est :","options":["8 %","10 %","7 %","12 %"],"correct":1,"explain":"3 % + 1,4 × 5 % = 10 %."},{"q":"Selon la forme semi-forte de l'efficience :","options":["L'analyse technique bat le marché","L'information publique est déjà dans les prix","Les initiés ne gagnent jamais","Les prix sont aléatoires sans lien avec l'information"],"correct":1,"explain":"L'analyse fondamentale sur information publique ne permet pas de battre durablement le marché."},{"q":"On observe que les factures les plus relancées sont payées le plus tard. Conclure que la relance retarde le paiement est une erreur de :","options":["Multicolinéarité","Endogénéité (causalité inverse)","Saisonnalité","Stationnarité"],"correct":1,"explain":"On relance davantage les mauvais payeurs : la causalité va du retard vers la relance."}],"exercises":[{"title":"Calcul d'un bêta","statement":"Cov(Rᵢ, Rₘ) = 0,024, Var(Rₘ) = 0,016. Calcule le bêta puis le rendement exigé avec r_f = 2,5 % et une prime de marché de 6 %.","solution":"β = 0,024 ÷ 0,016 = 1,5. E(Rᵢ) = 2,5 % + 1,5 × 6 % = 11,5 %. Le titre amplifie les mouvements du marché de 50 %."},{"title":"Interpréter une régression","statement":"Délai de paiement (jours) = 32 + 0,004 × Montant (€) − 6,2 × Relances + 9,5 × Litige ; t respectifs : 5,1 ; 2,3 ; −3,8 ; 4,4 ; R² = 0,31 ; n = 1 200. Interprète.","solution":"Toutes choses égales par ailleurs : +1 000 € de montant → +4 jours (significatif, t = 2,3) ; chaque relance supplémentaire → −6,2 jours (significatif, t = −3,8) ; un litige → +9,5 jours (significatif). Le modèle explique 31 % de la variance : d'autres facteurs comptent (client, secteur). Vigilance : l'effet des relances peut être sous-estimé par endogénéité (on relance les mauvais payeurs) — le signe négatif est donc d'autant plus rassurant."},{"title":"Portefeuille de deux actifs","statement":"Actif A : E(R) = 8 %, σ = 15 %. Actif B : E(R) = 12 %, σ = 25 %. ρ = 0,3. Portefeuille 60 % A / 40 % B. Calcule E(Rp) et σp, puis le ratio de Sharpe avec r_f = 2 %.","solution":"E(Rp) = 0,6 × 8 + 0,4 × 12 = 9,6 %. σp² = 0,36 × 0,0225 + 0,16 × 0,0625 + 2 × 0,6 × 0,4 × 0,3 × 0,15 × 0,25 = 0,0081 + 0,01 + 0,0054 = 0,0235 ; σp = 15,3 %. Sharpe = (9,6 − 2) ÷ 15,3 = 0,50."}],"notes":""},{"id":"memoire","code":"S10","priority":2,"title":"Travail de recherche & compétences académiques","tagline":"Du sujet à la soutenance : problématique, revue de littérature, méthodologie, rédaction et défense du mémoire.","hue":318,"lessons":[{"title":"Choisir un sujet et formuler une problématique","html":"<p>Un bon sujet de mémoire professionnel croise trois cercles : ce qui intéresse l'entreprise d'accueil (un problème réel), ce que couvre le programme (un cadre théorique mobilisable) et ce à quoi tu as accès (données, interlocuteurs, temps).<\/p>\n<p>La <strong>problématique<\/strong> n'est pas un thème (« le recouvrement ») mais une question précise, discutable et à laquelle le mémoire répond : « Dans quelle mesure une priorisation des relances fondée sur un scoring de risque réduit-elle le délai de paiement d'une PME de services ? »<\/p>\n<p>Démarche en entonnoir : thème → constat / tension observée → question de recherche → hypothèses (H1 : la priorisation réduit le DSO ; H2 : l'effet est plus fort sur les petits clients) → périmètre (entreprise, période, données).<\/p>\n<div class=\"retenir\"><span class=\"label\">À retenir<\/span><p>Une problématique tient en une question ; si elle ne peut pas recevoir de réponse nuancée, ce n'est pas encore une problématique.<\/p><\/div>"},{"title":"La revue de littérature","html":"<p>La revue de littérature positionne ton travail : que sait-on déjà, quels concepts, quels résultats, quelles controverses, quelle place pour ta contribution ?<\/p>\n<ul>\n  <li><strong>Sources<\/strong> : articles académiques (Google Scholar, Cairn, SSRN, ScienceDirect), ouvrages de référence (Vernimmen pour la finance d'entreprise), rapports professionnels (Banque de France, AFDCC pour le crédit client), normes (IFRS 9).<\/li>\n  <li><strong>Lecture critique<\/strong> : pour chaque source, noter la question, la méthode, les résultats, les limites — dans une grille de lecture.<\/li>\n  <li><strong>Synthèse thématique<\/strong> (par idée) plutôt que chronologique ou auteur par auteur ; conclure chaque partie par ce qu'elle implique pour ton étude.<\/li>\n<\/ul>\n<p>Citer selon les <strong>normes APA<\/strong> : (Auteur, année) dans le texte ; référence complète en bibliographie : Auteur, A. (année). Titre. <em>Revue<\/em>, volume(numéro), pages.
